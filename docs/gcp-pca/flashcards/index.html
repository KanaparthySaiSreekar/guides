nd a reversed timestamp makes each meter’s newest readings sort first. A timestamp-first key sends every new write to the same key range and creates a hotspot. BigQuery is excellent for analytics but isn’t a millisecond serving store. Cloud SQL can’t absorb 1.5 million writes per second on one primary.","h":"l3wyf"},{"id":"d1-03","d":1,"s":"d1","n":1,"st":"A company runs a custom-built expense-reporting application on aging on-premises servers. Two engineers spend most of their time maintaining it, and three SaaS products already meet almost all of its requirements. Leadership wants to cut operational effort as the data center closes. Which workload disposition should you recommend?","op":[{"t":"Replace it with a SaaS product, migrate the historical data, and retire the custom application","c":1},{"t":"Refactor the application into microservices on GKE Autopilot","c":0},{"t":"Retain it on-premises until the next hardware refresh","c":0},{"t":"Rehost the application on Compute Engine with Migrate to Virtual Machines","c":0}],"ex":"When commodity SaaS meets the requirements and the custom app carries ongoing staff cost, buying (replace) and retiring is the disposition that removes operational effort. Rehosting moves the same maintenance burden to the cloud. Refactoring spends engineering time on a non-differentiating app. Retaining conflicts with the data-center closure.","h":"1wkwj"},{"id":"d1-04","d":1,"s":"d1","n":1,"st":"After migrating its customer-facing web store, an organization wants to prove the migration met its stated goal of “a faster, more reliable experience for shoppers.” Which success measure best supports that claim?","op":[{"t":"Monthly Google Cloud spend compared with the previous data-center cost","c":0},{"t":"The number of production deployments per week","c":0},{"t":"The number of on-premises virtual machines decommissioned","c":0},{"t":"The share of requests meeting a 300 ms latency target and the request success rate, compared with the pre-migration baseline","c":1}],"ex":"A KPI should measure the goal it reports on. Latency and success-rate SLIs, compared with a baseline, measure the shopper experience directly. VM counts and spend measure migration effort and cost. Deployment frequency is a delivery (DORA) metric and says nothing direct about what shoppers experience.","h":"19ura"},{"id":"d1-05","d":1,"s":"d1","n":1,"st":"An internal team serves an open-weight 8B-parameter model for document summarization. Traffic is a few hundred requests a day in irregular bursts, and nights and weekends are idle. They want minimal infrastructure management and no charges for idle accelerators. What should you recommend?","op":[{"t":"A GKE Standard cluster with an L4 GPU node pool, minimum one node","c":0},{"t":"A Compute Engine VM with an attached GPU, stopped by a cron job outside business hours","c":0},{"t":"A Cloud Run service with an NVIDIA L4 GPU attached, allowed to scale to zero","c":1},{"t":"An Agent Platform endpoint with one dedicated GPU replica always running","c":0}],"ex":"Cloud Run supports GPUs and scales to zero, so there’s no accelerator charge while idle and no cluster or VM to manage. A node pool with a minimum node and an always-on endpoint replica both bill for idle GPUs. A scheduled VM still idles between bursts during the day and adds scripting to maintain.","h":"1763x"},{"id":"d1-06","d":1,"s":"d1","n":1,"st":"A visual-effects studio renders frames overnight. Each frame is independent, jobs checkpoint every few minutes, and the deadline is the next morning. The studio wants the lowest compute cost without running its own scheduler. What should you recommend?","op":[{"t":"Sole-tenant nodes sized for the peak render load","c":0},{"t":"A three-year committed use discount sized for the peak number of render VMs","c":0},{"t":"Batch jobs that use the Spot provisioning model, with automatic task retries on preemption","c":1},{"t":"A regional managed instance group of standard VMs with CPU-based autoscaling","c":0}],"ex":"Independent, checkpointed work tolerates preemption, so Spot VMs (up to 91% cheaper than on-demand) are the cost answer, and Batch provides queuing and retries without a self-managed scheduler. A three-year commitment sized for the peak pays for idle daytime capacity. Sole-tenant nodes add cost for isolation the studio doesn’t need. Standard VMs cost several times more than Spot.","h":"2a5cj"},{"id":"d1-07","d":1,"s":"d1","n":1,"st":"A licensed analytics engine is billed per vCPU. It needs 4 vCPUs and 60 GB of memory. The closest predefined machine type has 8 vCPUs and 64 GB. How do you minimize licensing and compute cost?","op":[{"t":"Use a memory-optimized M-series machine type","c":0},{"t":"Create an N2 custom machine type with 4 vCPUs and extended memory to reach 60 GB","c":1},{"t":"Split the engine across two 2-vCPU VMs with 30 GB each behind an internal load balancer","c":0},{"t":"Use the 8-vCPU predefined machine type and limit the engine to 4 threads in its configuration","c":0}],"ex":"Custom machine types let you choose vCPUs and memory independently, and extended memory goes beyond the normal per-vCPU ratio, so 4 vCPUs with 60 GB is possible and the license counts 4 vCPUs. Limiting threads usually doesn’t change how per-vCPU licenses are counted. M-series machines are far larger than needed. Splitting the engine changes the architecture and may not be supported.","h":"3acws"},{"id":"d1-08","d":1,"s":"d1","n":1,"st":"A bank must keep call recordings for seven years. They are read only if a regulator or court asks for them, which happens a few times a decade, and they must not be deleted or changed before the period ends. What is the most cost-effective design?","op":[{"t":"Standard class with object versioning enabled","c":0},{"t":"Coldline class, with a lifecycle rule that deletes objects after seven years","c":0},{"t":"Nearline class, with an IAM deny policy that blocks storage.objects.delete","c":0},{"t":"Archive class, with a seven-year retention policy that is then locked","c":1}],"ex":"Archive is the cheapest class for data read less than once a year, and a locked retention policy (Bucket Lock) prevents deleting or replacing any object until it is seven years old, which is what regulators expect. Versioning doesn’t stop deletion. A lifecycle rule handles deletion afterwards but doesn’t enforce immutability before that. IAM deny policies can be changed by administrators, so they aren’t a compliance-grade lock.","h":"1168j"},{"id":"d1-09","d":1,"s":"d1","n":1,"st":"A research institute is moving a 450 TB archive to Cloud Storage as a one-time migration. Its only internet link is 1 Gbps and is shared with daily operations, and there are no plans for dedicated connectivity. The data must be in Cloud Storage within five weeks. What should you use?","op":[{"t":"Transfer Appliance","c":1},{"t":"gcloud storage cp running in parallel from several servers","c":0},{"t":"Storage Transfer Service with on-premises agents over the existing link","c":0},{"t":"A new 10 Gbps Partner Interconnect connection ordered for the migration","c":0}],"ex":"Even at a full 1 Gbps, 450 TB takes about six weeks, and this link is shared, so any online method misses the deadline. Transfer Appliance moves large one-time datasets offline. Storage Transfer Service and gcloud storage are both limited by the same link. Provisioning Interconnect for a one-time job adds lead time and recurring cost the institute doesn’t need.","h":"9srjf"},{"id":"d1-10","d":1,"s":"d1","n":1,"st":"A stateless web tier runs on a zonal managed instance group in us-east1-b. The business now requires it to survive a full zone outage automatically, with minimal operational effort. What should you do?","op":[{"t":"Take hourly snapshots of the boot disks and restore them in another zone after an outage","c":0},{"t":"Enable live migration on the VMs","c":0},{"t":"Create a second zonal managed instance group in us-east1-c and switch DNS to it during an outage","c":0},{"t":"Replace it with a regional managed instance group spread across three zones, with autohealing, behind the external Application Load Balancer","c":1}],"ex":"A regional MIG spreads instances across zones, autohealing replaces unhealthy VMs, and the load balancer routes around a failed zone with no manual step. Snapshots and DNS switching are manual recovery, not automatic failover. Live migration handles host maintenance, not zone outages.","h":"2zu66"},{"id":"d1-11","d":1,"s":"d1","n":1,"st":"An order-management app uses Cloud SQL for MySQL with high availability in europe-west1. A new requirement says that after a regional outage the database must be running in another region within one hour, losing no more than a few minutes of data, while keeping cost moderate. What should you add?","op":[{"t":"A migration to Spanner with a multi-region configuration","c":0},{"t":"A second high-availability configuration in the same region using a different pair of zones","c":0},{"t":"A cross-region read replica in europe-west4 that can be promoted during a regional outage","c":1},{"t":"Daily exports of the database to a multi-region Cloud Storage bucket","c":0}],"ex":"A cross-region replica receives changes continuously, so data loss is seconds to minutes, and promoting it takes minutes, well within the one-hour RTO. Daily exports risk up to 24 hours of data loss. HA protects against a zone failure only. Spanner would meet the target but needs a re-platform and costs far more than the requirement justifies.","h":"10nd9"},{"id":"d1-12","d":1,"s":"d1","n":1,"st":"Workloads in a VPC must resolve names in the on-premises zone corp.example.com, and on-premises servers must resolve names in a Cloud DNS private zone. Connectivity is through Cloud Interconnect. How should you configure DNS?","op":[{"t":"Copy all on-premises DNS records into a Cloud DNS public zone","c":0},{"t":"Create a Cloud DNS forwarding zone for corp.example.com that targets the on-premises DNS servers, and an inbound server policy so on-premises resolvers can forward queries into Cloud DNS","c":1},{"t":"Run BIND on Compute Engine VMs in each region and point every client at them","c":0},{"t":"Configure DNS peering between the VPC and the on-premises network","c":0}],"ex":"An outbound forwarding zone sends queries for the on-premises domain to on-premises resolvers, and an inbound server policy gives on-premises resolvers an entry point into Cloud DNS private zones. A public zone would expose internal names. Self-managed BIND adds operations work. DNS peering works only between VPC networks, not with on-premises.","h":"5hk2j"},{"id":"d1-13","d":1,"s":"d1","n":1,"st":"Employees spend hours searching for answers across Google Drive, SharePoint, Jira and Confluence. Leadership wants an assistant that answers with citations, respects each user’s existing document permissions, and can be rolled out within weeks with minimal custom development. What should you recommend?","op":[{"t":"Deploy Gemini Enterprise with connectors to the existing sources","c":1},{"t":"Load all documents into BigQuery and give employees Looker dashboards","c":0},{"t":"Build a RAG application on GKE with a custom embeddings pipeline for each source","c":0},{"t":"Fine-tune a Gemini model on an export of all company documents","c":0}],"ex":"Gemini Enterprise (formerly Agentspace) provides search and agents over connected sources, respects source permissions and cites its answers, without building infrastructure. A custom RAG stack can work but contradicts the timeline and the minimal-development requirement. Fine-tuning bakes in a stale snapshot and loses per-document permissions. Dashboards don’t answer natural-language questions.","h":"2bpwu"},{"id":"d1-14","d":1,"s":"d1","n":1,"st":"A support assistant must answer questions about product documentation that changes several times a day. Answers must reflect the latest content and cite the source page. Which approach best reduces hallucinations?","op":[{"t":"Ground the model in the documentation through retrieval (for example Search or RAG Engine) and return the retrieved citations","c":1},{"t":"Fine-tune Gemini every night on the full documentation set","c":0},{"t":"Switch to a larger model and raise the maximum output tokens","c":0},{"t":"Raise the model temperature so answers vary more","c":0}],"ex":"Retrieval-augmented generation (grounding) supplies the current documents at query time and lets the application cite them. Tuning shapes style and behavior but doesn’t keep fast-changing facts current, and a nightly run would lag intraday updates. A higher temperature adds randomness. A larger model still doesn’t know about content it never saw.","h":"1d22j"},{"id":"d1-15","d":1,"s":"d1","n":1,"st":"A team needs 64 GPUs for about four days to fine-tune a model. The job can start any time in the next week but must not be interrupted once it starts, and the budget is tight. Which consumption option fits best?","op":[{"t":"On-demand VMs requested immediately","c":0},{"t":"Spot VMs","c":0},{"t":"A one-year committed use discount","c":0},{"t":"Dynamic Workload Scheduler flex-start","c":1}],"ex":"Flex-start queues the request, starts the job once all the capacity is available, charges a discounted rate, and then runs uninterrupted for up to seven days. Spot is cheaper but can be preempted mid-run. A one-year commitment is wasted on a four-day job. On-demand costs more, and 64 GPUs may not be available at the moment you ask.","h":"1dac4"},{"id":"d1-16","d":1,"s":"d1","n":1,"st":"You are asked to plan the migration of about 1,200 on-premises VMs. Documentation is poor, and the CFO wants a cost comparison before approving the project. What should you do first?","op":[{"t":"Ask each application team to fill in a spreadsheet of server specifications","c":0},{"t":"Run Migration Center discovery to inventory servers, measure utilization and dependencies, and generate TCO and right-sized pricing reports","c":1},{"t":"Buy committed use discounts sized to the current on-premises core count","c":0},{"t":"Start migrating the largest applications with Migrate to Virtual Machines to show quick progress","c":0}],"ex":"Assessment comes first. Migration Center discovers assets and their performance data, maps dependencies for wave planning, and produces TCO and pricing reports based on right-sized targets. Migrating first skips planning. Manual spreadsheets are slow and inaccurate. Buying commitments before right-sizing locks in over-provisioning.","h":"rtktj"},{"id":"d1-17","d":1,"s":"d1","n":1,"st":"A company wants to reuse its existing Windows Server Datacenter licenses on Google Cloud. The licenses aren’t eligible for License Mobility. What do you need to use?","op":[{"t":"Premium Windows Server images from the public image catalog","c":0},{"t":"Standard multi-tenant VMs with the existing license key entered after boot","c":0},{"t":"Sole-tenant nodes, running Windows images the company imports itself","c":1},{"t":"Shielded VMs with vTPM enabled","c":0}],"ex":"Bring-your-own-license for Windows Server without License Mobility requires dedicated physical hardware, which on Compute Engine means sole-tenant nodes with imported images. Premium images already include a pay-as-you-go license, so you’d pay twice. Shielded VM is a security feature unrelated to licensing. Multi-tenant hosts don’t satisfy the license terms.","h":"ax9hn"},{"id":"d1-18","d":1,"s":"d1","n":1,"st":"A logistics firm runs Oracle Database with Real Application Clusters (RAC) and wants to move it to Google Cloud without changing the application or the database engine. What should you recommend?","op":[{"t":"Migrate to Cloud SQL for PostgreSQL with Database Migration Service","c":0},{"t":"Bare Metal Solution, connected to the application tier in a nearby Google Cloud region","c":1},{"t":"Migrate the database to Spanner using its PostgreSQL interface","c":0},{"t":"Run Oracle RAC on Compute Engine VMs with shared persistent disks","c":0}],"ex":"Bare Metal Solution provides certified hardware for Oracle workloads such as RAC, with low-latency connectivity to Google Cloud. Oracle Database@Google Cloud (Exadata and Autonomous Database in Google data centers) is the other no-change option. Cloud SQL and Spanner both mean changing the database. RAC isn’t supported on Compute Engine VMs.","h":"8ctxh"},{"id":"d1-19","d":1,"s":"d1","n":1,"st":"A payroll platform runs on 300 vCPUs of Compute Engine, 24 hours a day, and its size hasn’t changed in two years. It will run for at least three more years on the same machine series in one region. How do you cut compute cost the most?","op":[{"t":"Rely on sustained use discounts","c":0},{"t":"Move the platform to Spot VMs","c":0},{"t":"Buy a three-year resource-based committed use discount for the vCPUs and memory","c":1},{"t":"Buy a one-year flexible (spend-based) commitment and renew it every year","c":0}],"ex":"A stable 24×7 workload on a fixed machine series in one region is the textbook case for a three-year resource-based commitment, the deepest commitment discount. Sustained use discounts are automatic but smaller. Spot VMs can be reclaimed at any time, which payroll can’t tolerate. Flexible commitments trade discount for flexibility this platform doesn’t need.","h":"8qnyi"},{"id":"d1-20","d":1,"s":"d1","n":1,"st":"An e-commerce site needs rolling five-minute conversion rates from clickstream events. Events can arrive several minutes late, results must be correct despite duplicates, and the team doesn’t want to manage clusters. Which architecture should you choose?","op":[{"t":"Events written straight to BigQuery, with a scheduled query every five minutes","c":0},{"t":"Files in Cloud Storage, processed by an hourly Dataproc Spark job, loaded into BigQuery","c":0},{"t":"Pub/Sub, then Cloud Run functions that update counters in Cloud SQL","c":0},{"t":"Pub/Sub, then a Dataflow streaming pipeline with event-time windows and allowed lateness, then BigQuery","c":1}],"ex":"Dataflow (Apache Beam) handles event-time windows, watermarks, late data and deduplication, and it autoscales without clusters. Functions that update SQL counters can’t handle late or duplicate events and create write contention. An hourly Spark job misses the five-minute requirement and needs clusters. Scheduled queries mishandle late data and recompute the same windows over and over.","h":"gbrcc"},{"id":"d1-21","d":1,"s":"d1","n":1,"st":"A manufacturer will expose parts-ordering APIs to 300 dealers and third-party partners. It needs per-partner API keys and quotas, usage analytics, a developer portal for onboarding and, eventually, monetization. Which product should you choose?","op":[{"t":"Apigee","c":1},{"t":"An external Application Load Balancer with Cloud Armor rate limiting","c":0},{"t":"Cloud Endpoints","c":0},{"t":"API Gateway","c":0}],"ex":"Apigee is Google Cloud’s full-lifecycle API management platform, with API products and keys, quotas, analytics, developer portals and monetization. API Gateway is a lightweight managed gateway without portal or monetization features. Cloud Endpoints is the older option with limited management. A load balancer with Cloud Armor protects traffic but doesn’t manage APIs.","h":"162de"},{"id":"d1-22","d":1,"s":"d1","n":1,"st":"During flash sales the order service calls the inventory service synchronously. When inventory slows down, orders time out and are lost. Inventory updates can safely be applied a few seconds later. Which change best improves resilience?","op":[{"t":"Have the order service publish order events to Pub/Sub, and have the inventory service consume them asynchronously","c":1},{"t":"Merge both services into a single deployment","c":0},{"t":"Scale the inventory service vertically onto larger machines","c":0},{"t":"Add immediate retries without backoff in the order service","c":0}],"ex":"Asynchronous messaging decouples the services. Pub/Sub absorbs bursts, redelivers on failure, and lets inventory work at its own pace, so orders are still accepted while inventory is slow. Vertical scaling has limits and keeps the tight coupling. Retries without backoff amplify load during an incident. Merging the services removes independent scaling and deployment.","h":"1egda"},{"id":"d1-23","d":1,"s":"d1","n":1,"st":"Twenty product teams each own their own projects and budgets. A central network team must control subnets, firewall policies and the single Cloud Interconnect to on-premises, while the teams deploy their own VMs and GKE clusters. Which design should you use?","op":[{"t":"A separate VPC per team, each with its own Cloud VPN to on-premises","c":0},{"t":"A separate VPC per team, connected with VPC Network Peering","c":0},{"t":"Shared VPC, with a host project run by the network team and the teams’ projects attached as service projects","c":1},{"t":"One project for all teams, separated with IAM conditions","c":0}],"ex":"Shared VPC centralizes network administration (subnets, firewalls, hybrid connectivity) in a host project while teams keep their own projects, IAM and billing. Peering decentralizes control, isn’t transitive, and runs into peering limits. One shared project breaks budget and blast-radius isolation. Per-team VPNs duplicate connectivity and remove central control.","h":"15jlw"},{"id":"d1-24","d":1,"s":"d1","n":1,"st":"A news site hosted in us-central1 has readers worldwide. Most traffic is article pages and images that change a few times an hour, and readers in Asia report slow page loads. What should you do first to cut their latency at the lowest cost?","op":[{"t":"Deploy full copies of the application in three more regions","c":0},{"t":"Enable Cloud CDN on the external Application Load Balancer, with appropriate cache lifetimes","c":1},{"t":"Replace the load balancer with a regional external passthrough Network Load Balancer","c":0},{"t":"Move the site to a larger machine type","c":0}],"ex":"Serving cacheable content from Google’s edge cuts latency for distant readers and also reduces backend load and egress, with no application change. Multi-region deployment helps dynamic content but costs far more as a first step. A bigger machine doesn’t shorten network distance. A regional passthrough load balancer gives up the global front end and can’t use Cloud CDN.","h":"7a58t"},{"id":"d1-25","d":1,"s":"d1","n":1,"st":"A company’s nightly genomics batch jobs can run in any US region and have no latency requirements. As part of its sustainability goals, it wants to reduce the carbon footprint of this work without raising cost much. What should you do?","op":[{"t":"Run the jobs on-premises at night when electricity is cheaper","c":0},{"t":"Run the jobs in the region closest to headquarters","c":0},{"t":"Use larger machines so the jobs finish sooner","c":0},{"t":"Run the jobs in a US region with a high carbon-free energy percentage, using Google Cloud’s published region carbon data","c":1}],"ex":"The Well-Architected Framework’s sustainability pillar recommends running location-flexible workloads in low-carbon regions. Google publishes carbon-free energy (CFE%) figures per region and marks low-CO2 regions in the console. Distance to headquarters doesn’t matter for batch work. Bigger machines don’t cut total energy by themselves. Moving the work on-premises usually raises both emissions and cost.","h":"ujm8e"},{"id":"d1-26","d":1,"s":"d1","n":1,"st":"A legacy content-management system needs a shared POSIX file system, with file locking, mounted by both GKE pods and Compute Engine VMs. It must stay available if a zone fails. What should you use?","op":[{"t":"A persistent disk attached in multi-writer mode","c":0},{"t":"Local SSDs kept in sync with rsync","c":0},{"t":"Cloud Storage FUSE mounted on every node","c":0},{"t":"Filestore Regional tier","c":1}],"ex":"Filestore is managed NFS, the Regional tier replicates across zones, and GKE mounts it through the Filestore CSI driver. Cloud Storage FUSE isn’t fully POSIX-compliant (no file locking). Multi-writer persistent disks are zonal and need a cluster-aware file system. Local SSDs are ephemeral.","h":"1csku"},{"id":"d1-27","d":1,"s":"d1","n":1,"st":"An architect wants to describe an application in plain language (a web front end, an API, a PostgreSQL database and a cache), get a proposed Google Cloud architecture on a visual canvas, refine it, and export deployable Terraform. Which capability fits?","op":[{"t":"Infrastructure Manager","c":0},{"t":"Cloud Shell Editor with Cloud Code templates","c":0},{"t":"Gemini Cloud Assist with Application Design Center","c":1},{"t":"Migration Center","c":0}],"ex":"Gemini Cloud Assist can generate architectures from natural language in Application Design Center, where you refine components on a canvas and produce Terraform. Cloud Shell Editor and Cloud Code are coding tools. Migration Center assesses existing estates. Infrastructure Manager deploys Terraform but doesn’t design the architecture.","h":"1928i"},{"id":"d2-01","d":2,"s":"d2","n":1,"st":"A Cloud Run service must reach a Cloud SQL instance and a Memorystore instance on private IP addresses. The team wants the lowest latency and doesn’t want to manage extra connector instances. How should you configure networking?","op":[{"t":"Configure Direct VPC egress on the Cloud Run service so its traffic goes straight into the VPC","c":1},{"t":"Create a Serverless VPC Access connector sized for peak traffic","c":0},{"t":"Put a Cloud NAT gateway in front of the VPC","c":0},{"t":"Give Cloud SQL a public IP and allow 0.0.0.0/0 as an authorized network","c":0}],"ex":"Direct VPC egress sends Cloud Run traffic straight into a VPC subnet, with no connector VMs to size or pay for, and lower latency. A Serverless VPC Access connector works but adds managed instances, which the team wants to avoid. Opening a public IP to the world is insecure. Cloud NAT handles outbound internet traffic and doesn’t provide private reachability.","h":"ruvgi"},{"id":"d2-02","d":2,"s":"d2","n":1,"st":"Compute Engine VMs in a subnet have no external IP addresses, and an organization policy forbids adding any. Batch jobs on these VMs must read from Cloud Storage and write to BigQuery. What is the simplest Google-recommended approach?","op":[{"t":"Create a Cloud VPN tunnel to Google’s public API ranges","c":0},{"t":"Enable Private Google Access on the subnet","c":1},{"t":"Add a Cloud NAT gateway and send API traffic through it","c":0},{"t":"Peer the VPC with a Google-managed services network","c":0}],"ex":"Private Google Access, a per-subnet setting, lets VMs with only internal IPs reach Google APIs and services. Cloud NAT would also work, but it routes API traffic through NAT unnecessarily and isn’t the targeted answer. VPN isn’t how you reach Google APIs. Peering with a services network (Private Services Access) is for managed services such as Cloud SQL private IP, not for Google APIs.","h":"a4xnq"},{"id":"d2-03","d":2,"s":"d2","n":1,"st":"Your company uses a database service that a SaaS vendor runs in the vendor’s own Google Cloud organization. Your VPC’s IP ranges overlap with the vendor’s, and you must reach the service privately without exposing anything else. What should you use?","op":[{"t":"VPC Network Peering between the two VPCs","c":0},{"t":"Shared VPC, with the vendor’s project attached as a service project","c":0},{"t":"Private Service Connect: the vendor publishes a service attachment and you create an endpoint in your VPC","c":1},{"t":"An HA VPN tunnel between the two VPCs","c":0}],"ex":"Private Service Connect exposes one service through an endpoint IP in the consumer VPC. It works across organizations and with overlapping address ranges, and nothing else is exposed. Peering needs non-overlapping ranges and connects whole networks. Shared VPC works only inside one organization. VPN also needs non-overlapping routes and exposes more than one service.","h":"1ds0q"},{"id":"d2-04","d":2,"s":"d2","n":1,"st":"An enterprise has 15 VPC networks owned by different business units. They must stay separate networks, but each VPC must reach every other VPC and the on-premises data center through the existing Interconnect. Peering limits and non-transitive routing have become a problem. What should you implement?","op":[{"t":"Network Connectivity Center, with the VPCs as VPC spokes and the Interconnect VLAN attachments as hybrid spokes","c":1},{"t":"One Shared VPC that replaces all 15 networks","c":0},{"t":"Cloud VPN tunnels between every pair of VPCs","c":0},{"t":"A full mesh of VPC Network Peering connections","c":0}],"ex":"Network Connectivity Center is a hub-and-spoke model. In its default mesh topology every VPC spoke reaches every other, and hybrid spokes bring in on-premises routes, while each VPC stays separate. A full peering mesh is non-transitive and hits limits. Collapsing everything into one Shared VPC breaks the requirement to keep separate networks. Pairwise VPNs don’t scale and add cost.","h":"1jqf0"},{"id":"d2-05","d":2,"s":"d2","n":1,"st":"A bank needs private connectivity to Google Cloud with a 99.99% availability SLA. It has equipment in two colocation facilities, in different metropolitan areas, that both support Dedicated Interconnect. Which topology meets the SLA?","op":[{"t":"Two connections in one metro plus HA VPN as a backup path","c":0},{"t":"Two connections in one metro, in different edge availability domains, with one Cloud Router","c":0},{"t":"One 100 Gbps connection in each metro","c":0},{"t":"Four connections, two in each metro, each pair split across edge availability domains, with Cloud Routers in two regions and global dynamic routing","c":1}],"ex":"The 99.99% Dedicated Interconnect topology needs at least four connections, two in each of two metros, with each pair in separate edge availability domains, plus Cloud Routers in two regions and global dynamic routing. Two connections in one metro qualify for 99.9%. One connection per metro has no redundancy inside each metro. A VPN backup is good practice but doesn’t turn a 99.9% topology into 99.99%.","h":"1jf7d"},{"id":"d2-06","d":2,"s":"d2","n":1,"st":"A regulator requires all traffic between your data center and Google Cloud to be encrypted. You already use Dedicated Interconnect and need to keep its bandwidth and low latency. What should you do?","op":[{"t":"Add TLS to the web tier’s public endpoints only","c":0},{"t":"Enable MACsec for Cloud Interconnect, or run HA VPN over Cloud Interconnect","c":1},{"t":"Replace Dedicated Interconnect with HA VPN over the internet","c":0},{"t":"Rely on Google’s default encryption at rest","c":0}],"ex":"Interconnect traffic isn’t encrypted by default. MACsec encrypts at layer 2 between your router and Google’s edge, and HA VPN over Cloud Interconnect adds IPsec on top of the private link. Both keep the Interconnect path. Plain VPN over the internet gives up bandwidth and latency. Encryption at rest doesn’t cover data in transit. TLS on public endpoints leaves the rest of the traffic exposed.","h":"1s88y"},{"id":"d2-07","d":2,"s":"d2","n":1,"st":"A faulty script deleted thousands of objects from a Cloud Storage bucket two days ago. The bucket was created last year with default settings, and object versioning is off. What is the fastest way to recover the objects?","op":[{"t":"Open a support case asking Google to restore the bucket from its own backups","c":0},{"t":"Restore the soft-deleted objects, because soft delete keeps deleted objects for 7 days by default","c":1},{"t":"Re-run the upstream pipeline to regenerate the data","c":0},{"t":"Accept the loss, because the objects can’t be recovered without versioning","c":0}],"ex":"Cloud Storage soft delete is on by default with a 7-day retention period, so deleted objects can be listed and restored within that window even without versioning. Google doesn’t restore individual customer buckets from internal backups. Regenerating the data may be slow or impossible. Saying the data can’t be recovered ignores soft delete.","h":"qdxl5"},{"id":"d2-08","d":2,"s":"d2","n":1,"st":"A self-managed PostgreSQL VM uses a Hyperdisk Balanced volume and has hit its provisioned IOPS during month-end processing. The team can’t accept downtime this week. What should you do?","op":[{"t":"Take a snapshot and restore it to a pd-standard disk","c":0},{"t":"Add a Local SSD and move the database files onto it","c":0},{"t":"Increase the provisioned IOPS (and throughput if needed) on the existing Hyperdisk volume","c":1},{"t":"Stop the VM and change it to a larger machine type","c":0}],"ex":"Hyperdisk lets you change provisioned IOPS and throughput on a live volume, independent of capacity and without downtime, within the machine type’s limits. Changing the machine type needs a stop. Local SSD is ephemeral and risky for a primary database. pd-standard is slower, HDD-backed storage.","h":"4pgge"},{"id":"d2-09","d":2,"s":"d2","n":1,"st":"A GKE Standard cluster runs a latency-sensitive payments API and large nightly batch workers that tolerate interruption. You want to cut cost without putting the API at risk. What should you do?","op":[{"t":"Scale the API to zero replicas overnight","c":0},{"t":"Run the batch workers inside the API pods to share resources","c":0},{"t":"Convert every node pool to Spot VMs","c":0},{"t":"Create a Spot node pool for the batch workers, steer them there with a node selector and toleration, and keep the API on a standard node pool","c":1}],"ex":"Separate node pools let interruption-tolerant work use cheap Spot capacity while critical services stay on standard nodes. A taint on the Spot pool, with a matching toleration and selector on the batch pods, keeps placement clean. Making everything Spot risks preempting the payments API. Sharing pods hurts API latency. Scaling the API to zero takes payments offline.","h":"t9lrk"},{"id":"d2-10","d":2,"s":"d2","n":1,"st":"A startup with no Kubernetes operations experience wants to run 25 containerized microservices that rely on the Kubernetes API, sidecars and persistent volumes. It wants Google to manage nodes, upgrades and security hardening, and to pay only for what its pods request. What should you choose?","op":[{"t":"GKE Autopilot","c":1},{"t":"Cloud Run","c":0},{"t":"GKE Standard with node auto-provisioning","c":0},{"t":"Compute Engine with Docker installed on each VM","c":0}],"ex":"Autopilot manages nodes, scaling, upgrades and hardened defaults, and bills per pod resource request, while keeping the full Kubernetes API. GKE Standard leaves node management to the team. Cloud Run supports sidecars but doesn’t expose the Kubernetes API the services rely on. Docker on VMs means managing everything yourself.","h":"1fds8"},{"id":"d2-11","d":2,"s":"d2","n":1,"st":"You operate 3,000 Linux and Windows VMs across 40 projects. Auditors want evidence of patch compliance, and operations wants scheduled patch rollouts within maintenance windows. What should you use?","op":[{"t":"A startup script that runs the OS package manager at every boot","c":0},{"t":"Recreating every VM monthly from fresh public images","c":0},{"t":"VM Manager patch management, with patch deployments and compliance reporting","c":1},{"t":"Cloud Scheduler triggering SSH sessions to each VM","c":0}],"ex":"VM Manager’s patch management schedules patch jobs and recurring deployments across fleets, supports rollout controls and reports compliance. Startup scripts patch only at boot and give no reporting. Rebuilding VMs monthly is disruptive for stateful machines and still gives no compliance view. Scripted SSH is fragile and hard to audit.","h":"pk735"},{"id":"d2-12","d":2,"s":"d2","n":1,"st":"A company must vacate its data center in 10 weeks. It runs 600 VMs on vSphere, and operations wants to keep using vCenter, NSX and its existing runbooks during the first phase. What should you recommend?","op":[{"t":"Migrate to Virtual Machines to rehost every VM onto Compute Engine","c":0},{"t":"Google Cloud VMware Engine, migrating with VMware HCX","c":1},{"t":"Transfer Appliance to ship the VM disks","c":0},{"t":"Refactor the applications onto GKE before the deadline","c":0}],"ex":"VMware Engine runs a native VMware stack on Google Cloud, so teams keep vCenter, NSX and their tools, and HCX supports bulk and live migration on a tight timeline. Converting 600 VMs to Compute Engine in 10 weeks is risky and changes operations. Refactoring takes far too long. Transfer Appliance moves data, not running VMs.","h":"1v3u5"},{"id":"d2-13","d":2,"s":"d2","n":1,"st":"Data scientists retrain a churn model every week by running notebooks by hand. Results are hard to reproduce, and no one can tell which data and code produced the deployed model. What should you implement?","op":[{"t":"Agent Platform Pipelines that orchestrate data preparation, training, evaluation and deployment, tracking artifacts and lineage, with models versioned in Model Registry","c":1},{"t":"Cloud Scheduler triggering the notebooks on a Workbench instance","c":0},{"t":"A Cloud Composer DAG that copies the notebooks to Cloud Storage","c":0},{"t":"BigQuery scheduled queries that export the training data weekly","c":0}],"ex":"Pipelines (built with the Kubeflow Pipelines SDK) make each step a reproducible, parameterized component, record metadata and lineage, and can deploy through Model Registry behind evaluation gates. Scheduling the notebooks automates the run but not reproducibility or lineage. Copying notebooks or exporting data each solves only a slice of the problem.","h":"hqfbq"},{"id":"d2-14","d":2,"s":"d2","n":1,"st":"An ML team fine-tunes a model for about three hours every night. The training code saves checkpoints to Cloud Storage every 10 minutes and can resume from the latest one. They want to minimize accelerator cost. What should you recommend?","op":[{"t":"Buy a three-year committed use discount on the accelerators","c":0},{"t":"Reserve on-demand accelerators 24 hours a day","c":0},{"t":"Train on CPUs to avoid accelerator charges","c":0},{"t":"Train on Spot VMs (or Spot TPUs) and resume from the latest checkpoint after any preemption","c":1}],"ex":"Checkpointed, restartable training is what Spot capacity is for. It has the deepest discount, and a preemption costs at most a few minutes of work. Round-the-clock reservations and long commitments pay for 21 idle hours a day. CPUs take far longer and usually cost more overall for deep-learning training.","h":"1m6di"},{"id":"d2-15","d":2,"s":"d2","n":2,"st":"A bank wants to transcribe recorded customer calls and score the overall sentiment of each conversation. It prefers pretrained APIs and doesn’t want to train models. Which two services should you use? (Choose two.)","op":[{"t":"Translation API","c":0},{"t":"Speech-to-Text","c":1},{"t":"Natural Language API sentiment analysis","c":1},{"t":"Vision API","c":0},{"t":"Video Intelligence API","c":0}],"ex":"Speech-to-Text (Chirp models) turns audio into text, and the Natural Language API returns document- and sentence-level sentiment. Video Intelligence and Vision analyze video and images. Translation is needed only if calls must be translated.","h":"1xl1w"},{"id":"d2-16","d":2,"s":"d2","n":1,"st":"Legal counsel has approved one specific open-weight model for contract review. It must run in your own project, traffic must stay off the public internet, and data must not leave the organization’s VPC Service Controls perimeter. What should you do?","op":[{"t":"Deploy the model from Model Garden to an Agent Platform endpoint with private connectivity, inside the VPC Service Controls perimeter","c":1},{"t":"Fine-tune Gemini to imitate the approved model","c":0},{"t":"Download the model to developers’ laptops","c":0},{"t":"Call the model through a third-party hosted API","c":0}],"ex":"Model Garden can deploy open models into your own project on Agent Platform endpoints (or on GKE). Private endpoints through Private Service Connect keep traffic off the internet, and Agent Platform is supported by VPC Service Controls. A third-party API sends data outside the organization. Laptops break governance. A model that imitates the approved one isn’t the approved model.","h":"1a2o1"},{"id":"d2-17","d":2,"s":"d2","n":1,"st":"A strategy team wants to upload 40 analyst reports and internal memos, ask questions answered only from those sources with citations, and generate audio overviews for executives. The data must stay under the company’s Google Cloud identity, IAM and data-governance controls. What should you recommend?","op":[{"t":"A custom RAG pipeline built on GKE","c":0},{"t":"The consumer NotebookLM app (now Gemini Notebook) with personal Google accounts","c":0},{"t":"Fine-tuning a model on the 40 documents","c":0},{"t":"Gemini Notebook Enterprise (formerly NotebookLM Enterprise), as part of Gemini Enterprise","c":1}],"ex":"Gemini Notebook Enterprise (formerly NotebookLM Enterprise) gives source-grounded answers, citations and audio overviews under enterprise identity, IAM and compliance controls. The consumer app runs on personal accounts outside corporate governance. A custom pipeline rebuilds an existing product. Fine-tuning doesn’t cite sources.","h":"1x4e3"},{"id":"d2-18","d":2,"s":"d2","n":1,"st":"A multiplayer game server uses UDP, must see each player’s real source IP address, and runs in a single region. Which load balancer should you use?","op":[{"t":"External proxy Network Load Balancer","c":0},{"t":"Global external Application Load Balancer","c":0},{"t":"External passthrough Network Load Balancer","c":1},{"t":"Internal Application Load Balancer","c":0}],"ex":"The external passthrough Network Load Balancer is regional, supports UDP, and passes packets through with the client’s original IP. Application Load Balancers handle HTTP(S) only. Proxy Network Load Balancers terminate TCP connections, don’t carry UDP, and replace the source IP unless you use the PROXY protocol.","h":"112ev"},{"id":"d2-19","d":2,"s":"d2","n":1,"st":"Internal clients in us-east4 and us-central1 call an internal HTTP API that runs in both regions. If the API fails in one region, clients must automatically be served by the other, without exposing anything publicly. What should you configure?","op":[{"t":"Two regional internal passthrough Network Load Balancers, with client DNS changed during failures","c":0},{"t":"A cross-region internal Application Load Balancer with backends in both regions","c":1},{"t":"A global external Application Load Balancer locked down with Cloud Armor","c":0},{"t":"VPC Network Peering between the two regions","c":0}],"ex":"The cross-region internal Application Load Balancer has a global internal front end and backends in several regions, with automatic failover between them. Manual DNS changes aren’t automatic. An external load balancer exposes the API to the internet even with Cloud Armor in front. Regions inside one VPC are already connected, and peering doesn’t provide load balancing.","h":"nssql"},{"id":"d2-20","d":2,"s":"d2","n":1,"st":"Raw clickstream data in BigQuery is needed for 13 months of analysis and must then be deleted to satisfy the privacy policy. The table is partitioned by event date. What is the simplest way to enforce this?","op":[{"t":"Set a partition expiration of about 400 days on the table","c":1},{"t":"Use row-level security to hide old rows from analysts","c":0},{"t":"Export old partitions to Archive-class Cloud Storage each month","c":0},{"t":"Run a monthly scheduled query that deletes old rows","c":0}],"ex":"Partition expiration deletes each partition automatically once it reaches the set age, with no jobs to maintain. Scheduled DELETE queries cost compute and need upkeep. Exporting keeps the data, which breaks the deletion policy. Row-level security hides rows but doesn’t delete them.","h":"15ky7"},{"id":"d3-01","d":3,"s":"d3","n":1,"st":"A BigQuery dataset holding patient data sits inside a VPC Service Controls perimeter. A partner’s analytics project, outside your organization, must run queries against that one dataset using one specific service account, while everything else stays blocked. What should you do?","op":[{"t":"Create a perimeter bridge between your perimeter and the partner’s project","c":0},{"t":"Create an ingress rule that allows only that service account, from the partner project, to call the needed BigQuery methods on the dataset’s project","c":1},{"t":"Turn off the perimeter and rely on IAM","c":0},{"t":"Add the partner’s project to your service perimeter","c":0}],"ex":"Ingress and egress rules allow narrowly scoped access across a perimeter, limited to specific identities, projects, services and methods, without weakening it. Adding the partner’s project would make it fully trusted. Turning off the perimeter removes exfiltration protection. Perimeter bridges join perimeters within the same organization, so they can’t include an outside project.","h":"m2cc8"},{"id":"d3-02","d":3,"s":"d3","n":1,"st":"Security wants to make sure no one can grant IAM roles to Gmail accounts or identities from other companies, in any current or future project. What should you configure?","op":[{"t":"A weekly script that removes outside members from IAM policies","c":0},{"t":"VPC Service Controls around every project","c":0},{"t":"A custom IAM role without setIamPolicy permissions","c":0},{"t":"The iam.allowedPolicyMemberDomains organization policy, set at the organization node to the company’s Cloud Identity customer ID","c":1}],"ex":"Domain restricted sharing (iam.allowedPolicyMemberDomains) blocks IAM grants to principals outside the allowed Cloud Identity or Workspace customers. Set on the organization node, it’s inherited by every project, including future ones. A custom role doesn’t control who can be a member. Scripts are reactive. VPC Service Controls protect API data access, not IAM membership.","h":"u2ahc"},{"id":"d3-03","d":3,"s":"d3","n":1,"st":"A team’s GitHub Actions workflows deploy to Google Cloud with a service account JSON key stored as a repository secret. Security wants to eliminate long-lived keys. What should you do?","op":[{"t":"Store the key in Secret Manager and fetch it during the build","c":0},{"t":"Rotate the JSON key every 30 days","c":0},{"t":"Configure Workload Identity Federation with GitHub’s OIDC provider and let the workflow impersonate a least-privilege service account","c":1},{"t":"Grant the GitHub organization the Editor role on the project","c":0}],"ex":"Workload Identity Federation exchanges GitHub’s short-lived OIDC token for short-lived Google credentials, so there’s no key to leak, and attribute conditions can restrict which repository and branch may use it. Rotating or relocating the key still leaves a long-lived secret, and fetching it from Secret Manager needs credentials of its own. Editor is excessive and doesn’t remove keys.","h":"13wjo"},{"id":"d3-04","d":3,"s":"d3","n":1,"st":"On a GKE cluster, the orders service needs to publish to one Pub/Sub topic, and the reporting service needs to read one BigQuery dataset. Today both use the node’s Compute Engine default service account. What is the Google-recommended fix?","op":[{"t":"Create one node pool per service, each with a different node service account","c":0},{"t":"Use Workload Identity Federation for GKE so that each Kubernetes service account gets only its own IAM permissions","c":1},{"t":"Download a key for each Google service account and mount it as a Kubernetes Secret","c":0},{"t":"Grant both roles to the node service account","c":0}],"ex":"Workload Identity Federation for GKE gives each workload its own IAM identity without keys, so each service gets least privilege. Mounted keys are long-lived secrets. Granting both roles to the node account gives every pod on the node both permissions. Node pools per service are an expensive workaround and still coarser than per-workload identity.","h":"jrbee"},{"id":"d3-05","d":3,"s":"d3","n":1,"st":"Security policy requires separation of duties for encryption keys. The security team manages key lifecycles, application service accounts may only encrypt and decrypt, and no one may do both. Which design best meets this?","op":[{"t":"Keep keys in a dedicated key-management project, grant the security group roles/cloudkms.admin there, and grant application service accounts only roles/cloudkms.cryptoKeyEncrypterDecrypter on specific keys","c":1},{"t":"Give one platform team Owner on all projects so it can manage both keys and applications","c":0},{"t":"Create keys in each application project and give developers the Cloud KMS Admin role","c":0},{"t":"Use customer-supplied encryption keys kept in a shared spreadsheet","c":0}],"ex":"A separate key project with split roles enforces separation of duties. Key administrators can manage keys but can’t use them on data, and workloads can use specific keys but can’t manage them. Developers with KMS Admin in their own projects hold both duties. Owner everywhere is the opposite of separation of duties. Keys in a spreadsheet are a security incident.","h":"9m35q"},{"id":"d3-06","d":3,"s":"d3","n":1,"st":"A new policy requires CMEK for every Cloud Storage bucket, BigQuery dataset and persistent disk across hundreds of projects. Teams complain that creating key rings, keys and IAM bindings by hand slows them down. What should you recommend?","op":[{"t":"Switch to customer-supplied encryption keys","c":0},{"t":"Rely on default Google encryption and document an exception","c":0},{"t":"Use one shared key for every resource in the organization","c":0},{"t":"Enable Cloud KMS Autokey on the relevant folders, and pair it with an organization policy that requires CMEK","c":1}],"ex":"Autokey creates keys on demand with the right granularity, location and IAM bindings in a dedicated key project, so teams get compliant CMEK without manual setup, and the gcp.restrictNonCmekServices constraint enforces CMEK use. One shared key widens the blast radius. CSEK works with only a few services and puts key handling on every caller. An exception doesn’t meet the policy.","h":"dx7vz"},{"id":"d3-07","d":3,"s":"d3","n":1,"st":"A European regulator requires that encryption keys for certain workloads be held outside Google’s infrastructure by a third-party key manager, and that the customer can see and refuse each key-access request along with its justification. What should you use?","op":[{"t":"CMEK software keys rotated automatically every 30 days","c":0},{"t":"Default Google-managed encryption","c":0},{"t":"Cloud External Key Manager (Cloud EKM) with Key Access Justifications","c":1},{"t":"Cloud HSM keys in a European region","c":0}],"ex":"Cloud EKM keeps key material in a supported external key manager outside Google, and Key Access Justifications attach a reason to every access request so the customer’s policy can approve or deny it. Cloud HSM and CMEK software keys still live in Google’s infrastructure. Default encryption gives the customer no key control.","h":"1tzyz"},{"id":"d3-08","d":3,"s":"d3","n":1,"st":"Administrators need SSH access to Linux VMs that have no external IP addresses. Security forbids bastion hosts with public IPs and wants access tied to corporate identities, with 2-step verification and a full audit trail. What should you configure?","op":[{"t":"Port 22 open to 0.0.0.0/0, protected by strong passwords","c":0},{"t":"A bastion host with an external IP and shared SSH keys","c":0},{"t":"Identity-Aware Proxy TCP forwarding, with a firewall rule allowing 35.235.240.0/20, plus OS Login with 2-step verification","c":1},{"t":"A Cloud VPN connection for every administrator’s laptop","c":0}],"ex":"IAP TCP forwarding tunnels SSH to internal IPs after checking identity and IAM (roles/iap.tunnelResourceAccessor), and only IAP’s source range needs a firewall rule. OS Login ties Linux accounts to IAM identities, supports 2-step verification and logs access. Bastions with shared keys, per-user VPNs and public SSH all weaken the required controls.","h":"y4cd5"},{"id":"d3-09","d":3,"s":"d3","n":1,"st":"Contractors must reach an internal web application on Google Cloud, but only from company-managed devices with disk encryption turned on. You want to avoid a VPN. What should you implement?","op":[{"t":"Identity-Aware Proxy in front of the application, with an Access Context Manager access level that requires a managed, encrypted device (Chrome Enterprise Premium)","c":1},{"t":"VPC Service Controls around the application project","c":0},{"t":"A Cloud Armor policy that allows the contractors’ home IP addresses","c":0},{"t":"A shared username and password kept in Secret Manager","c":0}],"ex":"IAP with context-aware access, part of Chrome Enterprise Premium (formerly BeyondCorp Enterprise), checks both identity and device posture on every request, which is zero-trust access without a VPN. IP allowlists don’t verify device state and break when addresses change. Shared credentials remove accountability. VPC Service Controls protect Google API data, not user access to a web app.","h":"1mczc"},{"id":"d3-10","d":3,"s":"d3","n":1,"st":"Site reliability engineers occasionally need Project IAM Admin on production during incidents. Auditors object to standing access. What should you implement?","op":[{"t":"A shared break-glass account with its password in a safe","c":0},{"t":"Privileged Access Manager entitlements that grant the role temporarily after a justification and approval, expire automatically and are audit-logged","c":1},{"t":"Permanent role grants reviewed once a year","c":0},{"t":"IAM conditions that allow the role only on weekdays","c":0}],"ex":"Privileged Access Manager provides just-in-time, time-bound, approved elevation with a full audit trail, which removes standing privileged access. A shared account breaks accountability (keep at most one, for genuine emergencies). Annual reviews leave access in place all year. A weekday-only condition is still standing access.","h":"1fnyd"},{"id":"d3-11","d":3,"s":"d3","n":1,"st":"Only container images that were built by your Cloud Build pipeline and passed vulnerability scanning may run on production GKE clusters. Anything else must be blocked at deploy time. What should you configure?","op":[{"t":"An IAM policy that gives developers read-only access to Artifact Registry","c":0},{"t":"A nightly script that deletes pods running unscanned images","c":0},{"t":"A Kubernetes NetworkPolicy that blocks registries other than Artifact Registry","c":0},{"t":"Binary Authorization with a policy that requires attestations from the build pipeline (SLSA provenance) and from the vulnerability-scan check","c":1}],"ex":"Binary Authorization enforces policy at deploy time, admitting only images whose digests carry the required attestations, such as build provenance and a passed vulnerability check. NetworkPolicy controls pod traffic, not image admission. Registry IAM doesn’t prove how an image was built. A nightly cleanup is reactive and leaves a window of exposure.","h":"1k3vo"},{"id":"d3-12","d":3,"s":"d3","n":1,"st":"A customer-facing chatbot built on Gemini has been tricked into ignoring its instructions, and testers got it to repeat credit-card numbers that users had pasted in. Which control addresses both issues most directly?","op":[{"t":"Cloud Armor WAF rules on the load balancer","c":0},{"t":"VPC Service Controls around the Agent Platform project","c":0},{"t":"Lowering the model temperature to 0","c":0},{"t":"Model Armor, screening prompts and responses for prompt injection and jailbreaks, and using its Sensitive Data Protection integration to detect and block or de-identify card numbers","c":1}],"ex":"Model Armor screens LLM prompts and responses. It detects prompt injection and jailbreak attempts, harmful content and malicious URLs, and uses Sensitive Data Protection to find data such as card numbers. Cloud Armor inspects HTTP traffic for web attacks, not the meaning of prompts. Temperature affects randomness, not safety. VPC Service Controls stop exfiltration through Google APIs, not misuse through the chat interface.","h":"db111"},{"id":"d3-13","d":3,"s":"d3","n":1,"st":"Analysts need to join customer records across BigQuery datasets without seeing real email addresses. A small fraud team must occasionally recover the original values. Which Sensitive Data Protection de-identification method should you use?","op":[{"t":"Redaction","c":0},{"t":"Bucketing","c":0},{"t":"Deterministic encryption (or format-preserving encryption) with a key wrapped by Cloud KMS","c":1},{"t":"Character masking with an asterisk","c":0}],"ex":"Deterministic encryption always produces the same token for the same input, so joins still work, and authorized users with access to the KMS-wrapped key can reverse it. Redaction and masking destroy the value and can’t be reversed, and masking can break joins. Bucketing generalizes numbers or dates and doesn’t suit email addresses.","h":"1n68j"},{"id":"d3-14","d":3,"s":"d3","n":1,"st":"A company must make sure no Google Cloud resources are ever created outside the EU, in any project, including projects created next year. What should you do?","op":[{"t":"Ask teams to choose EU regions in their Terraform modules","c":0},{"t":"Set the gcp.resourceLocations organization policy at the organization node to allow only EU locations (for example in:eu-locations)","c":1},{"t":"Use VPC Service Controls to block non-EU regions","c":0},{"t":"Create budget alerts for spending outside the EU","c":0}],"ex":"The resource locations constraint stops location-bound resources from being created outside the allowed value groups, and it’s inherited by all current and future projects under the node. Terraform conventions aren’t enforced. Budget alerts arrive after the fact. VPC Service Controls don’t govern where resources are created. For stronger sovereignty commitments, add Assured Workloads.","h":"semzt"},{"id":"d3-15","d":3,"s":"d3","n":1,"st":"A hospital must be able to show who read each patient file stored in Cloud Storage over the past year. What must you configure?","op":[{"t":"Enable Data Access audit logs (DATA_READ) for Cloud Storage and route them with an aggregated sink to a log bucket with one-year retention","c":1},{"t":"Nothing, because Admin Activity audit logs record object reads","c":0},{"t":"Enable object versioning on the bucket","c":0},{"t":"Turn on Cloud Storage usage logs and keep them for 30 days","c":0}],"ex":"Object reads are data access, and Data Access audit logs for Cloud Storage are off by default, so DATA_READ must be enabled. Routing the logs centrally to a bucket with one-year retention meets the requirement. Admin Activity logs cover configuration changes, not reads. Versioning tracks object changes, not readers. Usage logs lack identity detail, and 30 days is too short.","h":"11vmr"},{"id":"d3-16","d":3,"s":"d3","n":1,"st":"The security team must block inbound traffic from a list of known-malicious IP ranges to every VM in the organization, and project owners must not be able to override the rule. What should you use?","op":[{"t":"VPC firewall rules at priority 0 in each project","c":0},{"t":"An organization policy constraint listing the IP ranges","c":0},{"t":"A hierarchical firewall policy at the organization node with a deny rule for those ranges","c":1},{"t":"Cloud Armor security policies on every load balancer","c":0}],"ex":"Hierarchical firewall policies attached at the organization or folder are evaluated before VPC firewall rules, and a deny there can’t be overridden by project-level rules. Per-project rules can be edited by project owners. Cloud Armor only sees traffic through supported load balancers. Organization policy constraints don’t filter network traffic.","h":"53itd"},{"id":"d3-17","d":3,"s":"d3","n":1,"st":"An online retailer is moving checkout to Google Cloud and wants to keep its PCI DSS scope as small as possible. What should you recommend first?","op":[{"t":"Store card numbers in BigQuery with column-level encryption","c":0},{"t":"Use a payment processor’s tokenization so raw card numbers never touch your systems, and isolate any remaining cardholder-data components in dedicated projects with tight network and IAM controls","c":1},{"t":"Put all workloads in one project protected by VPC Service Controls","c":0},{"t":"Enable Data Access audit logs on every service","c":0}],"ex":"The most effective way to reduce scope is to never handle card numbers. Tokenization at the processor keeps them out of your environment, and anything still in scope is segmented. Storing card numbers, even encrypted, brings those systems into scope. A single project mixes in-scope and out-of-scope systems. Audit logging is required but doesn’t reduce scope.","h":"1qhac"},{"id":"d3-18","d":3,"s":"d3","n":1,"st":"An education app for children under 13 is launching in the US. Product asks how the architecture should support children’s privacy rules such as COPPA. Which approach fits best?","op":[{"t":"Store all data in a multi-region bucket for durability","c":0},{"t":"Rely on Google’s compliance certifications to cover the app","c":0},{"t":"Collect as much behavioral data as possible now, in case it’s useful later","c":0},{"t":"Collect only the data the service needs, gate collection on verifiable parental consent, keep identifiers separate from usage data, and enforce short retention with automatic deletion (for example lifecycle rules or TTLs)","c":1}],"ex":"Children’s privacy rules center on data minimization, parental consent, limited retention and protecting identifiers, and the architecture should enforce these with consent checks, separation and automatic deletion. Collecting extra data breaks minimization. Durability isn’t privacy. Google’s certifications cover its infrastructure, while the app’s data practices remain the customer’s responsibility.","h":"2oh3z"},{"id":"d3-19","d":3,"s":"d3","n":1,"st":"External auditors need to read Data Access audit logs across all projects, but must not see any application data or change configurations. Which role should you grant, and where?","op":[{"t":"roles/logging.privateLogViewer at the organization level","c":1},{"t":"roles/logging.logWriter on each project","c":0},{"t":"roles/viewer at the organization level","c":0},{"t":"roles/owner on the logging project","c":0}],"ex":"Data Access audit logs are private logs, so reading them needs roles/logging.privateLogViewer (which also includes regular log-viewing permissions), and granting it at the organization covers every project through inheritance. Basic Viewer can’t read private logs and exposes resource metadata broadly. Owner is far too broad. Log Writer can write logs but not read them.","h":"22iyr"},{"id":"d3-20","d":3,"s":"d3","n":1,"st":"The organization enforces compute.vmExternalIpAccess so no VM can have an external IP. A vendor network appliance in one project needs one. What is the correct way to allow it?","op":[{"t":"Create a custom IAM role that includes compute.instances.addAccessConfig","c":0},{"t":"Move the project out of the organization","c":0},{"t":"Grant the project team roles/compute.admin, which bypasses organization policies","c":0},{"t":"Have an Organization Policy Administrator set a project-level policy for that constraint that allows only the appliance instance","c":1}],"ex":"Organization policies can be customized lower in the hierarchy by principals with the Organization Policy Administrator role. Here, a project-level policy for the list constraint allows only the named instance. IAM roles never bypass an organization policy. Moving the project out of the organization removes all governance. A custom role still can’t override the constraint.","h":"nzdbg"},{"id":"d4-01","d":4,"s":"d4","n":1,"st":"A team ships one large release a month, and about a third of releases cause incidents. Leadership wants faster delivery with fewer failures. Which change best addresses both?","op":[{"t":"Require director approval for every merge","c":0},{"t":"Move to small, frequent changes on a trunk-based workflow, with automated tests in Cloud Build and progressive (canary) rollouts through Cloud Deploy","c":1},{"t":"Freeze all releases for a quarter","c":0},{"t":"Add a longer manual QA phase before each monthly release","c":0}],"ex":"Small batches, test automation and progressive delivery lower the risk of each change and speed up delivery, which DORA research associates with high-performing teams. A longer QA phase and extra approvals slow delivery without reducing batch size. A freeze stops delivery altogether.","h":"1jhfp"},{"id":"d4-02","d":4,"s":"d4","n":2,"st":"An engineering director wants two metrics that show the stability of software delivery rather than its speed. Which two DORA metrics should you track? (Choose two.)","op":[{"t":"Change failure rate","c":1},{"t":"Lead time for changes","c":0},{"t":"Story points completed per sprint","c":0},{"t":"Time to restore service (failed deployment recovery time)","c":1},{"t":"Deployment frequency","c":0}],"ex":"In DORA’s model, change failure rate and time to restore service (now called failed deployment recovery time) measure stability. Deployment frequency and lead time measure throughput. Story points aren’t a DORA metric.","h":"herou"},{"id":"d4-03","d":4,"s":"d4","n":1,"st":"After a two-hour outage caused by a misconfigured firewall change, management asks how to prevent a repeat. Which practice matches Google’s SRE guidance?","op":[{"t":"Hold a blameless postmortem that records the timeline and contributing causes, and track action items such as automated config validation and staged rollout of network changes","c":1},{"t":"Find the engineer responsible and remove their production access","c":0},{"t":"Close the incident as soon as service is restored","c":0},{"t":"Allow network changes only on weekends","c":0}],"ex":"Blameless postmortems focus on systemic causes and on concrete, tracked fixes such as pre-deployment validation and progressive rollout. Blame discourages people from reporting problems. Weekend-only changes move the risk without reducing it. Closing an incident without follow-up invites a repeat.","h":"5rbbm"},{"id":"d4-04","d":4,"s":"d4","n":1,"st":"Platform engineers change shared Terraform modules that build networks and IAM for 200 projects, and a recent change broke production firewall rules. How should infrastructure changes be validated before they reach production?","op":[{"t":"Have a senior engineer review the code by eye","c":0},{"t":"Apply changes directly to production during low-traffic hours","c":0},{"t":"In CI, run terraform plan and policy checks (for example gcloud terraform vet against your constraints) on every pull request, apply to staging first, and promote the same version to production","c":1},{"t":"Turn off Terraform state locking so pipelines run faster","c":0}],"ex":"Treat infrastructure like application code. Automated plans, policy-as-code checks and staged promotion catch mistakes before production. Applying straight to production is how the incident happened. Visual review alone misses things. Turning off state locking risks corrupting the state.","h":"1aa7x"},{"id":"d4-05","d":4,"s":"d4","n":1,"st":"Application teams wait weeks for the platform team to build standard three-tier environments. The platform team wants teams to self-serve while staying inside security guardrails. What should you do?","op":[{"t":"Email teams a PDF of best practices","c":0},{"t":"Keep building every environment by hand in the platform team","c":0},{"t":"Publish approved, versioned Terraform templates with compliant defaults (for example through Application Design Center or a project factory) and let teams deploy them through a pipeline, backed by organization policies","c":1},{"t":"Give every team Owner on a shared project","c":0}],"ex":"A curated self-service catalog of approved infrastructure templates, deployed by automation and backed by organization policies, gives both speed and guardrails. Owner on a shared project removes the guardrails. A document isn’t enforceable. Manual provisioning is the bottleneck you’re trying to remove.","h":"16d4w"},{"id":"d4-06","d":4,"s":"d4","n":1,"st":"An annual disaster-recovery test failed because the runbooks were out of date and nobody had practiced the failover. What should you recommend?","op":[{"t":"Automate the failover steps, keep runbooks alongside the infrastructure code, and run regular DR drills that measure the actual RTO and RPO against their targets","c":1},{"t":"Test only the backups, not the failover","c":0},{"t":"Stop testing, because tests themselves create risk","c":0},{"t":"Buy a second support contract","c":0}],"ex":"Reliable recovery comes from practice and automation. Regular drills show whether the real RTO and RPO meet their targets and keep runbooks current. Skipping tests hides problems. A support contract doesn’t practice your failover. Backups without a tested restore and failover process won’t meet the RTO.","h":"k5ekp"},{"id":"d4-07","d":4,"s":"d4","n":1,"st":"The finance team is blocking a migration because it fears unpredictable cloud bills. As the architect, how do you best address the concern?","op":[{"t":"Assure finance that cloud is always cheaper","c":0},{"t":"Present a Migration Center TCO analysis, a labeling and billing-export plan for cost showback by team, budgets with alerts, and a commitment plan for the steady baseline","c":1},{"t":"Promise a fixed monthly bill","c":0},{"t":"Postpone the conversation until after the migration","c":0}],"ex":"Good stakeholder management answers the specific concern with evidence and controls: a TCO model, cost visibility and attribution, alerting, and commitments that make baseline spend predictable. Blanket claims, delays and promises you can’t keep all erode trust.","h":"1uprk"},{"id":"d4-08","d":4,"s":"d4","n":1,"st":"An operations team with deep VM experience but no container experience must run a new GKE-based platform in six months. What should you recommend?","op":[{"t":"Give the team production access on day one and let them learn by doing","c":0},{"t":"Hire an outside team and keep current staff off the project","c":0},{"t":"Postpone GKE until every engineer is certified","c":0},{"t":"Assess the skill gaps, then run a structured plan: Google Skills learning paths and labs, pairing with experienced engineers, and starting on GKE Autopilot to reduce the operational surface","c":1}],"ex":"Change management for a new technology combines a skills assessment, structured training, mentoring and a lower-risk starting point such as Autopilot. Excluding current staff hurts morale and leaves no in-house knowledge of the platform. Waiting for everyone to be certified stalls the project. Unprepared production access invites incidents.","h":"kuk5m"},{"id":"d4-09","d":4,"s":"d4","n":1,"st":"An online retailer’s web tier needs about 200 vCPUs year-round and up to 1,000 vCPUs during holiday peaks lasting a few weeks. Which purchasing approach minimizes cost?","op":[{"t":"Buy committed use discounts for the 200-vCPU baseline and autoscale on-demand capacity for the peaks","c":1},{"t":"Buy committed use discounts for 1,000 vCPUs","c":0},{"t":"Buy no commitments and rely on sustained use discounts","c":0},{"t":"Run everything on Spot VMs","c":0}],"ex":"Commit to the steady baseline, which earns the deepest discount with no waste, and pay on-demand only for short peaks through autoscaling. Committing to the peak wastes most of the commitment for most of the year. Spot VMs can be reclaimed, which a customer-facing web tier can’t tolerate. Sustained use discounts alone leave savings on the table.","h":"tagdm"},{"id":"d4-10","d":4,"s":"d4","n":2,"st":"Analysts query a 60 TB events table many times a day, and on-demand BigQuery costs have tripled. Most queries look at the last 7 days and filter by customer_id. Which two changes reduce cost the most? (Choose two.)","op":[{"t":"Add LIMIT 1000 to every query","c":0},{"t":"Partition the table by event date and require a partition filter","c":1},{"t":"Lengthen the table’s default expiration","c":0},{"t":"Cluster the table by customer_id","c":1},{"t":"Export the table to Cloud SQL","c":0}],"ex":"Date partitioning with a required partition filter limits scans to recent partitions, and clustering by customer_id reduces the bytes read within them, so together they shrink bytes billed. Cloud SQL can’t serve 60 TB of analytics. LIMIT doesn’t reduce bytes scanned in BigQuery. Expiration settings don’t lower the cost of querying data you keep.","h":"nnsnz"},{"id":"d4-11","d":4,"s":"d4","n":1,"st":"After a migration, the monthly bill is higher than forecast. You suspect over-provisioned VMs and forgotten resources. What is the quickest way to find savings?","op":[{"t":"Move every VM to Spot","c":0},{"t":"Review and apply Active Assist recommendations (VM rightsizing, idle VMs, idle disks and unused IP addresses)","c":1},{"t":"Delete every VM with average CPU below 50%","c":0},{"t":"Open a support case asking Google to lower prices","c":0}],"ex":"Active Assist recommenders analyze real utilization and flag rightsizing opportunities and idle resources with estimated savings. A blanket CPU threshold ignores memory, usage patterns and business needs. Moving everything to Spot puts critical workloads at risk. A support case won’t right-size your estate.","h":"gmcs5"},{"id":"d4-12","d":4,"s":"d4","n":1,"st":"Developer sandbox projects must never spend more than $500 a month. What should you implement?","op":[{"t":"A budget with a $500 threshold, which stops spending automatically when reached","c":0},{"t":"A weekly manual review of costs","c":0},{"t":"A budget whose alerts publish to Pub/Sub, triggering a Cloud Run function that disables billing on the project (or shuts resources down) when the threshold is reached","c":1},{"t":"A quota of 500 Compute Engine CPUs","c":0}],"ex":"Budgets only notify; they don’t cap spending. Programmatic budget notifications through Pub/Sub can trigger automation that disables billing or stops resources. CPU quotas don’t map to dollars. Weekly reviews react too late.","h":"vsogd"},{"id":"d4-13","d":4,"s":"d4","n":1,"st":"You are asked to design a business continuity plan for a portfolio of 40 applications. What should you do first?","op":[{"t":"Buy the Premium support plan","c":0},{"t":"Copy all data to an Archive-class bucket","c":0},{"t":"Deploy all 40 applications active-active in two regions","c":0},{"t":"Run a business impact analysis with stakeholders to rank the applications by criticality and agree an RTO and RPO for each","c":1}],"ex":"Continuity planning starts with the business impact of each system’s downtime and data loss. That sets each RTO and RPO, which in turn determine the DR pattern and its cost. Active-active everywhere wastes money on non-critical systems. A support plan or an archive is part of a plan, not where it starts.","h":"1laa1"},{"id":"d4-14","d":4,"s":"d4","n":1,"st":"Two senior engineers disagree about whether a new service should run on Cloud Run or GKE, and the discussion has stalled for weeks. As the architect, how should you resolve it?","op":[{"t":"Escalate to the CEO","c":0},{"t":"Agree decision criteria tied to the requirements (operational effort, scaling, portability, cost, team skills), run a time-boxed proof of concept where evidence is missing, and record the decision and its trade-offs in an architecture decision record","c":1},{"t":"Choose the option you personally prefer","c":0},{"t":"Let each engineer build their own version in production","c":0}],"ex":"Good decisions are explicit and evidence-based: agreed criteria, a short proof of concept where evidence is missing, and a written record of the trade-offs so the decision can be revisited if circumstances change. The other options are arbitrary, wasteful, or avoid the architect’s responsibility.","h":"1w0x9"},{"id":"d4-15","d":4,"s":"d4","n":1,"st":"Minutes after a new release, a customer-facing API’s error rate jumps from 0.1% to 8%. What should the on-call engineer do first?","op":[{"t":"Roll back to the previous known-good release to restore service, then investigate","c":1},{"t":"Wait to see whether the errors clear on their own","c":0},{"t":"Add more instances","c":0},{"t":"Start a detailed root-cause investigation in the logs before changing anything","c":0}],"ex":"When a change lines up with an incident, mitigate first. Rolling back restores users quickly, and root-cause analysis follows. Investigating first prolongs the outage. More instances don’t fix a bad release. Waiting burns error budget and customer trust.","h":"1afg6"},{"id":"d5-01","d":5,"s":"d5","n":1,"st":"Developers want to run integration tests for code that uses Pub/Sub, Spanner and Firestore, on laptops and in CI, without creating or paying for cloud resources. What should they use?","op":[{"t":"Hand-written mocks for every client library call","c":0},{"t":"Shared development projects with real instances","c":0},{"t":"Cloud Shell and its 5 GB home directory","c":0},{"t":"The Google Cloud emulators for Pub/Sub, Spanner and Firestore, started with gcloud emulators","c":1}],"ex":"Google provides local emulators for Pub/Sub, Spanner, Firestore, Datastore and Bigtable, which client libraries reach through environment variables, at no cost and with fast feedback. Shared projects cost money and cause tests to interfere with each other. Hand-written mocks miss real API behavior. Cloud Shell is an environment, not an emulator.","h":"sde2h"},{"id":"d5-02","d":5,"s":"d5","n":1,"st":"A batch job calling a Google Cloud API intermittently gets HTTP 429 and 503 responses. What is the recommended client behavior?","op":[{"t":"Retry immediately in a tight loop until the call succeeds","c":0},{"t":"Ignore the errors","c":0},{"t":"Retry with truncated exponential backoff and jitter, and if 429s persist, review usage and request a quota increase","c":1},{"t":"Switch to another region’s endpoint after every error","c":0}],"ex":"Google’s guidance for rate-limit and transient errors is truncated exponential backoff with jitter, which the Cloud Client Libraries apply to many calls. Persistent 429s mean you need to send fewer requests or get more quota. Tight retry loops make throttling worse. Hopping regions isn’t a general fix. Ignoring errors loses data.","h":"1ozzx"},{"id":"d5-03","d":5,"s":"d5","n":1,"st":"A developer’s local application must call Cloud Storage with the same permissions as the production service account, without downloading any keys. What should the developer do?","op":[{"t":"Use Application Default Credentials with service account impersonation (for example gcloud auth application-default login --impersonate-service-account)","c":1},{"t":"Create and download a service account key","c":0},{"t":"Use an API key","c":0},{"t":"Put their personal password in the code","c":0}],"ex":"Application Default Credentials with impersonation produce short-lived tokens for the service account, as long as the developer holds roles/iam.serviceAccountTokenCreator on it, so no key ever exists. A downloaded key is a long-lived secret. Passwords in code are a breach waiting to happen. API keys don’t carry an IAM identity for most Cloud APIs.","h":"z3b9v"},{"id":"d5-04","d":5,"s":"d5","n":1,"st":"Five engineers run Terraform against the same Google Cloud environment, and their local state files keep drifting apart. What should you configure?","op":[{"t":"A separate copy of the state for each engineer","c":0},{"t":"Deleting the state and re-importing resources every week","c":0},{"t":"Commit terraform.tfstate to Git after every apply","c":0},{"t":"A remote backend in a Cloud Storage bucket with object versioning (Terraform then uses state locking), with applies run from a CI pipeline","c":1}],"ex":"A Cloud Storage backend gives a shared state with locking, and bucket versioning allows recovery. Running applies from CI serializes changes and adds review. State in Git
