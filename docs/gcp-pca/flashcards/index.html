:root{--field-line:#74849C;--knob-on:#FFFFFF}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
scroll-padding-top:calc(72px + env(safe-area-inset-top));scroll-padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body{margin:0;color:var(--text);font:400 var(--fs-ui)/1.55 var(--font-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100dvh;
background-color:var(--bg);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
background-size:28px 28px;overflow-x:clip}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em;line-height:1.2}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
code{font-family:var(--font-mono);font-size:.84em;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:.06em .36em;overflow-wrap:anywhere;font-synthesis-weight:none}
strong,b{font-weight:600}
mark{background:var(--mark);color:var(--mark-ink,inherit);border-radius:3px;padding:0 .1em;box-shadow:inset 0 -2px 0 var(--mark-line)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
#focus:focus,#back:focus,#fb:focus,main:focus{outline:none}
::selection{background:var(--accent-soft)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--surface);color:var(--text);padding:10px 14px;border:1px solid var(--border-strong);border-radius:var(--r-sm)}
.skip:focus{top:8px}
[hidden],.hidden{display:none!important}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.ic.fill{fill:currentColor}
.boot{padding:40vh 16px 0;text-align:center;color:var(--text-3)}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.muted{color:var(--text-2)} .faint{color:var(--text-3)} .small{font-size:var(--fs-meta)}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--border-strong);
background:var(--surface);color:var(--text);font-weight:600;font-size:var(--fs-ui);box-shadow:var(--shadow-sm);user-select:none;-webkit-user-select:none;
transition:transform .1s ease-out,background .12s,border-color .12s,color .12s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--on-accent);box-shadow:0 6px 18px -10px var(--btn-glow)}
.btn.good{background:var(--good);border-color:transparent;color:var(--on-status)}
.btn.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
.btn.again{color:var(--flag);border-color:color-mix(in srgb,var(--flag) 45%,transparent);background:var(--flag-soft)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.icon{width:48px;padding:0;flex:none}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:transparent;color:var(--on-status)}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--text-2);flex:none}
.iconbtn:active{background:var(--surface-2)}
.iconbtn[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.iconbtn.star[aria-pressed="true"]{color:var(--flag);background:var(--flag-soft)}
kbd{font:500 11px var(--font-mono);color:inherit;border:1px solid color-mix(in srgb,currentColor 45%,transparent);border-radius:5px;padding:0 4px;margin-left:2px}
@media (hover:none){kbd{display:none}}
.home{padding-top:calc(18px + env(safe-area-inset-top));padding-bottom:calc(116px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:flex-start;gap:12px}
.top .grow{flex:1;min-width:0}

  const rid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 12)}`);

  let dev = ls.get('guides.device'), first = false;

  // A named link (?u=asha) labels this browser from now on; the parameter is removed from the address bar.

    const url = new URL(location.href), named = url.searchParams.get('u');

  // ---------- queue ----------
  const QK = 'guides.queue', MAXQ = 1000;
  let mem = null; // used only when localStorage is unavailable (private mode, blocked storage)
  const readQ = () => { if (mem) return mem.slice(); try { return JSON.parse(ls.get(QK) || '[]'); } catch { return []; } };
  const writeQ = q => { q = q.slice(-MAXQ); if (!ls.set(QK, JSON.stringify(q))) mem = q; };
  const sid = rid();
  let hints = {};
  if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
    navigator.userAgentData.getHighEntropyValues(['model', 'platformVersion']).then(v => { hints = { model: v.model || undefined, platformVersion: v.platformVersion || undefined }; }).catch(() => { });
  }
  const ctx = () => {
    const n = navigator, ud = n.userAgentData;
    return {
      screen: `${screen.width}x${screen.height}`, view: `${innerWidth}x${innerHeight}`, dpr: Math.round((devicePixelRatio || 1) * 100) / 100,
      tz: (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { return undefined; } })(), lang: n.language,
      touch: n.maxTouchPoints || 0, platform: ud ? ud.platform : undefined, mobile: ud ? ud.mobile : undefined,
      standalone: (matchMedia('(display-mode: standalone)').matches || n.standalone === true) || undefined,
      mem: n.deviceMemory, cores: n.hardwareConcurrency, net: n.connection ? n.connection.effectiveType : undefined, ...hints,
    };
  };
  const body = batch => JSON.stringify({ dev, usr: ls.get('guides.user') || undefined, ctx: ctx(), events: batch });
  function push(t, data) {
    const q = readQ();
    q.push({ ...data, eid: rid(), t, at: Date.now(), sid, app: APP, path: (location.pathname + location.hash).slice(0, 200) });

    schedule(1500);

  // ---------- sending ----------
  let busy = false, timer = 0;
  function schedule(ms) { clearTimeout(timer); timer = setTimeout(flush, ms); }
  async function flush() {
    if (busy || navigator.onLine === false) return;
    const batch = readQ().slice(0, 100);

    busy = true;

    try {

      // 400 and 413 mean the collector will never take this batch: drop it instead of retrying forever.

    } catch { }

    if (readQ().length) schedule(sent ? 500 : 30000);
  }
  // Leaving the page: hand the queue to the browser to deliver. It stays queued until a confirmed send.
  const beacon = () => { const q = readQ(); if (q.length && navigator.sendBeacon) { try { navigator.sendBeacon(EP, new Blob([body(q.slice(0, 100))], { type: 'text/plain' })); } catch { } } };
  addEventListener('online', () => schedule(500));

  // ---------- what is recorded ----------
  // Active time: visible time, cut off five minutes after the last touch, key or scroll so an idle open tab does not count.
  let shownAt = document.visibilityState === 'visible' ? Date.now() : 0, lastInput = Date.now();

  }

})();

y control","6.6":"Reliability of solutions in production"},"traps":{},"rows":{},"cards":[{"id":"SER-compute-compute-engine","k":"service","d":1,"o":"1.3","g":"Compute","f":"Compute Engine","q":"When do you pick it, and what should you watch for?","b":"You need OS control, a lift-and-shift, specific kernels or licenses, or GPUs/TPUs on VMs.","x":[["Watch out for","You own patching (use VM Manager), sizing and the HA design."]],"h":"p1s07"},{"id":"SER-compute-managed-instance-groups","k":"service","d":1,"o":"1.3","g":"Compute","f":"Managed instance groups","q":"When do you pick it, and what should you watch for?","b":"Stateless VM fleets that need autoscaling, autohealing and rolling updates. A regional MIG spreads instances across zones.","x":[["Watch out for","Health-check probes come from `35.191.0.0/16` and `130.211.0.0/22`, so allow them in the firewall."]],"h":"1hy5f"},{"id":"SER-compute-spot-vms","k":"service","d":1,"o":"1.3","g":"Compute","f":"Spot VMs","q":"When do you pick it, and what should you watch for?","b":"Fault-tolerant batch, CI, rendering and checkpointed training, at up to 91% off.","x":[["Watch out for","Can be reclaimed at any time (best-effort shutdown of up to 30 s; you can ask for a 120 s preemption notice), and have no SLA. Legacy preemptible VMs also stop after 24 h; Spot has no maximum runtime."]],"h":"1hikm"},{"id":"SER-compute-sole-tenant-nodes","k":"service","d":1,"o":"1.3","g":"Compute","f":"Sole-tenant nodes","q":"When do you pick it, and what should you watch for?","b":"BYOL that needs dedicated hardware (for example Windows Server without License Mobility), or compliance isolation.","x":[["Watch out for","You pay for the whole node."]],"h":"13kb9"},{"id":"SER-compute-custom-machine-types","k":"service","d":1,"o":"1.3","g":"Compute","f":"Custom machine types","q":"When do you pick it, and what should you watch for?","b":"Unusual vCPU-to-memory ratios, or licenses priced per core.","x":[["Watch out for","Extended memory goes beyond the normal ratio. You can also set threads per core to 1 to cut licensed vCPUs."]],"h":"1a1e3"},{"id":"SER-compute-gke-standard","k":"service","d":1,"o":"1.3","g":"Compute","f":"GKE Standard","q":"When do you pick it, and what should you watch for?","b":"You need node-level control: node pools, DaemonSets, custom node images, specific GPUs.","x":[["Watch out for","You manage node pools. Spot node pools suit batch work."]],"h":"1rov0"},{"id":"SER-compute-gke-autopilot","k":"service","d":1,"o":"1.3","g":"Compute","f":"GKE Autopilot","q":"When do you pick it, and what should you watch for?","b":"Kubernetes with the least operations: Google runs the nodes, you pay per pod request, hardened by default.","x":[["Watch out for","No privileged containers (except allowlisted partner workloads) and no node SSH. GPUs and TPUs are available through compute classes."]],"h":"l8cjc"},{"id":"SER-compute-cloud-run-services","k":"service","d":1,"o":"1.3","g":"Compute","f":"Cloud Run services","q":"When do you pick it, and what should you watch for?","b":"Stateless HTTP, gRPC or WebSocket containers that scale to zero. L4 GPUs for serverless inference.","x":[["Watch out for","Requests time out after up to 60 min. Set min instances to avoid cold starts. Reach VPC resources with Direct VPC egress."]],"h":"sed12"},{"id":"SER-compute-cloud-run-jobs","k":"service","d":1,"o":"1.3","g":"Compute","f":"Cloud Run jobs","q":"When do you pick it, and what should you watch for?","b":"Run-to-completion containers with parallel tasks.","x":[["Watch out for","Each task can run for up to 7 days (1 hour with GPUs)."]],"h":"1u68r"},{"id":"SER-compute-cloud-run-functions","k":"service","d":1,"o":"1.3","g":"Compute","f":"Cloud Run functions","q":"When do you pick it, and what should you watch for?","b":"Event-driven glue code triggered by Cloud Storage, Pub/Sub or Eventarc. Formerly Cloud Functions.","x":[["Watch out for","Keep each function single-purpose. Move to Cloud Run services as logic grows."]],"h":"14pts"},{"id":"SER-compute-app-engine","k":"service","d":1,"o":"1.3","g":"Compute","f":"App Engine","q":"When do you pick it, and what should you watch for?","b":"Existing App Engine apps.","x":[["Watch out for","Rarely the right new answer in 2026. Cloud Run is the default serverless choice."]],"h":"1sghg"},{"id":"SER-compute-batch","k":"service","d":1,"o":"1.3","g":"Compute","f":"Batch","q":"When do you pick it, and what should you watch for?","b":"Queued batch and HPC jobs on VMs, including Spot and GPUs, without running your own scheduler.","x":[["Watch out for","Retries and checkpointing are your design."]],"h":"1oszr"},{"id":"SER-compute-google-cloud-vmware-engine","k":"service","d":1,"o":"1.3","g":"Compute","f":"Google Cloud VMware Engine","q":"When do you pick it, and what should you watch for?","b":"You need to exit a data center fast and keep vCenter, NSX and existing runbooks.","x":[["Watch out for","Billed per dedicated node. Migrate with HCX."]],"h":"1n9lb"},{"id":"SER-compute-bare-metal-solution-oracle-database-goog","k":"service","d":1,"o":"1.3","g":"Compute","f":"Bare Metal Solution / Oracle Database@Google Cloud","q":"When do you pick it, and what should you watch for?","b":"Oracle RAC or Exadata, and other workloads that need certified hardware, close to Google Cloud.","x":[["Watch out for","Not elastic. Plan capacity."]],"h":"3qs3f"},{"id":"SER-compute-google-distributed-cloud","k":"service","d":1,"o":"1.3","g":"Compute","f":"Google Distributed Cloud","q":"When do you pick it, and what should you watch for?","b":"GKE on-premises or at the edge (software-only, connected or air-gapped), managed through fleets.","x":[["Watch out for","You provide the hardware for software-only deployments."]],"h":"14ua6"},{"id":"SER-storage-cloud-storage-class-standard","k":"service","d":1,"o":"1.3","g":"Storage","f":"Cloud Storage class: Standard","q":"What is its minimum storage duration, typical access and use?","b":"Minimum storage duration: **none**.","x":[["Typical access","Frequent"],["Use for","Serving, analytics input, hot media"]],"h":"9u7ug"},{"id":"SER-storage-cloud-storage-class-nearline","k":"service","d":1,"o":"1.3","g":"Storage","f":"Cloud Storage class: Nearline","q":"What is its minimum storage duration, typical access and use?","b":"Minimum storage duration: **30 days**.","x":[["Typical access","About once a month"],["Use for","Backups, long-tail content"]],"h":"1v5wh"},{"id":"SER-storage-cloud-storage-class-coldline","k":"service","d":1,"o":"1.3","g":"Storage","f":"Cloud Storage class: Coldline","q":"What is its minimum storage duration, typical access and use?","b":"Minimum storage duration: **90 days**.","x":[["Typical access","About once a quarter"],["Use for","DR copies, older backups"]],"h":"odbik"},{"id":"SER-storage-cloud-storage-class-archive","k":"service","d":1,"o":"1.3","g":"Storage","f":"Cloud Storage class: Archive","q":"What is its minimum storage duration, typical access and use?","b":"Minimum storage duration: **365 days**.","x":[["Typical access","Less than once a year"],["Use for","Regulatory archives, legal hold"]],"h":"oq3v9"},{"id":"SER-db-cloud-sql","k":"service","d":1,"o":"1.3","g":"Databases","f":"Cloud SQL","q":"What is it, when do you pick it, and what are its limits?","b":"**MySQL, PostgreSQL, SQL Server.** Lifting an existing relational app. HA standby in a second zone. Read replicas, including cross-region for DR.","x":[["SLA and limits","Enterprise 99.95%; Enterprise Plus 99.99% including maintenance. Up to 64 TB."],["Watch out for","Writes go to one primary and scale vertically."]],"h":"1npr1"},{"id":"SER-db-alloydb-for-postgresql","k":"service","d":1,"o":"1.3","g":"Databases","f":"AlloyDB for PostgreSQL","q":"What is it, when do you pick it, and what are its limits?","b":"**PostgreSQL-compatible.** Demanding OLTP plus fast analytics (columnar engine), read pools, vector search.","x":[["SLA and limits","99.99%"],["Watch out for","PostgreSQL only. Cross-region secondaries are asynchronous."]],"h":"zo6si"},{"id":"SER-db-spanner","k":"service","d":1,"o":"1.3","g":"Databases","f":"Spanner","q":"What is it, when do you pick it, and what are its limits?","b":"**Distributed relational (GoogleSQL or PostgreSQL dialect).** Global scale with strong consistency and horizontally scaling writes. Also graph, vector and full-text search.","x":[["SLA and limits","99.999% multi-region, 99.99% regional. Sized from 100 processing units."],["Watch out for","Avoid monotonically increasing keys (hotspots). Costs more than Cloud SQL for small workloads."]],"h":"1t49w"},{"id":"SER-db-bigtable","k":"service","d":1,"o":"1.3","g":"Databases","f":"Bigtable","q":"What is it, when do you pick it, and what are its limits?","b":"**Wide-column NoSQL (HBase API).** Very high-throughput, low-latency key access: time series, IoT, ad tech, from TB to PB.","x":[["SLA and limits","Replication across clusters and regions"],["Watch out for","Row-key design is everything. Single-row transactions only. Not for small data or ad-hoc analytics."]],"h":"ccqc3"},{"id":"SER-db-firestore","k":"service","d":1,"o":"1.3","g":"Databases","f":"Firestore","q":"What is it, when do you pick it, and what are its limits?","b":"**Document.** Mobile and web apps with offline sync. Enterprise edition adds MongoDB compatibility.","x":[["SLA and limits","99.999% multi-region, 99.99% regional"],["Watch out for","Native or Datastore mode is chosen when the database is created."]],"h":"7uk0t"},{"id":"SER-db-memorystore","k":"service","d":1,"o":"1.3","g":"Databases","f":"Memorystore","q":"What is it, when do you pick it, and what are its limits?","b":"**In-memory (Valkey, Redis, Redis Cluster, Memcached).** Caching, sessions, leaderboards, rate limiting.","x":[["SLA and limits","Varies by tier"],["Watch out for","A cache, not the system of record."]],"h":"10att"},{"id":"SER-db-bigquery","k":"service","d":1,"o":"1.3","g":"Databases","f":"BigQuery","q":"What is it, when do you pick it, and what are its limits?","b":"**Serverless analytics warehouse.** Analytics, BI and ML on TB to PB. Streaming ingestion. BigQuery ML and AI functions.","x":[["SLA and limits","99.99%"],["Watch out for","Not OLTP. Cost follows bytes scanned (on-demand) or slots (editions)."]],"h":"vh2qy"},{"id":"SER-data-pub-sub","k":"service","d":1,"o":"1.3","g":"Data processing and analytics","f":"Pub/Sub","q":"When do you pick it?","b":"Decoupling services, absorbing bursts, fan-out, streaming ingestion.","x":[["Note","At-least-once delivery, so consumers must be idempotent. Exactly-once delivery is available for pull subscriptions, within one region. Ordering keys preserve order per key."]],"h":"101fh"},{"id":"SER-data-dataflow","k":"service","d":1,"o":"1.3","g":"Data processing and analytics","f":"Dataflow","q":"When do you pick it?","b":"New batch or streaming pipelines (Apache Beam): windows, late data, autoscaling, no clusters.","x":[["Note","The default answer for new ETL and streaming."]],"h":"1jhxb"},{"id":"SER-data-dataproc-serverless-for-apache-spark","k":"service","d":1,"o":"1.3","g":"Data processing and analytics","f":"Dataproc / Serverless for Apache Spark","q":"When do you pick it?","b":"Existing Spark or Hadoop jobs with minimal change.","x":[["Note","Use ephemeral clusters, with data in Cloud Storage rather than HDFS."]],"h":"1q19e"},{"id":"SER-data-cloud-composer","k":"service","d":1,"o":"1.3","g":"Data processing and analytics","f":"Cloud Composer","q":"When do you pick it?","b":"Orchestrating multi-step pipelines as Airflow DAGs.","x":[["Note","It orchestrates and doesn’t process data. Workflows suits lightweight service orchestration."]],"h":"1lvew"},{"id":"SER-data-datastream","k":"service","d":1,"o":"1.3","g":"Data processing and analytics","f":"Datastream","q":"When do you pick it?","b":"Change data capture from MySQL, PostgreSQL, Oracle or SQL Server into BigQuery or Cloud Storage.","x":[["Note","Serverless, low latency."]],"h":"1pqu5"},{"id":"SER-data-data-fusion","k":"service b":"No object ACLs; no public buckets.","h":"1pkhe"},{"id":"SER-iam-sql-restrictpublicip","k":"service","d":3,"o":"3.1","g":"Identity and access","f":"sql.restrictPublicIp","q":"What does this organization policy constraint do?","b":"Blocks public IPs on Cloud SQL.","h":"nf6be"},{"id":"SER-iam-gcp-restrictnoncmekservices","k":"service","d":3,"o":"3.1","g":"Identity and access","f":"gcp.restrictNonCmekServices","q":"What does this organization policy constraint do?","b":"Requires CMEK for the listed services.","h":"5x45v"},{"id":"SER-sec-default-encryption","k":"service","d":3,"o":"3.1","g":"Data protection and security operations","f":"Default encryption","q":"Who holds the key, and when do you pick it?","b":"**Google.** No specific key-control requirement. Always on.","h":"1z06z"},{"id":"SER-sec-cmek-cloud-kms","k":"service","d":3,"o":"3.1","g":"Data protection and security operations","f":"CMEK (Cloud KMS)","q":"Who holds the key, and when do you pick it?","b":"**You, in Cloud KMS.** You must control rotation, disabling and destruction. **Autokey** creates keys and bindings automatically at scale.","h":"1g42o"},{"id":"SER-sec-cloud-hsm","k":"service","d":3,"o":"3.1","g":"Data protection and security operations","f":"Cloud HSM","q":"Who holds the key, and when do you pick it?","b":"**You, in FIPS 140-2 Level 3 HSMs.** A regulation requires hardware-backed keys.","h":"129qc"},{"id":"SER-sec-cloud-ekm-key-access-justifications","k":"service","d":3,"o":"3.1","g":"Data protection and security operations","f":"Cloud EKM + Key Access Justifications","q":"Who holds the key, and when do you pick it?","b":"**You, outside Google.** Keys must stay outside Google, and you approve or deny each access with its reason.","h":"17dk5"},{"id":"SER-sec-csek","k":"service","d":3,"o":"3.1","g":"Data protection and security operations","f":"CSEK","q":"Who holds the key, and when do you pick it?","b":"**You supply the key on each call.** Cloud Storage and Compute Engine only. Lose the key ":"PII in general","q":"What should the architecture do?","b":"SDP discovery and de-identification, least privilege, BigQuery column-level security and masking, and retention limits.","h":"1ltgw"},{"id":"SER-comp-soc-2-iso-27001","k":"service","d":3,"o":"3.2","g":"Compliance quick map","f":"SOC 2, ISO 27001","q":"What should the architecture do?","b":"Google’s reports (Compliance Reports Manager) cover the infrastructure. Under shared responsibility, you show evidence for your own controls.","h":"1uj3o"},{"id":"SER-comp-audits","k":"service","d":3,"o":"3.2","g":"Compliance quick map","f":"Audits","q":"What should the architecture do?","b":"Immutable log retention (locked log-bucket retention or Bucket Lock), aggregated sinks, Access Transparency, SCC compliance reports.","h":"1bvqp"},{"id":"SER-comp-government-fedramp-il-cjis-itar","k":"service","d":3,"o":"3.2","g":"Compliance quick map","f":"Government (FedRAMP, IL, CJIS, ITAR)","q":"What should the architecture do?","b":"Assured Workloads control packages.","h":"19wwk"},{"id":"SER-ai-employees-need-an-assistant-over-company","k":"service","d":1,"o":"1.3","g":"AI and ML on Agent Platform","f":"Employees need an assistant over company data (Drive, SharePoint, Jira and more), with prebuilt agents","q":"Which answer fits?","b":"Gemini Enterprise, which includes NotebookLM Enterprise (now Gemini Notebook Enterprise) and Deep Research","h":"1hkac"},{"id":"SER-ai-source-grounded-q-a-and-audio-overviews-","k":"service","d":1,"o":"1.3","g":"AI and ML on Agent Platform","f":"Source-grounded Q&A and audio overviews over a fixed set of documents","q":"Which answer fits?","b":"NotebookLM Enterprise (now Gemini Notebook Enterprise)","h":"av5sy"},{"id":"SER-ai-custom-tool-using-agents-in-code","k":"service","d":1,"o":"1.3","g":"AI and ML on Agent Platform","f":"Custom, tool-using agents in code","q":"Which answer fits?","b":"Agent Development Kit (ADK), deployed on Agent Runtime (formerly Agent Engine) with sessions and Memory B Apigee","q":"What do you need to know about it?","b":"Full lifecycle. Proxies, security, quotas and Spike Arrest, analytics, monetization, developer portal. **Apigee hybrid** runs the runtime on-premises.","h":"1ni8h"},{"id":"SVF-dev-api-gateway","k":"service","d":4,"o":"4.1","g":"Delivery, IaC, APIs and tooling","f":"API management: API Gateway","q":"What do you need to know about it?","b":"A lightweight managed gateway for serverless backends.","h":"15e4e"},{"id":"SVF-dev-cloud-endpoints","k":"service","d":4,"o":"4.1","g":"Delivery, IaC, APIs and tooling","f":"API management: Cloud Endpoints","q":"What do you need to know about it?","b":"The older ESP-based option.","h":"g3ibh"},{"id":"CON-how-do-the-cloud-storage-classes-differ-","k":"concept","d":1,"o":"1.3","f":"How do the Cloud Storage classes differ in latency and durability, and what do the colder classes cost you?","b":"**Nothing in latency or durability:** every class has the same millisecond latency and 11-nines durability. The colder classes add **retrieval fees and minimum storage durations**.","g":"Storage","h":"14j5p"},{"id":"CON-in-database-terms-what-is-high-availabil","k":"concept","d":1,"o":"1.3","f":"In database terms, what is high availability and what is disaster recovery?","b":"**HA** = surviving a **zone** failure (Cloud SQL HA, AlloyDB, regional Spanner).\n**DR** = surviving a **region** failure (cross-region replica, AlloyDB secondary cluster, Spanner multi-region, backups in another region).","g":"Databases","h":"ct14r"},{"id":"CON-what-protects-against-a-bad-write-which-","k":"concept","d":1,"o":"1.3","f":"What protects against a bad write, which replication copies faithfully?","b":"**Point-in-time recovery.** Replication copies the bad write too, so replicas alone don't help.","g":"Databases","h":"dt4lz"},{"id":"CON-what-scope-do-a-vpc-and-its-subnets-have","k":"concept","d":1,"o":"1.3","f":"What scope do a VPC and its subnets have, and which mode should production use?","b":"A VPC is **global** and its subnets are **regional**. Use **custom mode** in production.","g":"Networking and hybrid connectivity","h":"f09fd"},{"id":"CON-how-do-you-plan-ip-ranges-for-a-vpc-that","k":"concept","d":1,"o":"1.3","f":"How do you plan IP ranges for a VPC that connects to on-premises or other clouds?","b":"Use **RFC 1918 ranges that don't overlap** with on-premises or other clouds, and include the **GKE pod and service secondary ranges**.","g":"Networking and hybrid connectivity","h":"1jey0"},{"id":"CON-how-do-vpc-firewall-rules-behave-state-p","k":"concept","d":1,"o":"1.3","f":"How do VPC firewall rules behave: state, priority range, which rule wins, implied rules?","b":"They are **stateful**. Priorities run **0–65535** and the **lower number wins**. There is an implied **deny for ingress** and **allow for egress**.","g":"Networking and hybrid connectivity","h":"v31b9"},{"id":"CON-which-kinds-of-firewall-policy-exist-and","k":"concept","d":1,"o":"1.3","f":"Which kinds of firewall policy exist, and which is evaluated first?","b":"**Hierarchical** policies (organization or folder) are evaluated **first**, with `goto_next` to defer. Then **global network** and **regional network** policies. Target with **secure tags** or **service accounts**.","g":"Networking and hybrid connectivity","h":"uszit"},{"id":"CON-name-the-cloud-ngfw-tiers-and-what-each-","k":"concept","d":1,"o":"1.3","f":"Name the Cloud NGFW tiers and what each one adds.","b":"**Essentials**, then **Standard** (FQDN, geolocation and threat-intelligence objects), then **Enterprise** (**intrusion prevention**, the exam guide's “intrusion protection”).","g":"Networking and hybrid connectivity","h":"gp0hy"},{"id":"CON-is-cloud-interconnect-traffic-encrypted-","k":"concept","d":1,"o":"1.3","f":"Is Cloud Interconnect traffic encrypted by default? How do you encrypt it?","b":"**No.** Add **MACsec for Cloud Interconnect**, or run **HA VPN over Cloud Interconnect**.","g":"Networking and hybrid connectivity","h":"18o1w"},{"id":"CON-what-does-cloud-router-do-and-what-does-","k":"concept","d":1,"o":"1.3","f":"What does Cloud Router do, and what does the dynamic routing mode control?","b":"Cloud Router runs **BGP**. **Regional or global** dynamic routing mode sets **how far learned routes reach**.","g":"Networking and hybrid connectivity","h":"uz7ug"},{"id":"CON-how-does-cloud-interconnect-compare-with","k":"concept","d":1,"o":"1.3","f":"How does Cloud Interconnect compare with internet egress on price?","b":"It usually **lowers egress pricing** compared with internet egress.","g":"Networking and hybrid connectivity","h":"16bu0"},{"id":"CON-which-cloud-dns-feature-lets-the-cloud-r","k":"concept","d":1,"o":"1.3","f":"Which Cloud DNS feature lets the cloud resolve on-premises names, and which lets on-premises resolve Cloud DNS private zones?","b":"**Forwarding zone:** the cloud resolves on-premises names.\n**Inbound server policy:** on-premises resolves Cloud DNS private zones.","g":"Networking and hybrid connectivity","h":"15smy"},{"id":"CON-what-are-dns-peering-and-response-polici","k":"concept","d":1,"o":"1.3","f":"What are DNS peering and response policies for?","b":"**DNS peering:** one VPC uses another VPC's zones.\n**Response policies:** override answers, for example for `restricted.googleapis.com`.","g":"Networking and hybrid connectivity","h":"g0b3k"},{"id":"CON-backends-behind-a-load-balancer-are-bein","k":"concept","d":1,"o":"1.3","f":"Backends behind a load balancer are being recreated every minute. What is the usual cause?","b":"**Health checks are blocked by the firewall**, so the backends look unhealthy and get recreated.","g":"Load balancing and edge","h":"mu5hi"},{"id":"CON-what-is-the-google-cloud-resource-hierar","k":"concept","d":3,"o":"3.1","f":"What is the Google Cloud resource hierarchy?","b":"**Organization → folders → projects → resources.**","g":"Identity and access","h":"90o74"},{"id":"CON-how-are-iam-allow-policies-inherited-and","k":"concept","d":3,"o":"3.1","f":"How are IAM allow policies inherited, and how do you take a parent's grant away from a child?","b":"Allow policies are inherited **downward** and are **additive**. A child **can't revoke** a parent's grant; use **deny policies**, which are evaluated first.","g":"Identity and access","h":"1ltap"},{"id":"CON-which-kinds-of-iam-role-exist-and-where-","k":"concept","d":3,"o":"3.1","f":"Which kinds of IAM role exist, and where can custom roles be created?","b":"**Basic** (Owner, Editor, Viewer: avoid in production), **predefined**, and **custom**, which exist at **organization or project** level only, **not on folders**.","g":"Identity and access","h":"a9fuu"},{"id":"CON-to-whom-should-you-grant-iam-roles","k":"concept","d":3,"o":"3.1","f":"To whom should you grant IAM roles?","b":"To **Google groups**, not individuals.","g":"Identity and access","h":"1nq9v"},{"id":"CON-what-do-iam-conditions-and-privileged-ac","k":"concept","d":3,"o":"3.1","f":"What do IAM Conditions and Privileged Access Manager each give you?","b":"**IAM Conditions** add time or resource restrictions.\n**Privileged Access Manager** gives **just-in-time, approved, expiring** elevation.","g":"Identity and access","h":"14jft"},{"id":"CON-name-the-three-policy-intelligence-tools","k":"concept","d":3,"o":"3.1","f":"Name the three Policy Intelligence tools.","b":"**IAM recommender**, **Policy Analyzer** and **Policy Troubleshooter**.","g":"Identity and access","h":"15npo"},{"id":"CON-where-should-sensitive-data-protection-b","k":"concept","d":3,"o":"3.1","f":"Where should Sensitive Data Protection be applied in an AI system?","b":"On **training data, prompts and logs**.","g":"Data protection and security operations","h":"1a4ip"},{"id":"CON-how-do-you-limit-the-network-and-key-exp","k":"concept","d":3,"o":"3.1","f":"How do you limit the network and key exposure of an AI workload?","b":"**VPC Service Controls** around Agent Platform, **private endpoints**, and **CMEK** for AI resources.","g":"Data protection and security operations","h":"13qyl"},{"id":"CON-how-should-iam-be-set-up-for-ai-endpoint","k":"concept","d":3,"o":"3.1","f":"How should IAM be set up for AI endpoints, agents and tools?","b":"**Least privilege** on endpoints, agents and tools, with **separate service accounts per agent**.","g":"Data protection and security operations","h":"1tk82"},{"id":"CON-what-practices-support-trustworthy-model","k":"concept","d":3,"o":"3.1","f":"What practices support trustworthy model deployment?","b":"**Model provenance** (Model Registry), **evaluation before deployment**, and **logging of prompts and responses**.","g":"Data protection and security operations","h":"pyijm"},{"id":"CON-what-is-the-reference-model-for-securing","k":"concept","d":3,"o":"3.1","f":"What is the reference model for securing AI?","b":"Google's **Secure AI Framework (SAIF)**.","g":"Data protection and security operations","h":"n0f37"},{"id":"NUM-roughly-how-long-do-these-online-transfe","k":"number","d":1,"o":"1.4","f":"Roughly how long do these online transfers take: 1 TB at 100 Mbps, 10 TB at 1 Gbps, 100 TB at 1 Gbps, 1 PB at 10 Gbps?","b":"**≈ 1 day, ≈ 1 day, ≈ 12 days, ≈ 12 days.**","x":[["Caveat","These assume the link is fully yours. If a transfer would take more than about a week, or the link is shared, consider Transfer Appliance."]],"h":"1pf8q"},{"id":"CON-what-do-you-need-to-bring-windows-server","k":"concept","d":1,"o":"1.4","f":"What do you need to bring Windows Server licenses that don't have License Mobility?","b":"**Sole-tenant nodes.** BYOL for Windows Server without License Mobility needs dedicated hardware.","g":"Migration","h":"uo1e8"},{"id":"CON-what-do-premium-os-images-include","k":"concept","d":1,"o":"1.4","f":"What do Premium OS images include?","b":"**Pay-as-you-go licenses.**","g":"Migration","h":"74gto"},{"id":"CON-how-do-you-cut-cost-for-per-core-softwar","k":"concept","d":1,"o":"1.4","f":"How do you cut cost for per-core software licenses?","b":"Use **custom machine types**, or set **threads per core to 1**.","g":"Migration","h":"1wd5k"},{"id":"CON-where-does-oracle-run-on-google-cloud","k":"concept","d":1,"o":"1.4","f":"Where does Oracle run on Google Cloud?","b":"**Bare Metal Solution** or **Oracle Database@Google Cloud**.","g":"Migration","h":"71x61"},{"id":"CON-how-do-you-handle-the-move-from-capex-to","k":"concept","d":1,"o":"1.4","f":"How do you handle the move from CapEx to OpEx?","b":"**Model the TCO**, **commit to the steady baseline**, and **keep peaks elastic**.","g":"Migration","h":"1c7wl"},{"id":"CON-what-makes-a-good-slo","k":"concept","d":1,"o":"1.2","f":"What makes a good SLO?","b":"It measures **users' experience** (success rate, latency percentiles), **not CPU**.","g":"Reliability and disaster recovery","h":"1uaa2"},{"id":"CON-which-building-blocks-make-compute-and-d","k":"concept","d":1,"o":"1.2","f":"Which building blocks make compute and data resilient?","b":"**Compute:** regional MIGs with autohealing, regional GKE clusters, Backup for GKE, multi-cluster Gateway.\n**Data:** Cloud SQL HA plus cross-region replicas, AlloyDB secondary clusters, Spanner multi-region, dual- or multi-region buckets, regional PD or Hyperdisk HA.","g":"Reliability and disaster recovery","h":"1qk5o"},{"id":"CON-how-do-you-test-reliability-and-do-you-h","k":"concept","d":1,"o":"1.2","f":"How do you test reliability, and do you have to tell Google before a penetration test?","b":"**DR drills, chaos experiments, load tests and penetration tests.** **No notice to Google is needed**; follow the Acceptable Use Policy.","g":"Reliability and disaster recovery","h":"niylr"},{"id":"CON-what-does-the-log-router-do","k":"concept","d":6,"f":"What does the Log Router do?","b":"It sends entries through **sinks** to log buckets, BigQuery, Cloud Storage, Pub/Sub (for SIEMs) or other projects.","g":"Observability and operations","h":"1jd28"},{"id":"NUM-how-long-do-the-required-and-default-log","k":"number","d":6,"f":"How long do the `_Required` and `_Default` log buckets keep logs, and what range do custom buckets allow?","b":"`_Required`: **400 days** (Admin Activity and System Event logs); you **can't change or exclude** it.\n`_Default`: **30 days** by default.\nCustom buckets: **1–3,650 days**.","h":"1gtc2"},{"id":"CON-how-do-you-centralize-logs-from-every-pr","k":"concept","d":6,"f":"How do you centralize logs from every project?","b":"An **aggregated sink** at the organization or folder.","g":"Observability and operations","h":"6xa1o"},{"id":"CON-what-is-the-main-logging-charge-and-how-","k":"concept","d":6,"f":"What is the main logging charge, and how do you cut it?","b":"**Ingestion** is the main charge. **Exclusion filters** cut cost.","g":"Observability and operations","h":"12pmd"},{"id":"CON-what-does-cloud-deploy-add-to-a-release-","k":"concept","d":6,"f":"What does Cloud Deploy add to a release process?","b":"**Approvals, promotion and one-step rollback.**","g":"Observability and operations","h":"1xuqg"},{"id":"CON-which-compute-cost-levers-does-the-cheat","k":"concept","d":1,"o":"1.1","f":"Which compute cost levers does the cheat sheet list?","b":"**Rightsize** with Active Assist, use **custom machine types**, **delete idle resources**, and **autoscale** (scale to zero on Cloud Run).","g":"Cost optimization","h":"1eeh6"},{"id":"CON-which-storage-cost-levers-does-the-cheat","k":"concept","d":1,"o":"1.1","f":"Which storage cost levers does the cheat sheet list?","b":"**Autoclass, lifecycle rules and retention limits.**","g":"Cost optimization","h":"etziv"},{"id":"CON-which-bigquery-cost-levers-does-the-chea","k":"concept","d":1,"o":"1.1","f":"Which BigQuery cost levers does the cheat sheet list?","b":"**Partition and cluster**, **require partition filters**, **cap bytes billed**, and choose **editions with autoscaling** for steady load and **on-demand** for spiky load.","g":"Cost optimization","h":"199g3"},{"id":"CON-which-network-and-logging-cost-levers-do","k":"concept","d":1,"o":"1.1","f":"Which network and logging cost levers does the cheat sheet list?","b":"**Network:** keep chatty services in the same region or zone, use CDN, prefer Interconnect egress.\n**Logging:** exclusion filters.","g":"Cost optimization","h":"n83uv"},{"id":"CON-how-do-you-attribute-cloud-cost-to-teams","k":"concept","d":1,"o":"1.1","f":"How do you attribute cloud cost to teams?","b":"**Labels plus billing export to BigQuery**, for showback and chargeback.","g":"Cost optimization","h":"glbvg"},{"id":"CON-which-tools-give-cost-insights","k":"concept","d":1,"o":"1.1","f":"Which tools give cost insights?","b":"The **FinOps hub** and **Gemini Cloud Assist** cost insights.","g":"Cost optimization","h":"1mm18"},{"id":"CON-do-quotas-control-spend","k":"concept","d":1,"o":"1.1","f":"Do quotas control spend?","b":"**No.** Quotas limit **resources, not dollars**.","g":"Cost optimization","h":"1lssw"},{"id":"CON-how-do-you-do-gitops-on-google-cloud","k":"concept","d":4,"o":"4.1","f":"How do you do GitOps on Google Cloud?","b":"**Config Sync** for clusters, **Config Connector** for Google Cloud resources.","g":"Delivery, IaC, APIs and tooling","h":"1drx2"},{"id":"CON-name-the-four-dora-metrics","k":"concept","d":4,"o":"4.1","f":"Name the four DORA metrics.","b":"**Deployment frequency, lead time, change failure rate, time to restore.**","g":"Delivery, IaC, APIs and tooling","h":"higwb"},{"id":"CON-what-can-you-use-to-build-landing-zones","k":"concept","d":4,"o":"4.1","f":"What can you use to build landing zones?","b":"The **enterprise foundations blueprint** and **Fabric FAST**.","g":"Delivery, IaC, APIs and tooling","h":"1197w"},{"id":"CON-what-is-the-status-of-deployment-manager","k":"concept","d":4,"o":"4.1","f":"What is the status of Deployment Manager?","b":"**End of support on 31 Mar 2026.** Infrastructure Manager (managed Terraform) is Google's recommended replacement.","g":"Delivery, IaC, APIs and tooling","h":"fglg7"},{"id":"CON-what-are-good-practices-for-exposing-an-","k":"concept","d":4,"o":"4.1","f":"What are good practices for exposing an API to consumers?","b":"**Version your APIs**, use **API keys or OAuth per consumer**, and protect backends with **quotas**.","g":"Delivery, IaC, APIs and tooling","h":"1uj28"},{"id":"CON-which-command-line-tools-matter-and-whic","k":"concept","d":4,"o":"4.1","f":"Which command-line tools matter, and which Cloud Storage CLI is preferred?","b":"`gcloud`, `gcloud storage` (**preferred over gsutil**), `bq`, `cbt` and `kubectl`.","g":"Delivery, IaC, APIs and tooling","h":"saqy6"},{"id":"CON-what-persists-in-cloud-shell-and-what-co","k":"concept","d":4,"o":"4.1","f":"What persists in Cloud Shell, and what comes with it?","b":"It is a temporary VM with a **5 GB persistent `$HOME`**. It includes Cloud Shell Editor, Cloud Code and Gemini Code Assist.","g":"Delivery, IaC, APIs and tooling","h":"1qyb9"},{"id":"CON-which-local-emulators-exist-for-testing-","k":"concept","d":4,"o":"4.1","f":"Which local emulators exist for testing without cloud cost?","b":"**Pub/Sub, Spanner, Bigtable, Firestore and Datastore** (`gcloud emulators …`).","g":"Delivery, IaC, APIs and tooling","h":"jqood"},{"id":"CON-how-should-code-authenticate-to-google-a","k":"concept","d":4,"o":"4.1","f":"How should code authenticate to Google APIs?","b":"**Cloud Client Libraries** (preferred) with **Application Default Credentials**.","g":"Delivery, IaC, APIs and tooling","h":"u1uq4"},{"id":"CON-how-should-clients-handle-errors-and-quo","k":"concept","d":4,"o":"4.1","f":"How should clients handle errors and quotas when calling Google APIs?","b":"**Retry with truncated exponential backoff and jitter.** Respect quotas, paginate and batch.","g":"Delivery, IaC, APIs and tooling","h":"1neba"},{"id":"TRAP-minimize-cost-what-does-it-mean-on-this-","k":"trap","d":0,"f":"“Minimize cost”: what does it mean on this exam?","b":"The **cheapest option that still meets every stated requirement**, not the cheapest option overall.","h":"f8mla"},{"id":"TRAP-the-question-doesn-t-mention-multi-regio","k":"trap","d":0,"f":"The question doesn't mention multi-region. Should you design for it?","b":"**No.** Don't add requirements. If the question doesn't ask for it, don't pay for it.","h":"163cf"},{"id":"TRAP-vpc-a-is-peered-with-b-and-b-with-c-can-","k":"trap","d":0,"f":"VPC A is peered with B, and B with C. Can A reach C?","b":"**No.** VPC peering **isn't transitive**. Use **Network Connectivity Center** or **Shared VPC**.","h":"1flwg"},{"id":"TRAP-are-private-google-access-private-servic","k":"trap","d":0,"f":"Are Private Google Access, Private Services Access and Private Service Connect the same thing?","b":"**No, three different things.**","x":[["Private Google Access","A per-subnet setting that lets VMs without external IPs reach Google APIs."],["Private Services Access","Peering-based private IPs for Cloud SQL, Memorystore and similar services."],["Private Service Connect","Publish or consume a single service privately, across organizations, even with overlapping IPs. Also gives endpoints for Google APIs."]],"h":"1x6lz"},{"id":"TRAP-can-cloud-nat-allow-inbound-connections","k":"trap","d":0,"f":"Can Cloud NAT allow inbound connections?","b":"**No.** Cloud NAT is **outbound only**.","h":"c85k2"},{"id":"TRAP-is-interconnect-encrypted-by-default","k":"trap","d":0,"f":"Is Interconnect encrypted by default?","b":"**No.** Add MACsec, or run HA VPN over Interconnect.","h":"4m4d1"},{"id":"TRAP-do-direct-and-carrier-peering-give-priva","k":"trap","d":0,"f":"Do Direct and Carrier Peering give private access to your VPC?","b":"**No.** They reach Google's public services (for example Workspace), not your VPC privately.","h":"k7pgv"},{"id":"TRAP-do-budgets-cap-spending","k":"trap","d":0,"f":"Do budgets cap spending?","b":"**No: budgets alert.** To enforce a cap, use **Pub/Sub notifications that trigger a function** to disable billing or stop resources.","h":"ciwhy"},{"id":"TRAP-a-child-project-must-lose-an-iam-grant-i","k":"trap","d":0,"f":"A child project must lose an IAM grant it inherited from a parent. How?","b":"It **can't be removed** at the child. Use **deny policies**.","h":"fh5u0"},{"id":"TRAP-can-an-iam-role-override-an-organization","k":"trap","d":0,"f":"Can an IAM role override an organization policy?","b":"**Never.** Only an **Organization Policy Administrator** can change it.","h":"1nprq"},{"id":"TRAP-can-you-create-a-custom-iam-role-on-a-fo","k":"trap","d":0,"f":"Can you create a custom IAM role on a folder?","b":"**No.** Custom roles exist at the **organization or project** level.","h":"1ver7"},{"id":"TRAP-are-basic-roles-and-service-account-keys","k":"trap","d":0,"f":"Are basic roles and service account keys usually the right answer?","b":"**Almost never.** Prefer predefined roles, groups and keyless access.","h":"1o9ju"},{"id":"TRAP-are-data-access-audit-logs-on-by-default","k":"trap","d":0,"f":"Are Data Access audit logs on by default, and what is needed to read them?","b":"**Off by default** (except BigQuery). Reading them needs **Private Logs Viewer**.","h":"7un95"},{"id":"TRAP-which-cloud-storage-feature-can-move-obj","k":"trap","d":0,"f":"Which Cloud Storage feature can move objects back to a warmer class: lifecycle rules or Autoclass?","b":"**Autoclass.** Lifecycle rules only move objects **colder**.","h":"kowew"},{"id":"TRAP-is-bucket-lock-reversible-can-a-retentio","k":"trap","d":0,"f":"Is Bucket Lock reversible? Can a retention policy be removed?","b":"**Bucket Lock is irreversible.** A retention policy **without a lock can be removed**.","h":"1vgsf"},{"id":"TRAP-does-cloud-sql-ha-cover-a-regional-outag","k":"trap","d":0,"f":"Does Cloud SQL HA cover a regional outage?","b":"**No.** HA covers a **zone** failure. A regional outage needs a **cross-region replica**.","h":"ke84"},{"id":"TRAP-are-read-replicas-backups-or-high-availa","k":"trap","d":0,"f":"Are read replicas backups, or high availability?","b":"**Neither.** Read replicas scale reads. They are not backups and not HA until promoted.","h":"x359j"},{"id":"TRAP-which-key-designs-create-hotspots-in-big","k":"trap","d":0,"f":"Which key designs create hotspots in Bigtable and Spanner?","b":"A **timestamp-first row key in Bigtable**, and **sequential keys in Spanner**.","h":"2mgbw"},{"id":"TRAP-does-bigquery-limit-reduce-the-bytes-sca","k":"trap","d":0,"f":"Does BigQuery LIMIT reduce the bytes scanned?","b":"**No.** **Partition filters** do.","h":"1ktnr"},{"id":"TRAP-can-spot-vms-run-stateful-critical-servi","k":"trap","d":0,"f":"Can Spot VMs run stateful critical services?","b":"**Never.** Spot VMs have no SLA and about 30 seconds of notice.","h":"1vxy9"},{"id":"TRAP-what-does-gke-autopilot-not-allow","k":"trap","d":0,"f":"What does GKE Autopilot not allow?","b":"**Privileged containers** (except allowlisted partner workloads) and **node SSH**.","h":"11cl2"},{"id":"TRAP-does-cloud-armor-protect-internal-only-t","k":"trap","d":0,"f":"Does Cloud Armor protect internal-only traffic?","b":"**No.** Cloud Armor doesn't protect internal traffic.","h":"101bq"},{"id":"TRAP-does-fine-tuning-keep-a-model-s-facts-cu","k":"trap","d":0,"f":"Does fine-tuning keep a model's facts current?","b":"**No.** **Grounding (RAG)** does.","h":"13zw9"},{"id":"TRAP-is-a-consumer-ai-app-on-personal-account","k":"trap","d":0,"f":"Is a consumer AI app on personal accounts the enterprise answer?","b":"**No.** Use **Gemini Enterprise** or **Gemini Notebook Enterprise** (formerly NotebookLM Enterprise).","h":"xjovo"},{"id":"TRAP-may-a-retired-service-be-the-answer-for-","k":"trap","d":0,"f":"May a retired service be the answer for a new design?","b":"**Never.** Deployment Manager, Container Registry, IoT Core and Pub/Sub Lite are retired, shutting down or closed to new users.","h":"4xv70"},{"id":"TRAP-a-release-breaks-production-what-do-you-","k":"trap","d":0,"f":"A release breaks production. What do you do first?","b":"**Mitigate first (roll back)**, then find the root cause.","h":"uwot7"},{"id":"TRAP-how-do-choose-two-questions-work","k":"trap","d":0,"f":"How do “choose two” questions work?","b":"They need **exactly two answers**, and **each must be correct on its own**.","h":"wct7r"},{"id":"FACT-what-are-the-retake-waits-for-the-profes","k":"fact","d":0,"f":"What are the retake waits for the Professional Cloud Architect exam?","b":"**14 days** after the first attempt, **60 days** after the second, and **one year** after the third, with **at most four attempts in two years**. Each attempt is charged in full.","h":"1rq31"},{"id":"FACT-when-do-you-learn-your-result-and-how-lo","k":"fact","d":0,"f":"When do you learn your result, and how long is the certificate valid?","b":"A **provisional pass or fail** shows on screen. The official result follows by email, typically within **7–10 days**. The certificate is valid for **2 years**.","h":"17tnh"},{"id":"FACT-how-can-you-renew-a-professional-cloud-a","k":"fact","d":0,"f":"How can you renew a Professional Cloud Architect certification?","b":"**Renewal exam:** adds **2 years** and opens 60 days before expiry.\n**Google Skills courses or badges** in the final year: adds **1 year**.","h":"1ysru"},{"id":"FACT-what-is-the-suggested-pacing-for-the-120","k":"fact","d":0,"f":"What is the suggested pacing for the 120 minutes?","b":"About **question 20 at 0:40**, **all answered once by 1:25**, **revisit flagged questions until 1:50**, and make sure **nothing is blank** in the last 10 minutes. There is no penalty for guessing.","x":[["Technique","Read the last sentence first, mark the constraints, eliminate options that break one, then pick the most managed, least-privilege, documented approach."]],"h":"11m0s"},{"id":"FACT-which-tie-breakers-do-google-s-answers-t","k":"fact","d":0,"f":"Which tie-breakers do Google's answers tend to follow?","b":"**Managed or serverless** over self-managed. **Built-in feature** over custom code. **Preventive** over detective controls. **Least privilege, groups, no keys.** **Automation and IaC** over console clicks. **Incremental** change over big bang. **Measure first.** **Mitigate first**, then root cause.","h":"144rh"},{"id":"CASE-alto","k":"case","d":0,"f":"Altostrat Media: what is the situation?","q":"Recall the company, its goals and what matters most.","b":"A media company with a large library of podcasts, interviews, news broadcasts and documentaries. It wants generative AI for personalized recommendations, natural-language interaction and self-service support, and to grow revenue through dynamic pricing, targeted marketing and personalized suggestions.","x":[["Priority","Reliability and cost management are the top priorities."]],"g":"Altostrat Media","h":"e9qgx"},{"id":"CASE-alto-env","k":"case","d":0,"f":"Altostrat Media: existing environment","q":"Which systems and constraints are already in place?","x":[["1","GKE runs content management and delivery."],["2","The media library (documents, audio, video) is in Cloud Storage."],["3","BigQuery is the main data warehouse for user behavior and audience data."],["4","Cloud Run functions handle transcoding, metadata extraction and recommendations."],["5","Legacy on-premises systems handle ingestion and archival, slated for migration."],["6","Identity: Google Identity plus third-party identity providers."],["7","Monitoring: Cloud Monitoring plus Prometheus, with alerts mostly by email."]],"g":"Altostrat Media","h":"13h7g"},{"id":"CASE-alto-reliable-workflows-across-google-cloud-a","k":"case","d":0,"f":"Altostrat Media: Reliable workflows across Google Cloud and on-premises","q":"What is the likely Google Cloud answer?","b":"One fleet of GKE and Google Distributed Cloud clusters, Config Sync, SLOs, Managed Service for Prometheus, alerts routed to on-call channels","g":"Altostrat Media","h":"f9v1z"},{"id":"CASE-alto-simpler-infrastructure-rapid-deployment-","k":"case","d":0,"f":"Altostrat Media: Simpler infrastructure, rapid deployment; modern CI/CD with centralized management","q":"What is the likely Google Cloud answer?","b":"Cloud Build, Artifact Registry, Cloud Deploy to every cluster; Autopilot or Cloud Run where possible; Terraform","g":"Altostrat Media","h":"190mc"},{"id":"CASE-alto-kubernetes-that-scales-both-on-premises-","k":"case","d":0,"f":"Altostrat Media: Kubernetes that scales both on-premises and in the cloud","q":"What is the likely Google Cloud answer?","b":"GKE plus Google Distributed Cloud (software-only), managed together as a fleet","g":"Altostrat Media","h":"u46q7"},{"id":"CASE-alto-secure-high-performance-hybrid-connectiv","k":"case","d":0,"f":"Altostrat Media: Secure, high-performance hybrid connectivity for ingestion","q":"What is the likely Google Cloud answer?","b":"Dedicated or Partner Interconnect with MACsec or HA VPN over Interconnect; Storage Transfer Service agents","g":"Altostrat Media","h":"e537z"},{"id":"CASE-alto-lower-storage-cost-for-growing-media-sti","k":"case","d":0,"f":"Altostrat Media: Lower storage cost for growing media, still highly available","q":"What is the likely Google Cloud answer?","b":"Autoclass (or lifecycle rules for predictable patterns); dual- or multi-region for hot content; Cloud CDN or Media CDN for delivery","g":"Altostrat Media","h":"1j9sf"},{"id":"CASE-alto-natural-language-interaction-24-7-suppor","k":"case","d":0,"f":"Altostrat Media: Natural-language interaction, 24/7 support, advanced chatbots","q":"What is the likely Google Cloud answer?","b":"Gemini-based agents on Agent Platform (ADK or CX Agent Studio), grounded through Search or RAG Engine, with account APIs as tools and human handoff","g":"Altostrat Media","h":"3fup2"},{"id":"CASE-alto-automatic-summaries-of-diverse-media","k":"case","d":0,"f":"Altostrat Media: Automatic summaries of diverse media","q":"What is the likely Google Cloud answer?","b":"Gemini multimodal (audio and video input): batch inference for the back catalog, event-driven calls for new uploads","g":"Altostrat Media","h":"1kqln"},{"id":"CASE-alto-rich-metadata-with-nlp-and-computer-visi"," hich themes should you expect?","b":"Managing hybrid Kubernetes and centralized CI/CD · Choosing storage classes for unpredictable media access · Multimodal Gemini compared with single-task APIs · Content safety and Model Armor · Responsible AI: audit trails and explanations · Modernizing Prometheus and email alerting","g":"Altostrat Media","h":"uc74p"},{"id":"CASE-cym","k":"case","d":0,"f":"Cymbal Retail: what is the situation?","q":"Recall the company, its goals and what matters most.","b":"A fast-growing online retailer with a huge catalog across many sub-verticals. It has three initiatives: enrich the catalog with generative AI (attributes, descriptions, images from supplier data); conversational commerce with AI virtual agents that use Google’s Discovery AI; and a technical-stack modernization to cut manual work and costs.","x":[["Priority","Reduce call-center staffing costs and data-center hosting costs."]],"g":"Cymbal Retail","h":"6z5fl"},{"id":"CASE-cym-env","k":"case","d":0,"f":"Cymbal Retail: existing environment","q":"Which systems and constraints are already in place?","x":[["1","A mix of on-premises and cloud systems."],["2","MySQL, Microsoft SQL Server, Redis and MongoDB hold the catalog and customer data."],["3","Kubernetes clusters run the containerized apps."],["4","Legacy SFTP file transfers and ETL batch jobs."],["5","Customers browse through SQL queries on product names and categories."],["6","An IVR routes calls, and agents key in orders by hand."],["7","Monitoring with Grafana, Nagios and Elastic."],["8","Pain points: manual errors, data silos, hard integrations."]],"g":"Cymbal Retail","h":"18h0g"},{"id":"CASE-cym-attribute-generation-that-matches-the-ca","k":"case","d":0,"f":"Cymbal Retail: Attribute generation that matches the catalog structure","q":"What is the likely Google Cloud answer?","b":"Multimodal Gemini prompted with the taxonomy, structured output (response schema with allowed values), evaluation against labeled samples","g":"Cymbal Retail","h":"dpr0o"},{"id":"CASE-cym-image-generation-and-enhancement-colors-","k":"case","d":0,"f":"Cymbal Retail: Image generation and enhancement (colors, backgrounds, text overlays)","q":"What is the likely Google Cloud answer?","b":"Gemini image models (Nano Banana) on Agent Platform: prompt with the base image for color variations, new backgrounds and text overlays","g":"Cymbal Retail","h":"hy17y"},{"id":"CASE-cym-natural-language-product-discovery","k":"case","d":0,"f":"Cymbal Retail: Natural-language product discovery","q":"What is the likely Google Cloud answer?","b":"AI Commerce Search (formerly Vertex AI Search for commerce) with conversational commerce (Discovery AI)","g":"Cymbal Retail","h":"1shkk"},{"id":"CASE-cym-scale-with-the-catalog-without-hurting-p","k":"case","d":0,"f":"Cymbal Retail: Scale with the catalog without hurting performance","q":"What is the likely Google Cloud answer?","b":"Batch inference for enrichment, managed search that scales with the catalog, autoscaling GKE or Cloud Run","g":"Cymbal Retail","h":"q0p5v"},{"id":"CASE-cym-human-in-the-loop-review","k":"case","d":0,"f":"Cymbal Retail: Human-in-the-loop review","q":"What is the likely Google Cloud answer?","b":"Staging store plus a review app (Cloud Run behind IAP); publish only approved items; keep decisions for evaluation","g":"Cymbal Retail","h":"1nqnp"},{"id":"CASE-cym-secure-compliant-handling-of-customer-an","k":"case","d":0,"f":"Cymbal Retail: Secure, compliant handling of customer and agent data","q":"What is the likely Google Cloud answer?","b":"SDP de-identification of transcripts, Model Armor, tokenized payments (PCI scope), IAM, VPC Service Controls, CMEK","g":"Cymbal Retail","h":"4brhn"},{"id":"CASE-cym-lower-call-center-cost-replace-the-ivr","k":"case","d":0,"f":"Cymbal Retail: Lower call-center cost, replace the IVR","q":"What is the likely Google Cloud answer?","b":"CX Agent Studio (voice and chat) connected to order APIs; Agent Assist for human agents","g":"Cymbal Retail","h":"1suri"},{"id":"CASE-cym-lower-data-center-hosting-cost","k":"case","d":0,"f":"Cymbal Retail: Lower data-center hosting cost","q":"What is the likely Google Cloud answer?","b":"Cloud SQL (MySQL, SQL Server), Memorystore, Firestore with MongoDB compatibility or Atlas, GKE; then rightsizing and CUDs","g":"Cymbal Retail","h":"finvs"},{"id":"CASE-cym-fewer-manual-processes-reliable-data-tra","k":"case","d":0,"f":"Cymbal Retail: Fewer manual processes, reliable data transfer and error handling","q":"What is the likely Google Cloud answer?","b":"Cloud Storage landing zone, Eventarc, Cloud Run functions or Dataflow, Pub/Sub, Application Integration, Apigee","g":"Cymbal Retail","h":"lmh64"},{"id":"CASE-cym-unified-view-of-the-customer-journey","k":"case","d":0,"f":"Cymbal Retail: Unified view of the customer journey","q":"What is the likely Google Cloud answer?","b":"Datastream CDC into BigQuery; a customer 360 model","g":"Cymbal Retail","h":"1dvh1"},{"id":"CASE-cym-proactive-monitoring-and-security","k":"case","d":0,"f":"Cymbal Retail: Proactive monitoring and security","q":"What is the likely Google Cloud answer?","b":"Cloud Monitoring and Logging, Managed Service for Prometheus (Grafana can stay), SLO alerts, Security Command Center","g":"Cymbal Retail","h":"1rm3w"},{"id":"CASE-cym-angles","k":"case","d":0,"f":"Cymbal Retail: likely question angles","q":"Which themes should you expect?","b":"A generative-AI enrichment pipeline with human review · Discovery AI compared with custom search · Automating the call center · Database modernization with minimal change · Protecting PII in conversational AI · Batch compared with online inference","g":"Cymbal Retail","h":"1fpzv"},{"id":"CASE-ehr","k":"case","d":0,"f":"EHR Healthcare: what is the situation?","q":"Recall the company, its goals and what matters most.","b":"A software-as-a-service provider of electronic health records for medical offices, hospitals and insurers, growing exponentially. It needs to scale, adapt its disaster-recovery plan and adopt continuous deployment. Google Cloud will replace its colocation facilities.","x":[["Priority","Outages came from misconfigured systems, inadequate capacity for traffic spikes, and inconsistent monitoring."]],"g":"EHR Healthcare","h":"1gzyr"},{"id":"CASE-ehr-env","k":"case","d":0,"f":"EHR Healthcare: existing environment","q":"Which systems and constraints are already in place?","x":[["1","Several colocation facilities. One lease is about to expire."],["2","Web-based customer apps, many now containerized on Kubernetes."],["3","MySQL, MS SQL Server, Redis and MongoDB."],["4","Legacy file- and API-based insurer integrations stay on-premises for now and will be replaced over several years."],["5","Users are in Microsoft Active Directory."],["6","Open-source monitoring. Email alerts are often ignored."]],"g":"EHR Healthcare","h":"745yz"},{"id":"CASE-ehr-onboard-insurance-providers-quickly-inge","k":"case","d":0,"f":"EHR Healthcare: Onboard insurance providers quickly; ingest data from new providers","q":"What is the likely Google Cloud answer?","b":"Apigee (API products, developer portal), Cloud Healthcare API (FHIR, HL7v2), Pub/Sub and Dataflow","g":"EHR Healthcare","h":"ybttq"},{"id":"CASE-ehr-at-least-99-9-availability-lower-latency","k":"case","d":0,"f":"EHR Healthcare: At least 99.9% availability; lower latency","q":"What is the likely Google Cloud answer?","b":"Regional GKE across zones, Cloud SQL HA, global external Application LB with Cloud CDN, a DR region","g":"EHR Healthcare","h":"4z7t7"},{"id":"CASE-ehr-centralized-visibility-proactive-action-","k":"case","d":0,"f":"EHR Healthcare: Centralized visibility, proactive action; consistent logging, retention, monitoring and alerting","q":"What is the likely Google Cloud answer?","b":"Cloud Monitoring and Logging, aggregated sinks with retention, SLO burn-rate alerts to PagerDuty, shared dashboards","g":"EHR Healthcare","h":"v0mjs"},{"id":"CASE-ehr-healthcare-insights-predictions-reports","k":"case","d":0,"f":"EHR Healthcare: Healthcare insights, predictions, reports","q":"What is the likely Google Cloud answer?","b":"Healthcare API streaming to BigQuery, de-identification, BigQuery ML or Agent Platform, Looker","g":"EHR Healthcare","h":"1u6jp"},{"id":"CASE-ehr-regulatory-compliance","k":"case","d":0,"f":"EHR Healthcare: Regulatory compliance","q":"What is the likely Google Cloud answer?","b":"HIPAA BAA, covered services only, VPC Service Controls, CMEK, Data Access audit logs, Access Transparency","g":"EHR Healthcare","h":"divv4"},{"id":"CASE-ehr-lower-infrastructure-administration-cost","k":"case","d":0,"f":"EHR Healthcare: Lower infrastructure administration cost","q":"What is the likely Google Cloud answer?","b":"Cloud SQL (MySQL, SQL Server), Memorystore, Firestore with MongoDB compatibility or Atlas, GKE Autopilot; DMS for the moves","g":"EHR Healthcare","h":"1n28g"},{"id":"CASE-ehr-keep-legacy-insurer-interfaces-connected","k":"case","d":0,"f":"EHR Healthcare: Keep legacy insurer interfaces, connected to on-premises and cloud","q":"What is the likely Google Cloud answer?","b":"Retain them on-premises, with Interconnect, hybrid DNS and routing","g":"EHR Healthcare","h":"sl4pr"},{"id":"CASE-ehr-consistent-management-of-container-apps-","k":"case","d":0,"f":"EHR Healthcare: Consistent management of container apps across environments","q":"What is the likely Google Cloud answer?","b":"GKE fleet, Config Sync, Policy Controller, one CI/CD pipeline (Cloud Build, Cloud Deploy)","g":"EHR Healthcare","h":"1ehgt"},{"id":"CASE-ehr-secure-high-performance-on-premises-conn","k":"case","d":0,"f":"EHR Healthcare: Secure, high-performance on-premises connection","q":"What is the likely Google Cloud answer?","b":"Dedicated Interconnect from the colocation facilities (redundant), MACsec or HA VPN over Interconnect","g":"EHR Healthcare","h":"vfk6s"},{"id":"CASE-ehr-scale-and-provision-new-environments-dyn","k":"case","d":0,"f":"EHR Healthcare: Scale and provision new environments dynamically","q":"What is the likely Google Cloud answer?","b":"Terraform or Infrastructure Manager, a project factory, autoscaling","g":"EHR Healthcare","h":"bgk7v"},{"id":"CASE-ehr-active-directory-users","k":"case","d":0,"f":"EHR Healthcare: Active Directory users","q":"What is the likely Google Cloud answer?","b":"GCDS to Cloud Identity plus SAML SSO (AD FS or Entra ID); Managed Microsoft AD for Windows workloads that need domain join","g":"EHR Healthcare","h":"1tun8"},{"id":"CASE-ehr-angles","k":"case","d":0,"f":"EHR Healthcare: likely question angles","q":"Which themes should you expect?","b":"Choosing between Interconnect and VPN · HIPAA prerequisites · Federating AD identity · Database migration before the lease ends · Fleet management for consistency · Alerting that people act on · DR plan design","g":"EHR Healthcare","h":"1056w"},{"id":"CASE-km","k":"case","d":0,"f":"KnightMotives Automotive: what is the situation?","q":"Recall the company, its goals and what matters most.","b":"A car maker of autonomous, battery-electric, hybrid and combustion vehicles. Only its electric models have a modern in-vehicle experience, and sales of the others are falling. Within five years it wants a consistent, AI-powered “automotive experience” across all models, a reliable build-to-order system, better dealer tools, and new revenue from data monetization.","x":[["Priority","Security is a paramount concern after past breaches, and EU data protection compliance is critical."]],"g":"KnightMotives Automotive","h":"1ero7"},{"id":"CASE-km-env","k":"case","d":0,"f":"KnightMotives Automotive: existing environment","q":"Which systems and constraints are already in place?","x":[["1","Mostly on-premises, with some apps on major public clouds."],["2","The supply chain runs on an outdated mainframe, and the ERP is outdated."],["3","Dealers have no budget for new equipment."],["4","Fragmented vehicle code bases and heavy technical debt."],["5","Weak connectivity to plants and to vehicles in rural areas."],["6","Obsolete AI infrastructure and siloed corporate data."]],"g":"KnightMotives Automotive","h":"1tadd"},{"id":"CASE-km-consistent-ai-powered-in-vehicle-experie","k":"case","d":0,"f":"KnightMotives Automotive: Consistent AI-powered in-vehicle experience, reliable connectivity including rural areas","q":"What is the likely Google Cloud answer?","b":"Edge models in the vehicle, store-and-forward uploads to Pub/Sub, idempotent cloud processing, cloud agents grounded on vehicle data","g":"KnightMotives Automotive","h":"ccjmj"},{"id":"CASE-km-network-upgrades-between-plants-and-head","k":"case","d":0,"f":"KnightMotives Automotive: Network upgrades between plants and headquarters","q":"What is the likely Google Cloud answer?","b":"Cloud Interconnect at major sites, Network Connectivity Center hub, SD-WAN router appliances, Google Distributed Cloud at plants","g":"KnightMotives Automotive","h":"19o5j"},{"id":"CASE-km-hybrid-cloud-gradual-legacy-modernizatio","k":"case","d":0,"f":"KnightMotives Automotive: Hybrid cloud, gradual legacy modernization","q":"What is the likely Google Cloud answer?","b":"Mainframe APIs through Apigee, Mainframe Connector to BigQuery, strangler-pattern replacement, SaaS ERP evaluation, fleets across environments","g":"KnightMotives Automotive","h":"1tm0j"},{"id":"CASE-km-autonomous-development-ai-ml-simulation-","k":"case","d":0,"f":"KnightMotives Automotive: Autonomous development: AI/ML, simulation, regulatory compliance","q":"What is the likely Google Cloud answer?","b":"AI Hypercomputer (GKE or Cluster Director with GPUs or TPUs, DWS), Batch with Spot for simulation, Agent Platform Pipelines and Model Registry for traceability","g":"KnightMotives Automotive","h":"tknue"},{"id":"CASE-km-data-monetization-data-platform-security","k":"case","d":0,"f":"KnightMotives Automotive: Data monetization: data platform, security and privacy, scalable AI","q":"What is the likely Google Cloud answer?","b stomers. What replaces it?","b":"GitHub, GitLab, Secure Source Manager","g":"Retired","h":"18y8i"},{"id":"NAME-retired-cloud-iot-core","k":"name","d":0,"f":"Cloud IoT Core is retired or closed to new customers. What replaces it?","b":"Pub/Sub + partner IoT platforms","g":"Retired","h":"kb31c"},{"id":"NAME-retired-pub-sub-lite-turned-down-31-jan-2027-pub","k":"name","d":0,"f":"Pub/Sub Lite (turned down 31 Jan 2027) → Pub/Sub, or Managed Service for Apache Kafka Cloud Debugger is retired or closed to new customers. What replaces it?","b":"Snapshot Debugger (open source) and logging","g":"Retired","h":"syt9w"},{"id":"NAME-retired-data-studio","k":"name","d":0,"f":"Data Studio is retired or closed to new customers. What replaces it?","b":"Looker Studio","g":"Retired","h":"d5hla"},{"id":"FACT-30-oct-2025","k":"fact","d":0,"f":"What changed on 30 Oct 2025?","b":"**New exam guide takes effect.** Altostrat Media, Cymbal Retail and KnightMotives Automotive replace Helicopter Racing League, Mountkirk Games and TerramEarth. EHR Healthcare stays. New AI sections 2.4 and 2.5, “Securing AI” in 3.1, and the Well-Architected Framework as a required lens. Weights moved from 24/15/18/18/11/14 to 25/17.5/17.5/15/12.5/12.5. Google’s earlier preview of this guide, still online as a separately named “v6.1” PDF, has slightly different weights (about 25/18/19/15/11/12) and an extra objective 4.3. The guide linked from Google’s certification page is the one to follow, and this guide does.","g":"Dated change","h":"1194p"},{"id":"FACT-2-mar-2026","k":"fact","d":0,"f":"What changed on 2 Mar 2026?","b":"**Exams move to Pearson VUE.** Kryterion’s last day was 22 Feb; the first Pearson VUE exams were on 2 Mar. Content and format are unchanged. You still register through Google’s certification portal (CM Connect), then sit at a Pearson VUE centre or online with OnVUE.","g":"Dated change","h":"d1l8f"},{"id":"FACT-31-mar-2026","k":"fact","d":0,"f":"What changed on 31 Mar 2026?","b":"**Deployment Manager reaches end of support.** New users are blocked from 30 Jun 2026 and the service shuts down after 30 Jun 2027. Infrastructure Manager (managed Terraform) is Google’s recommended replacement, and DM Convert turns configurations into Terraform or Kubernetes Resource Model (Config Connector) files.","g":"Dated change","h":"he35n"},{"id":"FACT-22-apr-2026","k":"fact","d":0,"f":"What changed on 22 Apr 2026?","b":"**Vertex AI becomes Gemini Enterprise Agent Platform.** Announced at Cloud Next. The exam guide now uses the new names, for example “Agent Platform Pipelines.” More renames followed; see the table below.","g":"Dated change","h":"19lak"},{"id":"FACT-9-jul-2026","k":"fact","d":0,"f":"What changed on 9 Jul 2026?","b":"**Renewal through Google Skills.** PCA holders can renew by completing designated courses or skill badges in the final year (adds 1 year), or by taking the renewal exam (adds 2 years).","g":"Dated change","h":"1ca7v"},{"id":"FACT-sep-2026","k":"fact","d":0,"f":"What changed in Sep 2026?","b":"**Professional Agentic Architect beta.** A separate certification: a proctored exam plus hands-on labs, valid for one year (beta exam 8–30 Sep, general availability planned for mid-November, registration opens 2 Nov). It is a different exam from the PCA, so don’t confuse the two guides.","g":"Dated change","h":"18hp1"},{"id":"FACT-exam-length","k":"fact","d":0,"f":"Professional Cloud Architect exam: length","b":"2 hours","g":"Exam format","h":"tjq4h"},{"id":"FACT-exam-questions","k":"fact","d":0,"f":"Professional Cloud Architect exam: questions","b":"50–60, single and multiple select","g":"Exam format","h":"6licl"},{"id":"FACT-exam-case-studies","k":"fact","d":0,"f":"Professional Cloud Architect exam: case studies","b":"2 of 4 · 20–30% of questions","g":"Exam format","h":"lmjz5"},{"id":"FACT-exam-fee","k":"fact","d":0,"f":"Professional Cloud Architect exam: fee","b":"US$200 + tax","g":"Exam format","h":"11203"},{"id":"FACT-exam-delivery","k":"fact","d":0,"f":"Professional Cloud Architect exam: delivery","b":"Pearson VUE centre or online","g":"Exam format","h":"1to37"},{"id":"FACT-exam-languages","k":"fact","d":0,"f":"Professional Cloud Architect exam: languages","b":"English, Japanese","g":"Exam format","h":"1siit"},{"id":"FACT-exam-valid-for","k":"fact","d":0,"f":"Professional Cloud Architect exam: valid for","b":"2 years","g":"Exam format","h":"18yuj"},{"id":"FACT-exam-pass-mark","k":"fact","d":0,"f":"Professional Cloud Architect exam: pass mark","b":"Not published","g":"Exam format","h":"nyvef"},{"id":"OBJ-d1","k":"objective","d":1,"f":"Domain 1 · Designing and planning a cloud solution architecture (~25%)","q":"Which objectives does it contain?","x":[["1.1","Designing a cloud solution infrastructure that meets business requirements"],["1.2","Designing a cloud solution infrastructure that meets technical requirements"],["1.3","Designing network, storage, and compute resources"],["1.4","Creating a migration plan (documents and architectural diagrams)"],["1.5","Envisioning future solution improvements"]],"h":"1efrh"},{"id":"OBJ-1.1","k":"objective","d":1,"o":"1.1","f":"1.1 Designing a cloud solution infrastructure that meets business requirements","q":"What does the exam guide say it covers?","x":[["1","Business use cases and product strategy"],["2","Identifying functional and non-functional requirements"],["3","Business continuity plan"],["4","Cost optimization"],["5","Supporting the application design"],["6","Integration patterns with external systems"],["7","Movement of data"],["8","Design decision trade-offs"],["9","Workload disposition strategies (build, buy, modify, deprecate)"],["10","Success measurements (KPIs, ROI, metrics)"],["11","Security and compliance"],["12","Observability"]],"h":"6yitl"},{"id":"OBJ-1.2","k":"objective","d":1,"o":"1.2","f":"1.2 Designing a cloud solution infrastructure that meets technical requirements","q":"What does the exam guide say it covers?","x":[["1","Familiarity with the Google :"Domain 4 · Analyzing and optimizing technical and business processes (~15%)","q":"Which objectives does it contain?","x":[["4.1","Analyzing and defining technical processes"],["4.2","Analyzing and defining business processes"]],"h":"bfp88"},{"id":"OBJ-4.1","k":"objective","d":4,"o":"4.1","f":"4.1 Analyzing and defining technical processes","q":"What does the exam guide say it covers?","x":[["1","Software development lifecycle (SDLC)"],["2","Continuous integration and continuous deployment"],["3","Troubleshooting and root cause analysis"],["4","Testing and validation of software and infrastructure"],["5","Service catalog and provisioning"],["6","Disaster recovery"]],"h":"6602k"},{"id":"OBJ-4.2","k":"objective","d":4,"o":"4.2","f":"4.2 Analyzing and defining business processes","q":"What does the exam guide say it covers?","x":[["1","Stakeholder management (influencing, facilitation)"],["2","Change management"],["3","Team assessment and skills readiness"],["4","Decision-making processes"],["5","Customer success management"],["6","Cost and resource optimization (CapEx and OpEx)"],["7","Business continuity"]],"h":"1l6s1"},{"id":"OBJ-d5","k":"objective","d":5,"f":"Domain 5 · Managing implementation (~12.5%)","q":"Which objectives does it contain?","x":[["5.1","Advising development and operations teams on deployment"],["5.2","Interacting with Google Cloud programmatically"]],"h":"3j98l"},{"id":"OBJ-5.1","k":"objective","d":5,"o":"5.1","f":"5.1 Advising development and operations teams on deployment","q":"What does the exam guide say it covers?","x":[["1","Application and infrastructure deployment"],["2","API management best practices (Apigee)"],["3","Testing frameworks (load, unit, integration)"],["4","Data and system migration and management tooling"],["5","Gemini Cloud Assist"]],"h":"1d4ef"},{"id":"OBJ-5.2","k":"objective","d":5,"o":"5.2","f":"5.2 Interacting with Google Cloud programmatically","q":"What does the exam guide say it covers?","x":[["1","Cloud Shell Editor, Cloud Code and Cloud Shell terminal"],["2","Google Cloud SDKs (gcloud, gsutil, bq)"],["3","Cloud emulators (Bigtable, Spanner, Pub/Sub, Firestore)"],["4","Infrastructure as code (Terraform)"],["5","Google API access best practices"],["6","Google API client libraries"]],"h":"wf8fx"},{"id":"OBJ-d6","k":"objective","d":6,"f":"Domain 6 · Ensuring solution and operations excellence (~12.5%)","q":"Which objectives does it contain?","x":[["6.1","Operational excellence pillar of the Well-Architected Framework"],["6.2","Google Cloud Observability"],["6.3","Deployment and release management"],["6.4","Supporting deployed solutions"],["6.5","Quality control"],["6.6","Reliability of solutions in production"]],"h":"w7jxs"},{"id":"OBJ-6.1","k":"objective","d":6,"o":"6.1","f":"6.1 Operational excellence pillar of the Well-Architected Framework","q":"What does the exam guide say it covers?","x":[["1","Principles and recommendations of the operational excellence pillar"]],"h":"1bfh0"},{"id":"OBJ-6.2","k":"objective","d":6,"o":"6.2","f":"6.2 Google Cloud Observability","q":"What does the exam guide say it covers?","x":[["1","Monitoring and logging"],["2","Profiling and benchmarking"],["3","Alerting strategies"]],"h":"2bv71"},{"id":"OBJ-6.3","k":"objective","d":6,"o":"6.3","f":"6.3 Deployment and release management","q":"What does the exam guide say it covers?","x":[["1","Deployment and release management"]],"h":"zea3z"},{"id":"OBJ-6.4","k":"objective","d":6,"o":"6.4","f":"6.4 Supporting deployed solutions","q":"What does the exam guide say it covers?","x":[["1","Assisting with the support of deployed solutions"]],"h":"5jtmo"},{"id":"OBJ-6.5","k":"objective","d":6,"o":"6.5","f":"6.5 Quality control","q":"What does the exam guide say it covers?","x":[["1","Evaluating quality control measures"]],"h":"jqahl"},{"id":"OBJ-6.6","k":"objective","d":6,"o":"6.6","f":"6.6 Reliability of solutions in production","q":"What does the exam guide say it covers?","x":[["1","Chaos engineering, penetration testing and load testing"]],"h":"1kbdq"}],"mcqs":[{"id":"d1-01","d":1,"s":"d1","n":1,"st":"A retailer is consolidating regional inventory databases into one system. Orders placed in North America, Europe and Asia must decrement the same stock counts with strong consistency, and the business requires a 99.999% availability target. Peak load is about 40,000 writes per second. What should you recommend?","op":[{"t":"Bigtable with multi-cluster routing across three regions","c":0},{"t":"AlloyDB for PostgreSQL with a cross-region secondary cluster","c":0},{"t":"Spanner with a multi-region instance configuration","c":1},{"t":"Cloud SQL for PostgreSQL Enterprise Plus with cross-region read replicas","c":0}],"ex":"Spanner multi-region configurations give externally consistent reads and writes across continents, scale writes horizontally, and carry a 99.999% SLA. Cloud SQL read replicas are read-only and asynchronous, so writes still go to one region. An AlloyDB secondary cluster is an asynchronous DR copy with a single primary. Bigtable replication is eventually consistent and has no multi-row transactions.","h":"yw214"},{"id":"d1-02","d":1,"s":"d1","n":1,"st":"A utility company ingests about 1.5 million smart-meter readings per second. A customer app must show each meter’s latest readings with single-digit-millisecond latency, and three years of history must stay queryable by meter. Which design should you choose?","op":[{"t":"Bigtable, with a row key that starts with the reading timestamp followed by the meter ID","c":0},{"t":"Bigtable, with a row key that starts with the meter ID followed by a reversed timestamp","c":1},{"t":"Cloud SQL for PostgreSQL Enterprise Plus, with a composite index on meter ID and timestamp","c":0},{"t":"BigQuery, with the table partitioned by reading date and clustered by meter ID","c":0}],"ex":"Bigtable is built for very high write throughput and low-latency key lookups. Leading the row key with the meter ID spreads writes across nodes, a
