 can leak secrets and has no locking. Separate copies guarantee drift. Weekly re-imports are dangerous and wasteful.","h":"1ays6"},{"id":"d5-05","d":5,"s":"d5","n":1,"st":"A partner sometimes floods your public order API with bursts that overload the backend. The API is managed with Apigee. What should you configure?","op":[{"t":"A new API version just for that partner","c":0},{"t":"Spike Arrest and Quota policies on the API proxy, applied to that partner’s API product","c":1},{"t":"A larger backend database","c":0},{"t":"A Cloud Armor rule that permanently blocks the partner’s IP addresses","c":0}],"ex":"Spike Arrest smooths bursts and Quota enforces limits per app or API product, protecting the backend while keeping the partner connected. A bigger database treats the symptom. Blocking a paying partner breaks the relationship. A new version doesn’t limit traffic.","h":"1y2an"},{"id":"d5-06","d":5,"s":"d5","n":1,"st":"Before a holiday sale, you must confirm that the checkout system can handle 10 times normal traffic while meeting its latency SLO. What should you do?","op":[{"t":"Run the unit test suite with more threads","c":0},{"t":"Double every instance size the day before","c":0},{"t":"Run a distributed load test (for example Locust on GKE) against a production-like staging environment, ramping to 10× while watching SLIs and quotas","c":1},{"t":"Watch production during the sale and react to problems","c":0}],"ex":"A realistic, ramped load test against production-like infrastructure exposes bottlenecks and quota limits in advance, while you watch the SLIs that matter. Reacting during the sale is too late. Unit tests don’t exercise the whole system. Blind over-provisioning is expensive and may miss the real bottleneck.","h":"1em4q"},{"id":"d5-07","d":5,"s":"d5","n":1,"st":"You must migrate a 4 TB MySQL 8.0 database from on-premises to Cloud SQL with less than 10 minutes of downtime. What should you use?","op":[{"t":"mysqldump to Cloud Storage, then import into Cloud SQL during a weekend outage","c":0},{"t":"Datastream into BigQuery","c":0},{"t":"Transfer Appliance","c":0},{"t":"Database Migration Service with continuous replication, then promote the Cloud SQL instance at cutover","c":1}],"ex":"Database Migration Service performs an initial load and then replicates changes continuously, so cutover only needs to stop writes and promote the destination, usually within minutes. Dumping and importing 4 TB takes hours of downtime. Datastream feeds analytics targets. Transfer Appliance moves bulk data offline, not live databases.","h":"1djxs"},{"id":"d5-08","d":5,"s":"d5","n":1,"st":"A company wants to move from Oracle to a managed PostgreSQL-compatible database to cut licensing costs, and needs help converting schemas, stored procedures and data. What should you use?","op":[{"t":"Database Migration Service heterogeneous migration, using a conversion workspace (with Gemini-assisted code conversion), into AlloyDB for PostgreSQL or Cloud SQL for PostgreSQL","c":1},{"t":"Storage Transfer Service","c":0},{"t":"BigQuery Data Transfer Service","c":0},{"t":"Migrate to Virtual Machines","c":0}],"ex":"DMS supports Oracle-to-PostgreSQL migrations. Conversion workspaces convert schema and code objects, with AI-assisted conversion, and DMS then moves and replicates the data. Migrate to Virtual Machines would keep Oracle and its licenses. Storage Transfer Service moves objects, not databases. BigQuery Data Transfer Service loads data into BigQuery.","h":"159sj"},{"id":"d5-09","d":5,"s":"d5","n":1,"st":"An on-call engineer sees pods in a GKE deployment crash-looping after a configuration change, and wants AI help to correlate logs, metrics and recent changes and suggest likely root causes. What should they use?","op":[{"t":"Cloud Profiler","c":0},{"t":"Gemini Code Assist in their IDE","c":0},{"t":"Gemini Cloud Assist investigations","c":1},{"t":"Looker Studio","c":0}],"ex":"Gemini Cloud Assist helps you operate Google Cloud environments, and its investigations analyze logs, metrics, configuration and change history to propose hypotheses and fixes. Gemini Code Assist helps you write code. Profiler analyzes CPU and memory in running code. Looker Studio builds dashboards.","h":"m6sf5"},{"id":"d5-10","d":5,"s":"d5","n":1,"st":"An engineer installs a CLI tool in Cloud Shell with sudo apt-get, but it’s gone the next day. How can the tool be available in every session?","op":[{"t":"Switch Cloud Shell to a larger machine","c":0},{"t":"Install it under $HOME, or add the install command to $HOME/.customize_environment so it runs at each session start","c":1},{"t":"Reinstall it in /usr/local/bin by hand every morning","c":0},{"t":"Ask Google support to keep the Cloud Shell VM running","c":0}],"ex":"Only the 5 GB $HOME directory persists in Cloud Shell; the VM itself is temporary. Installing into $HOME, or using .customize_environment, which runs at every startup, keeps tools available. The other options don’t change what Cloud Shell keeps.","h":"12w69"},{"id":"d5-11","d":5,"s":"d5","n":1,"st":"You want to send 5% of production traffic to a new Cloud Run revision, watch its error rate, and be able to roll back instantly. How should you deploy?","op":[{"t":"Deploy with --no-traffic, then use traffic splitting to send 5% to the new revision, adjusting or reverting the percentages as needed","c":1},{"t":"Create a second Cloud Run service and point 5% of users at it through DNS","c":0},{"t":"Delete the old revision, then deploy the new one","c":0},{"t":"Deploy normally, because Cloud Run always runs canaries automatically","c":0}],"ex":"Cloud Run revisions support gradual rollouts. Deploying with no traffic and then splitting traffic by percentage gives you a canary with instant rollback, and Cloud Deploy can automate the steps. Deleting the old revision removes the rollback path. DNS weighting is coarse and slow to change. By default Cloud Run sends all traffic to the newest revision.","h":"1oria"},{"id":"d5-12","d":5,"s":"d5","n":1,"st":"You need to copy 50 million small objects between buckets and from servers with a scripted command-line tool. Which tool does Google recommend for the best performance?","op":[{"t":"gsutil with default settings","c":0},{"t":"curl against the JSON API","c":0},{"t":"gcloud storage commands","c":1},{"t":"The Cloud console upload dialog","c":0}],"ex":"gcloud storage is the recommended CLI for Cloud Storage and is faster than gsutil because it parallelizes by default. For very large bucket-to-bucket copies, Storage Transfer Service is also an option. gsutil is the legacy tool. Raw curl calls and console uploads don’t scale to millions of objects.","h":"18cgp"},{"id":"d5-13","d":5,"s":"d5","n":1,"st":"A platform team already manages everything through Kubernetes manifests and GitOps. It wants to create Cloud SQL instances, Pub/Sub topics and IAM bindings the same way. What should it use?","op":[{"t":"The Cloud console","c":0},{"t":"Hand-written gcloud scripts run from cron","c":0},{"t":"Deployment Manager templates","c":0},{"t":"Config Connector, with Config Sync applying the manifests from Git","c":1}],"ex":"Config Connector exposes Google Cloud resources as Kubernetes custom resources, so the same GitOps flow (Config Sync) reconciles them continuously. Deployment Manager reached end of support on 31 March 2026. Scripts and console clicks lose the declarative, reviewed workflow.","h":"vervj"},{"id":"d6-01","d":6,"s":"d6","n":1,"st":"The on-call team is paged hundreds of times a week by CPU and memory threshold alerts, most of which have no user impact. How should alerting change?","op":[{"t":"Turn off alerting and rely on customer reports","c":0},{"t":"Alert on SLO burn rate, so people are paged only when the error budget is being spent fast enough to threaten the SLO, and send lower-urgency signals to tickets or dashboards","c":1},{"t":"Send every alert to email only","c":0},{"t":"Raise every threshold by 20%","c":0}],"ex":"Symptom-based, SLO burn-rate alerting pages people only when users are affected, or soon will be, which cuts alert fatigue. Shifting thresholds is arbitrary. Customer reports find problems too late. Email-only alerting is how alerts get ignored, as several case studies point out.","h":"3zoql"},{"id":"d6-02","d":6,"s":"d6","n":1,"st":"A company runs self-managed Prometheus servers in its GKE clusters. Retention, high availability and global querying have become painful, and teams want to keep PromQL and their Grafana dashboards. What should you recommend?","op":[{"t":"Run a larger Prometheus server","c":0},{"t":"Export metrics to BigQuery and query them with SQL","c":0},{"t":"Rebuild all dashboards in Looker Studio","c":0},{"t":"Google Cloud Managed Service for Prometheus","c":1}],"ex":"Managed Service for Prometheus is a drop-in, globally scalable backend with long retention that keeps PromQL and works with Grafana, without you managing Prometheus storage. Rebuilding dashboards or moving metrics into SQL wastes effort. A bigger server doesn’t solve availability or global querying.","h":"154jw"},{"id":"d6-03","d":6,"s":"d6","n":1,"st":"Users say checkout is slow, but no single service shows errors. Each request passes through eight microservices. What should you use to find where the time goes?","op":[{"t":"Cloud Trace, with the services instrumented with OpenTelemetry so trace context propagates between them","c":1},{"t":"Log-based metrics that count requests","c":0},{"t":"Cloud Profiler on one service","c":0},{"t":"Uptime checks","c":0}],"ex":"Distributed tracing shows the latency of every hop for individual requests across services, which is how you find the slow span. Profiler shows CPU and memory hotspots inside a single service. Uptime checks test availability. Request counts don’t show where latency comes from.","h":"1685s"},{"id":"d6-04","d":6,"s":"d6","n":1,"st":"A Go service’s CPU usage, and its cost, doubled after a release, though latency didn’t change. You want to find the functions responsible, in production, with low overhead. What should you use?","op":[{"t":"Cloud Trace","c":0},{"t":"Error Reporting","c":0},{"t":"Cloud Profiler","c":1},{"t":"Cloud Logging","c":0}],"ex":"Cloud Profiler continuously samples CPU and heap in production with low overhead, shows which functions consume resources, and lets you compare profiles between versions. Trace focuses on request latency. Error Reporting groups exceptions. Logs don’t profile code.","h":"1w13r"},{"id":"d6-05","d":6,"s":"d6","n":1,"st":"The security team needs every audit log from all 300 projects in one place, kept for one year and queryable with SQL, without adding work for project teams. What should you configure?","op":[{"t":"Longer _Default bucket retention in every project","c":0},{"t":"An aggregated sink at the organization node that includes child resources, routing audit logs to a log bucket in a central project with 365-day retention and Log Analytics enabled","c":1},{"t":"A sink in every project, created by each team","c":0},{"t":"A weekly export script","c":0}],"ex":"An aggregated sink on the organization captures logs from every current and future project in one place. A log bucket with custom retention and Log Analytics supports SQL queries (or you can link it to BigQuery). Per-project sinks depend on 300 teams doing the work. Scripts are fragile. Longer retention in each project doesn’t centralize anything.","h":"13dky"},{"id":"d6-06","d":6,"s":"d6","n":1,"st":"Cloud Logging costs spiked because a service writes verbose DEBUG logs that no one reads. You must cut cost without losing audit logs. What should you do?","op":[{"t":"Disable Admin Activity audit logs","c":0},{"t":"Delete the _Required log bucket","c":0},{"t":"Cut _Default retention to 1 day","c":0},{"t":"Add an exclusion filter for that service’s DEBUG entries on the _Default sink","c":1}],"ex":"Exclusion filters on the _Default sink drop matching entries before they’re stored, which cuts ingestion cost. Audit logs in the _Required bucket can’t be excluded or deleted, and Admin Activity logs can’t be disabled. Shorter retention barely changes cost, because ingestion is the main charge.","h":"1nehu"},{"id":"d6-07","d":6,"s":"d6","n":1,"st":"You want confidence that a multi-zone GKE service really survives losing a zone, as its design claims. What should you do?","op":[{"t":"Trust the architecture diagram","c":0},{"t":"Run a controlled chaos experiment, for example cordoning and draining one zone’s nodes in staging (and later in production with a small blast radius), while watching SLOs against predefined rollback criteria","c":1},{"t":"Read the GKE SLA","c":0},{"t":"Wait for a real zone outage","c":0}],"ex":"Chaos engineering tests resilience assumptions through controlled, observable fault injection with a limited blast radius, and the exam guide names it explicitly in section 6.6. Diagrams and SLAs describe intent, not behavior. Waiting for a real outage is the expensive way to find out.","h":"1jvzt"},{"id":"d6-08","d":6,"s":"d6","n":1,"st":"Your team deploys to GKE through Cloud Deploy, promoting from staging to production with manual approval. A production release misbehaves. What is the fastest safe recovery?","op":[{"t":"Use Cloud Deploy to roll back the production target to the previous successful release","c":1},{"t":"Edit the live Deployment with kubectl to change image tags","c":0},{"t":"Rebuild the previous version from source and push it through the full pipeline","c":0},{"t":"Delete the namespace","c":0}],"ex":"Cloud Deploy keeps release history for each target and can roll back to the last successful release in one action, preserving the audit trail. Editing with kubectl drifts from the pipeline. Rebuilding takes too long. Deleting the namespace causes an outage.","h":"15f1n"},{"id":"d6-09","d":6,"s":"d6","n":1,"st":"Your security team wants to run a penetration test against your own applications on Google Cloud. What does Google require?","op":[{"t":"Submit a request and wait for written approval from Google","c":0},{"t":"Only Google’s internal team may test your applications","c":0},{"t":"Nothing beyond following the Acceptable Use Policy and Terms of Service, and testing only your own resources; no notification is needed","c":1},{"t":"Nothing is allowed, because penetration testing is forbidden on Google Cloud","c":0}],"ex":"Google doesn’t require notice before you test your own projects, but you must stay within the Acceptable Use Policy and Terms of Service. For example, no denial-of-service attacks on shared infrastructure and no testing of other customers’ resources. The other options misstate the policy.","h":"3ghbs"},{"id":"d6-10","d":6,"s":"d6","n":1,"st":"Across 30 GKE clusters, you must stop anyone from deploying privileged containers or images from unapproved registries, and show auditors continuous compliance. What should you use?","op":[{"t":"Manual review of every manifest","c":0},{"t":"Cloud Armor","c":0},{"t":"Policy Controller, based on OPA Gatekeeper, with constraint templates applied across the fleet","c":1},{"t":"A wiki page that lists forbidden settings","c":0}],"ex":"Policy Controller enforces admission policies across a fleet, audits existing resources and reports compliance, and it ships prebuilt policy bundles for common standards. Documentation and manual review enforce nothing. Cloud Armor protects HTTP traffic, not Kubernetes admission.","h":"137bv"},{"id":"d6-11","d":6,"s":"d6","n":1,"st":"Your company runs revenue-critical workloads on Google Cloud and needs guaranteed fast responses during severe incidents, plus proactive guidance from a named technical contact. What should you recommend?","op":[{"t":"Basic billing support","c":0},{"t":"Premium Support","c":1},{"t":"Community forums","c":0},{"t":"Standard Support","c":0}],"ex":"Premium Support has the fastest P1 response target (15 minutes) and includes a Technical Account Manager for proactive guidance. Enhanced Support, the middle tier, offers a 1-hour P1 response but no TAM. Standard Support, forums and billing support don’t meet the requirement.","h":"11fc5"},{"id":"d6-12","d":6,"s":"d6","n":1,"st":"You need to know within minutes if your public HTTPS endpoint becomes unreachable from any continent, even when it has no traffic. What should you configure?","op":[{"t":"Cloud Trace sampling","c":0},{"t":"A weekly manual test","c":0},{"t":"A log-based metric on 5xx responses","c":0},{"t":"Cloud Monitoring uptime checks from several regions, with an alerting policy","c":1}],"ex":"Uptime checks probe the endpoint on a schedule from locations around the world and alert on failures, whether or not users are sending traffic. A 5xx metric needs traffic and misses failures where requests never arrive. Trace sampling isn’t an availability probe. A weekly test is far too slow.","h":"190zs"},{"id":"d6-13","d":6,"s":"d6","n":1,"st":"A service has a 99.9% monthly availability SLO and had used its whole error budget by the 18th of the month. Under a typical error budget policy, what happens next?","op":[{"t":"Pause risky feature releases and prioritize reliability work until the budget recovers","c":1},{"t":"Lower the SLO to 99%","c":0},{"t":"Stop monitoring the service","c":0},{"t":"Keep releasing features at the usual pace","c":0}],"ex":"An error budget policy links release speed to reliability. When the budget is gone, teams slow or freeze risky changes and invest in reliability. Ignoring it makes the SLO meaningless. Lowering the SLO to escape the budget, or turning off monitoring, defeats the purpose.","h":"10iwc"},{"id":"alto-01","d":2,"s":"alto","n":1,"st":"Altostrat wants scalable Kubernetes both on-premises and in Google Cloud, with one place to manage configuration, policy and CI/CD for containerized deployments. What should you recommend?","op":[{"t":"Run GKE in Google Cloud and Google Distributed Cloud (software-only) on-premises, register every cluster to one fleet, and use Config Sync, Policy Controller and Cloud Deploy across them","c":1},{"t":"Move all on-premises workflows to Cloud Run immediately","c":0},{"t":"Run Docker on Compute Engine VMs and on-premises servers","c":0},{"t":"Keep separate tooling for on-premises clusters and GKE, and standardize later","c":0}],"ex":"Fleets give centralized management of GKE and on-premises clusters: Config Sync for GitOps configuration, Policy Controller for guardrails, and Cloud Deploy as one modern pipeline to every target. That meets both the hybrid Kubernetes and the centralized CI/CD requirements. Separate tooling contradicts “centralized management.” The on-premises systems are slated for later migration, not an immediate move. Docker on VMs isn’t Kubernetes.","h":"1y95s"},{"id":"alto-02","d":1,"s":"alto","n":1,"st":"Altostrat’s media library in Cloud Storage keeps growing. Most files are rarely accessed, but older documentaries sometimes go viral and are streamed heavily for days. Altostrat wants to cut storage cost while keeping content highly available. What should you do?","op":[{"t":"Keep everything in Standard and add capacity","c":0},{"t":"Add a lifecycle rule that moves every object older than 30 days to Archive","c":0},{"t":"Enable Autoclass on the buckets so objects move between storage classes based on actual access","c":1},{"t":"Move the library to Filestore","c":0}],"ex":"Autoclass moves each object to colder classes while it isn’t accessed and back to Standard when it’s read, without retrieval or early-deletion charges, which suits unpredictable “viral” access. A fixed rule to Archive brings retrieval charges for popular old titles. Filestore costs far more per GB. Keeping everything in Standard doesn’t optimize cost.","h":"emnpr"},{"id":"alto-03","d":2,"s":"alto","n":1,"st":"Altostrat needs concise summaries of thousands of podcasts, interviews and documentaries, and new content must be summarized as it arrives. What should you recommend?","op":[{"t":"Use the Vision API to label video frames","c":0},{"t":"Use a Gemini model on Agent Platform with audio and video input: batch inference for the back catalog, and event-driven calls (for example a Cloud Run function triggered by Cloud Storage uploads) for new content","c":1},{"t":"Train a custom summarization model from scratch on GPUs","c":0},{"t":"Use Speech-to-Text alone and store the transcripts","c":0}],"ex":"Gemini models are multimodal and can summarize audio and video directly. Batch inference handles the back catalog cost-effectively, and event-driven triggers handle new uploads, which fits Altostrat’s existing use of Cloud Run functions. Training from scratch is costly and unnecessary. A transcript or a set of frame labels isn’t a summary.","h":"1tcmg"},{"id":"alto-04","d":3,"s":"alto","n":2,"st":"Altostrat must detect and filter inappropriate content, both in uploaded media and in its new LLM-powered chatbot. Which two measures should you include? (Choose two.)","op":[{"t":"Screen uploaded video for explicit content with the Video Intelligence API (or Gemini safety classification), sending flagged items to human review","c":1},{"t":"Rely on Cloud Armor WAF rules to filter video content","c":0},{"t":"Rely on users to report content","c":0},{"t":"Use VPC Service Controls to block inappropriate uploads","c":0},{"t":"Put Model Armor in front of the chatbot to screen prompts and responses for harmful content and prompt injection","c":1}],"ex":"Media moderation needs content analysis, such as Video Intelligence explicit-content detection or Gemini classification, with human review for edge cases. The chatbot needs prompt and response screening, which Model Armor provides. Cloud Armor inspects HTTP requests, not media. VPC Service Controls prevent data exfiltration. User reports alone are reactive.","h":"156r0"},{"id":"alto-05","d":3,"s":"alto","n":1,"st":"Altostrat requires that its AI systems be auditable and that their decisions can be explained, for example why a piece of content was recommended or flagged. Which approach best meets this?","op":[{"t":"Use the largest model available","c":0},{"t":"Delete logs after 24 hours to protect privacy","c":0},{"t":"Disable safety filters to avoid false positives","c":0},{"t":"Version models in Model Registry, log prompts, responses and model versions (for example request-response logging to BigQuery), enable Data Access audit logs for Agent Platform, and use Explainable AI feature attributions for the predictive models","c":1}],"ex":"Auditability needs traceability (which model version produced which output from which input) plus access records. Explainability needs feature attributions or rationales where the model type supports them. Model size explains nothing. Deleting logs destroys the audit trail. Turning off safety filters works against the moderation requirement.","h":"5jt69"},{"id":"alto-06","d":6,"s":"alto","n":1,"st":"Altostrat uses Cloud Monitoring alongside self-managed Prometheus, and alerts mostly go to email. The business wants faster, more reliable operations across Google Cloud and on-premises. What should you recommend?","op":[{"t":"Add a second open-source monitoring stack","c":0},{"t":"Move Prometheus metrics to Google Cloud Managed Service for Prometheus, define SLOs with burn-rate alerting policies, and route pages to an on-call tool such as PagerDuty, or to Slack, through notification channels","c":1},{"t":"Keep email alerts and add more recipients","c":0},{"t":"Replace monitoring with weekly reports","c":0}],"ex":"Managed Service for Prometheus brings metrics from GKE and on-premises Prometheus together without running Prometheus storage, and SLO-based alerts sent to on-call channels make alerting actionable. Email-only alerting is the weakness the case describes. Weekly reports and another self-managed stack add work without improving response.","h":"13f2w"},{"id":"alto-07","d":2,"s":"alto","n":1,"st":"Altostrat moves large volumes of raw media from its on-premises ingestion systems into Google Cloud and requires secure, high-performance hybrid connectivity. What should you recommend?","op":[{"t":"HA VPN over the public internet only","c":0},{"t":"Uploads through the Cloud console","c":0},{"t":"A Transfer Appliance shipment every week","c":0},{"t":"Dedicated Interconnect (or Partner Interconnect without a colocation presence), encrypted with MACsec or HA VPN over Interconnect, plus Storage Transfer Service agents for managed, scheduled transfers","c":1}],"ex":"Interconnect provides high, predictable bandwidth over a private path, and MACsec or HA VPN over Interconnect adds encryption. Storage Transfer Service agents manage incremental transfers with integrity checks. VPN alone may not carry media volumes. Console uploads don’t scale. A weekly appliance is slow and heavy to operate for a continuous flow.","h":"1cnlq"},{"id":"alto-08","d":1,"s":"alto","n":1,"st":"Altostrat wants a 24/7 assistant that answers natural-language questions about its catalog and the user’s account, offers personalized suggestions, and hands off to a person when needed. Which design fits best?","op":[{"t":"A Gemini-based agent on Agent Platform (built with ADK or CX Agent Studio), grounded on catalog and help content through Search or RAG Engine, calling account APIs as tools, with escalation to humans","c":1},{"t":"A model fine-tuned on last year’s support transcripts and deployed without grounding","c":0},{"t":"A static FAQ page","c":0},{"t":"A rules-only IVR menu","c":0}],"ex":"A grounded agent answers from current catalog and help content, calls tools for account-specific answers, personalizes responses and escalates to people, which covers the natural-language, 24/7 and personalization requirements. Static FAQs and rule-only menus don’t understand natural language. An ungrounded fine-tuned model goes stale and hallucinates.","h":"w8wo0"},{"id":"alto-09","d":1,"s":"alto","n":1,"st":"Altostrat wants to analyze media content and viewing behavior to spot trends and guide its content strategy. Its viewing data is already in BigQuery. What should you recommend?","op":[{"t":"Move the data into Cloud SQL for reporting","c":0},{"t":"Build a separate Hadoop cluster","c":0},{"t":"Store extracted media metadata and transcripts next to the viewing data in BigQuery, use BigQuery’s Gemini-powered AI functions or BigQuery ML for classification and trend models, and share insights through Looker","c":1},{"t":"Export BigQuery data to spreadsheets every week","c":0}],"ex":"Keeping content metadata next to behavioral data in BigQuery enables joined analysis. AI functions and BigQuery ML bring classification and forecasting to SQL users, and Looker delivers governed insights to decision-makers. Spreadsheets and Cloud SQL don’t scale to this, and a Hadoop cluster adds operations for no benefit.","h":"14u38"},{"id":"alto-10","d":4,"s":"alto","n":1,"st":"Altostrat’s executives say reliability and cost management are their top priorities, and the business wants simpler infrastructure management for rapid deployment. Which approach best reflects this?","op":[{"t":"Postpone modernization until every on-premises system is retired","c":0},{"t":"Standardize on managed services and automation: GKE Autopilot or Cloud Run where possible, infrastructure as code, one shared CI/CD pipeline, and SLOs with cost visibility through labels and billing export","c":1},{"t":"Overprovision everything to avoid any outage","c":0},{"t":"Build custom tooling for each team","c":0}],"ex":"Managed platforms cut operational toil, automation speeds deployment, and SLOs plus cost attribution keep reliability and spend visible, which matches the executive statement. Per-team tooling adds complexity. Overprovisioning conflicts with cost management. Waiting delays the stated goals.","h":"tlsd3"},{"id":"cym-01","d":2,"s":"cym","n":1,"st":"Cymbal must derive product attributes from supplier titles, descriptions and images, and the attributes must match each category’s existing taxonomy. What is the most effective approach?","op":[{"t":"Ask suppliers to fill in attributes by hand","c":0},{"t":"Train an image-classification model from scratch for every attribute","c":0},{"t":"Use a multimodal Gemini model on Agent Platform, prompted with the category taxonomy and constrained by structured output (a response schema with allowed values), and evaluate accuracy against a human-labeled sample","c":1},{"t":"Use Vision API label detection and save the labels as attributes","c":0}],"ex":"Gemini reasons over text and images together, and constraining output with a response schema or enumerations keeps attributes aligned to the taxonomy. Evaluating against labeled samples measures accuracy before you scale. Per-attribute models trained from scratch are slow and costly. Generic labels don’t map to a retail taxonomy. Manual entry is the problem Cymbal wants to remove.","h":"7k366"},{"id":"cym-02","d":2,"s":"cym","n":1,"st":"Cymbal wants to generate variations of a product photo in different colors, change backgrounds, and add text overlays, all from one supplier image. Which service fits best?","op":[{"t":"Document AI","c":0},{"t":"The Video Intelligence API","c":0},{"t":"The Vision API","c":0},{"t":"Gemini image models (“Nano Banana”) on Agent Platform, prompted with the base image to create color variations, change backgrounds and add text overlays","c":1}],"ex":"Gemini image models (“Nano Banana”) generate and edit images from a reference image and a text prompt, including color variations, background changes and text overlays, which is what the image generation and enhancement requirement describes. Google retired the older Imagen models in August 2026. Vision and Video Intelligence analyze media rather than create it. Document AI extracts data from documents.","h":"jmtjh"},{"id":"cym-03","d":5,"s":"cym","n":1,"st":"Cymbal requires human-in-the-loop review: associates must approve, reject or edit AI-generated attributes, descriptions and images before they reach the catalog. How should you implement this?","op":[{"t":"Write generated content to a staging store, give associates a review web app (for example on Cloud Run, protected by Identity-Aware Proxy), publish only approved items, and keep reviewer decisions for measuring quality","c":1},{"t":"Email all generated content to a shared inbox","c":0},{"t":"Write generated content straight to the live catalog and fix mistakes when customers complain","c":0},{"t":"Let suppliers approve the generated content","c":0}],"ex":"A staging-and-approval workflow keeps unreviewed content out of production. IAP limits the review app to associates, and recorded decisions provide data for evaluating and improving prompts. Publishing directly skips the required review. Email doesn’t scale or track decisions. Suppliers aren’t the reviewers the requirement names.","h":"u541q"},{"id":"cym-04","d":1,"s":"cym","n":1,"st":"Cymbal’s web app searches products with SQL queries on names and categories, so shoppers can’t find items with natural phrases like “waterproof hiking boots for wide feet under $150.” What should you recommend?","op":[{"t":"Move the catalog to Bigtable","c":0},{"t":"Build a custom keyword index on Compute Engine","c":0},{"t":"AI Commerce Search (formerly Vertex AI Search for commerce, Google’s Discovery AI for retail), with conversational commerce, fed by the product catalog and user events","c":1},{"t":"Add more LIKE clauses to the SQL queries","c":0}],"ex":"AI Commerce Search provides semantic, personalized product search and recommendations, plus conversational commerce that understands natural-language intent and attributes. It’s the Discovery AI capability named in the case study. LIKE matching and keyword indexes don’t understand intent. Bigtable is a storage engine, not a search product.","h":"1xbkc"},{"id":"cym-05","d":4,"s":"cym","n":1,"st":"Cymbal wants to cut call-center staffing costs. Today an IVR routes calls, and agents key in orders when customers can’t complete them online. What should you recommend?","op":[{"t":"Use CX Agent Studio (the evolution of Dialogflow CX) as a voice and chat virtual agent that checks order status and completes orders through APIs, with Agent Assist helping human agents on escalated calls","c":1},{"t":"Add more IVR menu options","c":0},{"t":"Hire more agents for peak seasons","c":0},{"t":"Turn off phone support","c":0}],"ex":"Generative virtual agents in Gemini Enterprise for Customer Experience (formerly the Customer Engagement Suite) handle routine requests end to end, including transactions through API tools, and hand off with context. Agent Assist makes the remaining human calls faster. More menus or more staff don’t reduce cost. Turning off phone support hurts customers.","h":"1ai5j"},{"id":"cym-06","d":1,"s":"cym","n":1,"st":"Cymbal runs MySQL, Microsoft SQL Server, Redis and MongoDB, and wants to reduce data-center hosting costs and operational effort with minimal application changes. Which target mapping is best?","op":[{"t":"Run all four on self-managed Compute Engine VMs","c":0},{"t":"MySQL and SQL Server to Cloud SQL, Redis to Memorystore, and MongoDB to Firestore with MongoDB compatibility (or MongoDB Atlas from Google Cloud Marketplace)","c":1},{"t":"Migrate everything to BigQuery","c":0},{"t":"Migrate everything to Spanner","c":0}],"ex":"Managed, engine-compatible targets remove database administration with minimal code change. Cloud SQL supports MySQL and SQL Server, Memorystore runs Redis, and Firestore offers MongoDB API compatibility, with MongoDB Atlas as an alternative. Self-managed VMs keep the operational burden. Spanner or BigQuery for everything would mean rewrites and doesn’t suit every workload.","h":"3yfib"},{"id":"cym-07","d":1,"s":"cym","n":1,"st":"Cymbal’s legacy integrations rely on SFTP file drops and nightly ETL batches that are slow and error-prone. It wants automated, reliable integration with suppliers and third parties. What should you recommend?","op":[{"t":"Move the ETL server to a bigger VM","c":0},{"t":"Email files to an operations team","c":0},{"t":"Keep SFTP and add more cron jobs","c":0},{"t":"Land supplier files in Cloud Storage (behind a managed SFTP front end if needed), trigger processing with Eventarc and Cloud Run functions or Dataflow, publish events through Pub/Sub, and use Application Integration or Apigee for API-based partners","c":1}],"ex":"Event-driven ingestion processes each file as it arrives, with retries and monitoring, and Pub/Sub decouples downstream systems, while API-based partners get managed connectors or APIs. This removes manual steps and nightly batch delays. More cron jobs, email or a bigger VM keep the fragile pattern.","h":"1usjm"},{"id":"cym-08","d":3,"s":"cym","n":1,"st":"Cymbal’s virtual-agent conversations sometimes contain names, addresses and payment details, and transcripts are stored for quality analysis. How should you protect this data?","op":[{"t":"De-identify transcripts with Sensitive Data Protection before they land in BigQuery, screen live prompts and responses with Model Armor, restrict access with IAM, and keep payment data out of transcripts through tokenization","c":1},{"t":"Encrypt transcripts with a password shared in chat","c":0},{"t":"Delete every transcript immediately","c":0},{"t":"Store raw transcripts in a public bucket for analysts","c":0}],"ex":"De-identification keeps transcripts useful for analysis without exposing PII. Model Armor guards the live agent, tokenization keeps card data out of scope, and IAM limits access. Public buckets and shared passwords are breaches. Deleting everything throws away the quality-analysis value Cymbal wants.","h":"13nop"},{"id":"cym-09","d":1,"s":"cym","n":1,"st":"Data silos prevent Cymbal from seeing the whole customer journey. Its operational data lives in MySQL, SQL Server and MongoDB. What should you recommend?","op":[{"t":"Merge all operational databases into one SQL Server instance","c":0},{"t":"Have each team export CSV files weekly","c":0},{"t":"Query each database live from the dashboard tool","c":0},{"t":"Replicate operational data into BigQuery with Datastream change data capture (and other connectors where needed), and model a unified customer view there for analytics and personalization","c":1}],"ex":"Change data capture keeps BigQuery close to real time without loading the operational systems, and BigQuery becomes the central analytics layer for the customer journey. Weekly CSVs are stale and error-prone. Merging operational databases is risky and unnecessary. Live queries across silos are slow and fragile.","h":"1u0tj"},{"id":"cym-10","d":2,"s":"cym","n":1,"st":"Cymbal needs to enrich 3 million existing products with generated attributes and descriptions, then about 20,000 new products a day. How should you run the generation to control cost and avoid quota problems?","op":[{"t":"Run the model on associates’ laptops","c":0},{"t":"Use batch inference on Agent Platform for the backlog and the daily new products, reading from and writing to BigQuery or Cloud Storage, and keep online calls for interactive needs","c":1},{"t":"Send all 3 million requests to the online API at once from one script","c":0},{"t":"Process products one at a time by hand","c":0}],"ex":"Batch inference is built for large asynchronous jobs. It costs less per request than online inference and avoids online rate limits. A flood of online calls invites throttling and higher cost. Laptops and manual processing don’t scale.","h":"1i1s8"},{"id":"ehr-01","d":2,"s":"ehr","n":1,"st":"EHR Healthcare needs a secure, high-performance connection between its colocation facilities and Google Cloud, carrying healthcare data and legacy integration traffic. What should you recommend?","op":[{"t":"Direct Peering","c":0},{"t":"A single Classic VPN tunnel","c":0},{"t":"Carrier Peering","c":0},{"t":"Dedicated Interconnect from the colocation facilities, with redundant connections, plus MACsec or HA VPN over Interconnect for encryption","c":1}],"ex":"EHR already operates from colocation facilities, where Dedicated Interconnect is typically available, giving private, high-bandwidth, low-latency links. Redundant connections are needed for an SLA, and MACsec or HA VPN over Interconnect encrypts the traffic. Carrier and Direct Peering reach Google’s public services, not your VPC privately. One Classic VPN tunnel lacks both performance and redundancy.","h":"9xo6z"},{"id":"ehr-02","d":2,"s":"ehr","n":1,"st":"EHR must provide a consistent way to manage its customer-facing, container-based applications across multiple environments. What should you recommend?","op":[{"t":"GKE clusters registered to a fleet, with Config Sync for consistent configuration, Policy Controller for guardrails, and one CI/CD pipeline deploying to every environment","c":1},{"t":"Separate, hand-configured Kubernetes clusters per environment","c":0},{"t":"A different container platform in each environment","c":0},{"t":"Running each container on its own Compute Engine VM","c":0}],"ex":"Fleet management with GitOps and policy enforcement gives consistent configuration and security across environments, and it reduces the misconfigurations the executive statement blames for outages. Hand-built clusters, one-VM-per-container and mixed platforms all increase inconsistency.","h":"1s5yi"},{"id":"ehr-03","d":1,"s":"ehr","n":1,"st":"EHR requires at least 99.9% availability for all customer-facing systems and lower latency for customers. Which architecture best meets both?","op":[{"t":"Cloud Run functions for every workload, deployed in one zone","c":0},{"t":"One large Compute Engine VM with live migration","c":0},{"t":"Regional GKE clusters spread across zones behind a global external Application Load Balancer with Cloud CDN for cacheable content, Cloud SQL with high availability, and a secondary region for disaster recovery","c":1},{"t":"One zonal GKE cluster and a single Cloud SQL instance","c":0}],"ex":"Zone redundancy (regional GKE, Cloud SQL HA) protects availability, the global load balancer and CDN cut latency for distributed users, and a second region covers regional disasters. Single-zone designs and single VMs can’t reliably deliver 99.9%.","h":"e1d61"},{"id":"ehr-04","d":6,"s":"ehr","n":1,"st":"EHR monitors with various open-source tools, and email alerts are often ignored. The business wants centralized visibility and proactive action on performance and usage. What should you recommend?","op":[{"t":"Send alerts to more email addresses","c":0},{"t":"Centralize metrics and logs in Cloud Monitoring and Cloud Logging, define SLOs for customer-facing services, send SLO burn-rate alerts to an on-call tool such as PagerDuty, and build shared dashboards","c":1},{"t":"Turn off non-critical alerts and rely on users to report problems","c":0},{"t":"Keep each tool and compile weekly reports","c":0}],"ex":"Centralized observability gives one view, and SLO-based alerts to an on-call system create accountable, proactive response, which fixes the ignored-email problem. More recipients, weekly reports or user reports don’t make the response proactive.","h":"105yu"},{"id":"ehr-05","d":3,"s":"ehr","n":1,"st":"EHR manages users in Microsoft Active Directory and wants employees to use their existing credentials for Google Cloud, with users and groups kept in sync. What should you do?","op":[{"t":"Give every user a service account key","c":0},{"t":"Create Google accounts by hand for every employee","c":0},{"t":"Share one administrator account","c":0},{"t":"Use Google Cloud Directory Sync to provision users and groups into Cloud Identity, and configure SAML single sign-on with AD FS (or Microsoft Entra ID) so authentication stays with Microsoft’s identity system","c":1}],"ex":"GCDS keeps Cloud Identity users and groups in step with Active Directory (one way, from AD), and SAML SSO keeps passwords and authentication in the existing identity provider. Workforce Identity Federation is an alternative if you don’t want to sync users at all. Manual accounts drift. Shared accounts and keys break accountability.","h":"1b41c"},{"id":"ehr-06","d":1,"s":"ehr","n":1,"st":"EHR wants to onboard new insurance providers as quickly as possible and build interfaces to ingest and process their data. What should you recommend?","op":[{"t":"Expose standard APIs through Apigee (API products, keys and a developer portal), ingest clinical data into Cloud Healthcare API FHIR or HL7v2 stores, and process events with Pub/Sub and Dataflow","c":1},{"t":"Give each provider a VPN to the production database","c":0},{"t":"Ask providers to email spreadsheets","c":0},{"t":"Build a custom FTP server for each provider","c":0}],"ex":"Self-service onboarding through an API portal shortens the time to connect a provider. The Healthcare API speaks healthcare standards natively and emits Pub/Sub notifications for downstream processing. Per-provider FTP servers, email and direct database VPNs are slow, insecure and hard to scale.","h":"aj4ci"},{"id":"ehr-07","d":2,"s":"ehr","n":1,"st":"EHR wants to provide insights into healthcare trends and make predictions from provider data, while protecting patient privacy. What should you recommend?","op":[{"t":"Copy patient records to analysts’ laptops","c":0},{"t":"Stream data from Cloud Healthcare API FHIR stores into BigQuery, de-identify it for analytics datasets with the Healthcare API de-identification feature (or Sensitive Data Protection), and use BigQuery ML or Agent Platform models for predictions, with Looker for reporting","c":1},{"t":"Train models on identified patient data in a public project","c":0},{"t":"Run reports directly against the production MySQL databases","c":0}],"ex":"BigQuery is the analytics and ML layer, de-identification protects privacy in broadly shared analytics, and BigQuery ML or Agent Platform deliver the predictions. Laptops and public projects break compliance. Reporting against production OLTP databases hurts performance and doesn’t scale.","h":"7qsir"},{"id":"ehr-08","d":3,"s":"ehr","n":1,"st":"Before EHR stores any protected health information in Google Cloud, which step is required for regulatory compliance?","op":[{"t":"Enable Cloud CDN","c":0},{"t":"Move all data to a multi-region bucket","c":0},{"t":"Accept Google Cloud’s Business Associate Agreement (BAA), keep PHI in services the BAA covers, and then apply controls such as least-privilege IAM, VPC Service Controls, CMEK where required, and audit logging","c":1},{"t":"Disable audit logs to protect privacy","c":0}],"ex":"Under HIPAA, Google acts as a business associate, so a BAA must be in place and PHI may only go into covered products. The technical controls follow from there. CDN and multi-region storage don’t address the compliance prerequisite. Disabling audit logs violates HIPAA’s audit requirements.","h":"1a2rv"},{"id":"ehr-09","d":5,"s":"ehr","n":1,"st":"The lease on one of EHR’s colocation facilities is about to expire. Its MySQL and SQL Server databases must move to Google Cloud with minimal downtime and lower administration cost. What should you recommend?","op":[{"t":"Export to CSV and re-import over a weekend","c":0},{"t":"Use Database Migration Service with continuous replication into Cloud SQL for MySQL and Cloud SQL for SQL Server, then cut over in a short window","c":1},{"t":"Rewrite the applications for Bigtable first","c":0},{"t":"Rebuild the databases by hand on Compute Engine VMs","c":0}],"ex":"DMS replicates continuously into managed Cloud SQL instances, so cutover takes minutes, and managed databases reduce administration. That meets both the deadline and the cost goal. VMs keep the administration burden. CSV exports need long downtime. A Bigtable rewrite can’t meet a lease deadline.","h":"e3oq4"},{"id":"ehr-10","d":1,"s":"ehr","n":1,"st":"EHR’s legacy file- and API-based integrations with insurance providers will be replaced over the next several years, and there is no plan to move or upgrade them now. How should they be handled during the migration?","op":[{"t":"Retain them on-premises, connect them to workloads in Google Cloud over Interconnect (with hybrid DNS and routing), and keep the insurer connections running until they are replaced","c":1},{"t":"Lift and shift them to Compute Engine immediately","c":0},{"t":"Rewrite them as microservices before migrating","c":0},{"t":"Shut them down at cutover","c":0}],"ex":"The case study says to maintain the legacy interfaces with connectivity to both on-premises systems and cloud providers, with no plan to move them now. That is a “retain” disposition backed by solid hybrid connectivity. Rewriting or moving them contradicts the stated plan. Shutting them down breaks the insurer integrations.","h":"1emcu"},{"id":"km-01","d":3,"s":"km","n":1,"st":"KnightMotives must comply with EU data protection rules for driver and vehicle data, especially on its autonomous-driving platforms. Which approach best supports this?","op":[{"t":"Copy EU data to a US analytics project for convenience","c":0},{"t":"Store EU data in any region and rely on encryption","c":0},{"t":"Use default encryption and grant partners allUsers access","c":0},{"t":"Keep EU workloads in EU regions with the gcp.resourceLocations organization policy (or an Assured Workloads folder with EU data-residency controls), protect data with CMEK or Cloud EKM, de-identify personal data with Sensitive Data Protection where possible, and use EU regional endpoints for AI services","c":1}],"ex":"Data-residency controls, customer-controlled keys, de-identification and regional AI endpoints together address GDPR-style requirements on location, access and minimization. Encryption alone doesn’t control location. Moving EU data to the US and public access both break the requirement.","h":"12zt7"},{"id":"km-02","d":1,"s":"km","n":1,"st":"KnightMotives wants to monetize driving and road-condition data with insurers and city planners without exposing raw personal data. What should you recommend?","op":[{"t":"Give partners direct access to the production databases","c":0},{"t":"Email CSV extracts to buyers","c":0},{"t":"Publish curated, de-identified datasets through BigQuery sharing (formerly Analytics Hub), and use data clean rooms with analysis rules for joint analysis with partners’ data","c":1},{"t":"Sell full raw telemetry under an NDA","c":0}],"ex":"BigQuery sharing publishes governed listings without copying data, and data clean rooms let partners analyze joined data under privacy-preserving rules without seeing raw rows. Emailed extracts, production access and raw telemetry sales all leak personal data and give up control.","h":"1r2ql"},{"id":"km-03","d":2,"s":"km","n":1,"st":"Vehicles in rural areas lose connectivity for hours, but real-time AI features and data uploads must keep working as well as possible. Which design fits best?","op":[{"t":"Stream raw video continuously over satellite","c":0},{"t":"Run latency-critical AI on the vehicle with an edge model, buffer telemetry locally, upload store-and-forward to Pub/Sub when connected, and make cloud processing idempotent","c":1},{"t":"Upload data only through dealers’ Wi-Fi","c":0},{"t":"Require constant connectivity and disable features while offline","c":0}],"ex":"Edge inference keeps critical features working offline, local buffering prevents data loss, and idempotent processing in the cloud handles retried and late uploads. Requiring constant connectivity or streaming raw video ignores the stated constraint. Dealer-only uploads happen far too rarely.","h":"1v7q1"},{"id":"km-04","d":2,"s":"km","n":1,"st":"KnightMotives needs better connectivity between its manufacturing plants and headquarters, plus a hybrid cloud strategy that keeps some systems on-premises. What should you recommend?","op":[{"t":"Build a separate network for each plant with no central management","c":0},{"t":"Connect every site over the public internet only","c":0},{"t":"Use Cloud Interconnect at major sites and Network Connectivity Center as a hub (with SD-WAN router appliances or VPN spokes for plants), and run Google Distributed Cloud at plants that need local processing","c":1},{"t":"Move every plant system to the cloud this quarter","c":0}],"ex":"Network Connectivity Center gives managed hub-and-spoke connectivity (any-to-any in mesh mode) across sites and VPCs, and Google Distributed Cloud runs workloads locally where latency or connectivity requires it, which suits a gradual hybrid strategy. The internet alone has no performance guarantees. A big-bang migration conflicts with gradual modernization. Unmanaged per-plant networks deepen the fragmentation.","h":"pgwgh"},{"id":"km-05","d":2,"s":"km","n":1,"st":"KnightMotives’ AI infrastructure is obsolete. It needs large-scale model training and a robust simulation environment for autonomous driving. What should you recommend?","op":[{"t":"Use one very large VM","c":0},{"t":"Buy new on-premises GPU servers for each team","c":0},{"t":"Run training on Cloud Run functions","c":0},{"t":"Use AI Hypercomputer: GKE (or Cluster Director) with GPUs or TPUs for training, Batch with Spot VMs for large fault-tolerant simulation runs, Dynamic Workload Scheduler to obtain scarce accelerator capacity, and Agent Platform for MLOps","c":1}],"ex":"AI Hypercomputer combines accelerators, orchestration and consumption options (Spot, flex-start, calendar mode) for large-scale training and simulation, and Agent Platform adds pipelines and a model registry. Buying on-premises servers repeats the obsolescence problem. Functions and single VMs can’t run distributed training at scale.","h":"x9qsv"},{"id":"km-06","d":1,"s":"km","n":1,"st":"KnightMotives’ online build-to-order system is unreliable and doesn’t give dealers accurate data. Orders and inventory must stay consistent across regions. What should you recommend?","op":[{"t":"Rebuild ordering as services on Cloud Run or GKE, with Spanner for globally consistent orders and inventory, Apigee for dealer and partner APIs, and Pub/Sub events to integrate with ERP and supply-chain systems","c":1},{"t":"Let each dealer keep its own order spreadsheet","c":0},{"t":"Keep the monolith and add servers","c":0},{"t":"Store orders as files in Cloud Storage","c":0}],"ex":"Spanner provides strongly consistent, highly available transactions across regions. Managed services add reliability, Apigee standardizes dealer access, and events decouple the legacy ERP. More servers on a monolith don’t fix data accuracy. Files and spreadsheets aren’t transactional systems.","h":"1qj7o"},{"id":"km-07","d":3,"s":"km","n":1,"st":"After past data breaches, KnightMotives needs a comprehensive security framework, threat detection and an incident response plan. What should you recommend?","op":[{"t":"Install antivirus on every server and stop there","c":0},{"t":"Block all internet access permanently","c":0},{"t":"Security Command Center Enterprise for posture and threat detection, Google Security Operations (SIEM and SOAR) for detection and automated response playbooks, Mandiant services for incident-response readiness, and security awareness training","c":1},{"t":"Rely on Google’s infrastructure security alone","c":0}],"ex":"SCC Enterprise covers posture, misconfigurations and threats, Google SecOps centralizes detection and automates playbooks, and Mandiant helps build and test incident response, while training addresses the human factor the case highlights. Antivirus alone, or relying only on Google’s side of the shared-responsibility model, leaves gaps. Blocking the internet isn’t viable.","h":"qe1dl"},{"id":"km-08","d":1,"s":"km","n":1,"st":"KnightMotives must give dealers modern tools for sales, service and inventory, but dealers have no budget for new equipment. What should you recommend?","op":[{"t":"Require dealers to buy new workstations","c":0},{"t":"Deliver browser- and mobile-based applications hosted on Cloud Run or GKE, secured with Identity Platform or IAP, that run on dealers’ existing devices","c":1},{"t":"Install thick-client software that needs a database on site","c":0},{"t":"Ship new servers to every dealer","c":0}],"ex":"Cloud-hosted web and mobile apps need no new hardware and update centrally, and Identity Platform or IAP handle secure dealer sign-in. Every other option requires new dealer equipment or on-site infrastructure, which the case rules out.","h":"1upzc"},{"id":"km-09","d":1,"s":"km","n":1,"st":"KnightMotives’ supply chain runs on an outdated mainframe, and its ERP makes new promotions hard to implement. The company wants to modernize gradually. Which approach fits best?","op":[{"t":"Rewrite the mainframe in one big-bang project","c":0},{"t":"Lift and shift the mainframe onto one Compute Engine VM","c":0},{"t":"Leave everything as it is","c":0},{"t":"Wrap mainframe functions in APIs managed through Apigee, replicate mainframe data to BigQuery (for example with Mainframe Connector), and replace capabilities step by step (the strangler pattern) while evaluating a modern SaaS ERP","c":1}],"ex":"Exposing legacy functions as APIs and moving data into BigQuery lets new services and analytics grow around the mainframe, and replacing capabilities step by step lowers risk. A SaaS ERP may be the right buy decision. A big-bang rewrite is high-risk. Doing nothing blocks the business goals. A mainframe can’t be lifted and shifted onto a VM.","h":"sh0iv"},{"id":"km-10","d":4,"s":"km","n":1,"st":"KnightMotives wants a comprehensive CRM to track customer interactions and personalize experiences. Which workload disposition is most appropriate?","op":[{"t":"Buy a SaaS CRM and integrate it with Google Cloud (for example through Application Integration or Integration Connectors, with BigQuery for a customer 360 view)","c":1},{"t":"Build a custom CRM from scratch on GKE","c":0},{"t":"Use spreadsheets","c":0},{"t":"Extend the mainframe with a CRM module","c":0}],"ex":"CRM is a commodity capability, so buying SaaS and integrating it is faster and cheaper than building one, and BigQuery joins CRM data with vehicle and service data for personalization. A custom build spends scarce engineering effort on something that doesn’t differentiate KnightMotives. The mainframe and spreadsheets can’t meet the requirement.","h":"7rogn"},{"id":"km-11","d":4,"s":"km","n":1,"st":"KnightMotives wants to upskill employees, attract talent and improve communication between business and technical teams during its transformation. Which approach best supports this?","op":[{"t":"Set up a cloud center of excellence, provide role-based learning paths and labs in Google Skills, and hold regular architecture reviews that include business stakeholders, with decisions and KPIs documented and shared","c":1},{"t":"Keep business and IT planning separate","c":0},{"t":"Send everyone a reading list once","c":0},{"t":"Outsource all technical work permanently","c":0}],"ex":"A center of excellence, structured role-based training and shared decision forums build skills and alignment, which is what the change-management and stakeholder objectives in section 4.2 cover. A one-off reading list doesn’t build skills. Permanent outsourcing works against upskilling. Keeping planning separate makes the communication problem worse.","h":"2kvw3"}],"ui":{"title":"PCA Flashcards","short":"PCA Cards","key":"pca-flashcards-v1","source":"the PCA Study Portal content","decks":{"concept":"Concepts","service":"Services & features","signal":"Signals","trap":"Traps","number":"Numbers","waf":"Well-Architected","case":"Case studies","name":"Product names","fact":"Exam facts","objective":"Syllabus"},"deckGroups":[["Core",["concept","service","signal"],"Concepts are Q&A on the cheat sheet. Services & features turns every decision table and feature list into cards. Signals are the phrases a question uses and what they point to."],["Exam craft",["trap","number","waf"],"The traps the exam sets, the numbers worth memorizing, and the Well-Architected principles to recognize in answers."],["Reference",["case","name","fact","objective"],"The four case studies (requirement to answer), the product names the exam now uses, exam facts and dated changes, and the syllabus objectives."]],"sets":{"d1":"Domain 1 · Design & planning","d2":"Domain 2 · Provisioning","d3":"Domain 3 · Security & compliance","d4":"Domain 4 · Processes","d5":"Domain 5 · Implementation","d6":"Domain 6 · Operations","alto":"Altostrat Media","cym":"Cymbal Retail","ehr":"EHR Healthcare","km":"KnightMotives Automotive"},"setGroups":[["By domain",["d1","d2","d3","d4","d5","d6"],"Practice questions for each of the six exam domains, with the reasoning behind every answer."],["Case studies",["alto","cym","ehr","km"],"Questions on each of the four case studies. Two of them appear on every exam."]],"setOrder":["d1","d2","d3","d4","d5","d6","alto","cym","ehr","km"],"text":{"searchCards":"Search: a term or product","searchMcq":"Search: a word, product or case study","noMatch":"No matches. Try a product name like Spanner, or a single word.","noteCards":"The cards come from the cheat sheet, the case studies, the product names and the syllabus, checked against Google’s documentation. A capped session starts with cards you have not marked as known.","noteMcq":"Practice questions for each exam domain and each case study, with the reasoning behind every answer. A capped session starts with unanswered, then missed, questions."},"setShort":{"d1":"Domain 1","d2":"Domain 2","d3":"Domain 3","d4":"Domain 4","d5":"Domain 5","d6":"Domain 6","alto":"Altostrat Media","cym":"Cymbal Retail","ehr":"EHR Healthcare","km":"KnightMotives Automotive"},"defaultSel":{"mode":"cards","decks":["concept","service","signal","trap"],"sets":["d1","d2","d3","d4","d5","d6","alto","cym","ehr","km"],"doms":[],"show":"all","order":"seq","size":{"cards":20,"mcq":0}}}}</script>
<script>/* Flashcards: one offline file, two modes (concept cards and exam MCQs), progress kept in this browser.
   The guide supplies the cards, questions and DATA.ui (names, deck and set lists, storage key); see tools/build-flashcards.mjs. */
(() => {
'use strict';
const DATA = JSON.parse(document.getElementById('fc-data').textContent);
const UI = DATA.ui;
const KEY = UI.key;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// **bold** and `code` only; bold never reaches inside a code span (e.g. `Read(**/.env)`), and paths may break after an inner /
const md = s => esc(s).split('`').map((seg, i) => (i % 2 ? `<code>${seg.replace(/(\w)([/\\])(?=\S)/g, '$1$2<wbr>').replace(/([A-Za-z0-9])_(?=[A-Za-z0-9])/g, '$1_<wbr>')}</code>` : seg.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'))).join('').replace(/\n/g, '<br>');
const plain = s => String(s == null ? '' : s).replace(/\*\*|`/g, '');
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const LET = i => String.fromCharCode(65 + i);
// Usage events for the hosted copy's log (site/track.js); in the standalone file nothing listens.
const emit = (t, d) => { try { document.dispatchEvent(new CustomEvent('guides:track', { detail: { ...d, t } })); } catch { } };
const NUMW = ['', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE'];
const join = a => (a.length > 1 ? a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1] : a[0] || '');
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

const ICONS = {
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  left: '<path d="M15 5l-7 7 7 7"/>',
  right: '<path d="M9 5l7 7-7 7"/>',
  down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  star: '<path d="M12 3.6l2.55 5.2 5.75.84-4.16 4.05.98 5.72L12 16.72l-5.12 2.69.98-5.72L3.7 9.64l5.75-.84z"/>',
  sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  eye: '<path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/>',
  quiz: '<path d="M9.2 9a2.9 2.9 0 1 1 3.9 2.7c-.7.3-1.1.9-1.1 1.6v.7M12 17.4v.1"/><circle cx="12" cy="12" r="9.5"/>',
  play: '<path d="M8 5.5v13l10-6.5z"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8v.1"/>',
  redo: '<path d="M20 12a8 8 0 1 1-2.34-5.66M20 4.5V9h-4.5"/>',
  shuffle: '<path d="M3 7h3c2.2 0 3.3 1.2 4.4 3.1l2.2 3.8C13.7 15.8 14.8 17 17 17h4M18 14l3 3-3 3M3 17h3c1.3 0 2.2-.4 3-1.2M14 8.2c.8-.8 1.7-1.2 3-1.2h4M18 4l3 3-3 3"/>',
  x: '<path d="M7 7l10 10M17 7L7 17"/>',
};
const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

const { decks: DECKS, deckGroups: DECK_GROUPS, sets: SETS, setGroups: SET_GROUPS } = UI;
const SIZES = { cards: [[10, '10'], [20, '20'], [50, '50'], [0, 'All']], mcq: [[10, '10'], [20, '20'], [0, 'All']] };
const DEFAULT_SEL = UI.defaultSel;

const cards = DATA.cards, mcqs = DATA.mcqs;
const byId = new Map();
for (const c of cards) byId.set(c.id, { kind: 'card', it: c });
for (const q of mcqs) byId.set(q.id, { kind: 'mcq', it: q });
const DOM = Object.fromEntries(DATA.domains.map(d => [d.n, d]));
const trapName = code => (DATA.traps[code] || {}).n || '';

// ---------- persistence (browser-only; the page works without it) ----------
// Marks carry the item's content hash (h): if a card's text changes, its old mark no longer applies.
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
const saved = load();
const S = {
  known: {}, star: {}, res: {},
  cfg: Object.assign({ theme: 'auto', scale: 1, readMode: false, keys: true }, saved.cfg),
  sel: Object.assign({}, DEFAULT_SEL, saved.sel),
  sessions: { cards: null, mcq: null },
};
// Marks saved without a content hash cannot be matched to what they were made on, so they are dropped.
for (const [id, v] of Object.entries(saved.known || {})) if (byId.has(id) && typeof v === 'string') S.known[id] = v;
for (const [id, v] of Object.entries(saved.star || {})) if (byId.has(id) && typeof v === 'string') S.star[id] = v;
for (const [id, r] of Object.entries(saved.res || {})) if (byId.has(id) && r && r.h) S.res[id] = r;
Object.assign(S.sessions, saved.sessions || {});
if (saved.sess && !saved.sessions && saved.sess.mode) S.sessions[saved.sess.mode] = saved.sess;
S.sel.decks = (S.sel.decks || []).filter(k => DECKS[k]);
S.sel.sets = (S.sel.sets || []).filter(k => SETS[k]);
S.sel.doms = (S.sel.doms || []).filter(n => n === 0 || DOM[n]);
S.sel.size = Object.assign({}, DEFAULT_SEL.size, typeof S.sel.size === 'object' ? S.sel.size : {});
if (!['cards', 'mcq'].includes(S.sel.mode)) S.sel.mode = 'cards';
for (const m of ['cards', 'mcq']) {
  const s = S.sessions[m];
  if (!s || !Array.isArray(s.ids)) { S.sessions[m] = null; continue; }
  const keep = id => byId.has(id) && byId.get(id).kind === (m === 'cards' ? 'card' : 'mcq');
  const pos = Math.min(Math.max(0, s.pos | 0), s.ids.length);
  s.pos = s.ids.slice(0, pos).filter(keep).length;       // stay on the same card when earlier ones are gone
  s.ids = s.ids.filter(keep);
  if (!s.ids.length) { S.sessions[m] = null; continue; }
  s.mode = m; s.pos = Math.min(s.pos, s.ids.length);
  s.rev = s.rev || {}; s.ans = s.ans || {}; s.got = s.got || []; s.again = s.again || []; s.missed = s.missed || [];
  if (!s.seen) s.seen = Object.fromEntries([...s.ids.slice(0, s.pos + 1), ...s.got, ...s.again, ...Object.keys(s.ans)].filter(id => byId.has(id)).map(id => [id, 1]));
  if (s.hs) for (const box of [s.ans, s.rev]) for (const k of Object.keys(box)) { const id = k.split('#')[0]; if (s.hs[id] && byId.has(id) && s.hs[id] !== byId.get(id).it.h) delete box[k]; }
}
const kOf = it => { const v = S.known[it.id]; if (!v) return undefined; const i = v.indexOf(':'); return v.slice(i + 1) === it.h ? Number(v.slice(0, i)) : undefined; };
const isKnown = it => kOf(it) === 1;
const isStar = it => S.star[it.id] === it.h;
const resOf = it => { const r = S.res[it.id]; return r && r.h === it.h ? r : null; };
let saveT = 0;
const write = () => { clearTimeout(saveT); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } };
const save = () => { clearTimeout(saveT); saveT = setTimeout(write, 150); };
addEventListener('pagehide', write);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') write(); });

// ---------- theme and text size ----------
// A host page (e.g. an Artifact viewer) may stamp its own data-theme before we run; "Auto" follows it.
const hostTheme = document.documentElement.dataset.theme || null;
function applyCfg() {
  const r = document.documentElement;
  const want = S.cfg.theme === 'auto' ? hostTheme : S.cfg.theme;
  if (want) r.dataset.theme = want; else delete r.dataset.theme;
  r.style.setProperty('--scale', S.cfg.scale);
  const dark = want === 'dark' || (!want && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => { m.content = dark ? '#0B1628' : '#F3F6FB'; });
}
applyCfg();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyCfg);

// ---------- announcements and focus ----------
let srT = 0;
function announce(msg) { const r = $('#sr'); if (!r) return; clearTimeout(srT); r.textContent = ''; srT = setTimeout(() => { r.textContent = msg; }, 60); }
const focusVisibleNow = () => { const a = document.activeElement; try { return !!a && a !== document.body && a.matches(':focus-visible'); } catch (e) { return false; } };
// Re-renders replace nodes; put focus back on the same control, or on a sensible fallback when it is gone.
function keepFocus(fn, fallback) {
  const a = document.activeElement;
  const had = !!a && a !== document.body && document.contains(a);
  const ds = had && a.dataset && a.dataset.act ? a.tagName.toLowerCase() + ['act', 'k', 'n', 'm', 'i'].filter(k => a.dataset[k] != null).map(k => `[data-${k}="${CSS.escape(a.dataset[k])}"]`).join('') : '';
  const aId = had ? a.id : '';
  fn();
  if (!had || document.contains(a)) return;
  const usable = t => !!t && t.isConnected && !t.disabled && !t.closest('[hidden]');
  let t = [ds && document.querySelector(ds), aId && document.getElementById(aId)].find(usable);
  if (!t && fallback) t = [...document.querySelectorAll(fallback)].find(usable);
  if (!t) return;
  if (!/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(t.tagName) && !t.hasAttribute('tabindex')) t.tabIndex = -1;
  t.focus({ preventScroll: true });
}

// ---------- selection ----------
const effDoms = sel => (sel.mode === 'mcq' ? sel.doms.filter(Boolean) : sel.doms);
// One predicate for counting and filtering: a domain includes its own items and the cross-domain items tagged with it.
const inDom = (it, n) => (n === 0 ? !it.d : it.d === n || (!it.d && !!it.ds && it.ds.includes(n)));
const domOk = (it, doms) => !doms.length || doms.some(n => inDom(it, n));
const showOk = (it, mode, show) => {
  if (show === 'star') return isStar(it);
  if (mode === 'cards') return show === 'learn' ? !isKnown(it) : true;
  const r = resOf(it);
  if (show === 'new') return !r;
  if (show === 'missed') return !!r && !r.ok;
  return true;
};
const inSets = (it, sel) => (sel.mode === 'cards' ? sel.decks.includes(it.k) : sel.sets.includes(it.s));
function pool(sel = S.sel) {
  const doms = effDoms(sel);
  if (sel.mode === 'cards') {
    const order = DECK_GROUPS.flatMap(g => g[1]).filter(k => sel.decks.includes(k));
    return cards.filter(c => inSets(c, sel) && domOk(c, doms) && showOk(c, 'cards', sel.show)).sort((a, b) => order.indexOf(a.k) - order.indexOf(b.k));
  }
  return mcqs.filter(q => inSets(q, sel) && domOk(q, doms) && showOk(q, 'mcq', sel.show));
}
const shuffle = a => { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
// A capped session takes what you have not learned yet first: unknown cards; unanswered, then missed, questions.
function buildList(sel = S.sel) {
  let list = pool(sel);
  if (sel.order === 'shuf') list = shuffle(list);
  const size = sel.size[sel.mode] || 0;
  if (size && list.length > size) {
    const rank = sel.mode === 'cards' ? it => (isKnown(it) ? 1 : 0) : it => { const r = resOf(it); return !r ? 0 : r.ok ? 2 : 1; };
    list = list.map((it, i) => [it, rank(it), i]).sort((a, b) => a[1] - b[1] || a[2] - b[2]).map(x => x[0]).slice(0, size);
  }
  return list;
}
function sessionLabel(sel) {
  // Name the sets in the order their items appear (official samples first, then the forms).
  const SET_ORDER = UI.setOrder, DECK_ORDER = DECK_GROUPS.flatMap(g => g[1]);
  const names = sel.mode === 'cards' ? DECK_ORDER.filter(k => sel.decks.includes(k)).map(k => DECKS[k]) : SET_ORDER.filter(k => sel.sets.includes(k)).map(k => SETS[k]);
  let l = names.length > 2 ? `${names[0]} + ${names.length - 1} more` : names.join(' + ');
  const doms = effDoms(sel);
  if (doms.length) l += ' · ' + doms.map(n => (n ? 'D' + n : 'General')).join(', ');
  const SHOWL = { learn: 'to learn', star: 'starred', missed: 'missed', new: 'unanswered' };
  if (SHOWL[sel.show]) l += ' · ' + SHOWL[sel.show];
  return l;
}
const SS = () => S.sessions[S.sel.mode];
// Reveal state belongs to a position's occurrence of a card, so a re-queued copy comes back face down.
const occKey = (s, pos) => { const id = s.ids[pos]; let n = 0; for (let j = 0; j <= pos; j++) if (s.ids[j] === id) n++; return n > 1 ? `${id}#${n}` : id; };
function startSession(ids, label, mode, pos = 0) {
  S.sel.mode = mode;
  S.sessions[mode] = { mode, ids, pos, label, rev: {}, ans: {}, got: [], again: [], missed: [], seen: {}, hs: Object.fromEntries(ids.map(id => [id, byId.get(id).it.h])), done: false };
  save();
  emit('session_start', { mode, label, n: ids.length });
  go('study');
}

// ---------- routing (hash, so the phone's back button behaves) ----------
let view = 'home', skipPop = false;
function go(v) {
  view = v;
  try {
    if (v === 'study') { if (history.state && history.state.v === 'study') history.replaceState({ v: 'study' }, '', '#study'); else history.pushState({ v: 'study' }, '', '#study'); }
    else history.replaceState(null, '', '#home');
  } catch (e) { /* file:// quirks */ }
  render();
}
function goHome() {
  if (history.state && history.state.v === 'study') { try { history.back(); return; } catch (e) { /* fall through */ } }
  view = 'home';
  try { history.replaceState(null, '', '#home'); } catch (e) { /* ignore */ }
  render(); scrollTo(0, 0);
}
addEventListener('popstate', () => {
  if (skipPop) { skipPop = false; return; }
  if (sheetOpen) { closeSheet({ fromPop: true }); return; }
  if (!/^#(study|home)?$/.test(location.hash)) { try { history.replaceState(history.state, '', view === 'study' ? '#study' : '#home'); } catch (e) { /* ignore */ } return; }
  const s = SS();
  view = location.hash === '#study' && s && !s.done ? 'study' : 'home';
  if (location.hash === '#study' && view === 'home') { skipPop = true; try { history.back(); } catch (e) { skipPop = false; } }
  render();
  scrollTo(0, 0);
});
function render() {
  haltNav();
  if (sheetOpen) closeSheet({ instant: true });
  const a = document.activeElement, had = a && a !== document.body && a.isConnected;
  if (view === 'study' && SS()) renderStudy(); else { view = 'home'; renderHome(); }
  // The control that had focus was replaced: continue from the new view's heading.
  if (had && !a.isConnected) { const t = $('#focus') || $('#main'); if (t) t.focus({ preventScroll: true }); }
}

// ---------- home ----------
let query = '', srchT = 0, pendingOpen = null;
function renderHome() {
  const mode = S.sel.mode;
  $('#app').innerHTML = `<main id="main" class="home wrap" tabindex="-1">
    <header class="top"><div class="grow"><h1>${esc(UI.title)}</h1><p class="sub">${cards.length} cards · ${mcqs.length} questions · offline</p></div>
      <button class="iconbtn" data-act="settings" aria-label="Settings" aria-haspopup="dialog">${icon('sliders')}</button></header>
    <div class="mode seg big" role="group" aria-label="Mode">
      <button aria-pressed="${mode === 'cards'}" data-act="mode" data-m="cards">Flashcards<span class="n">${cards.length}</span></button>
      <button aria-pressed="${mode === 'mcq'}" data-act="mode" data-m="mcq">MCQs<span class="n">${mcqs.length}</span></button>
    </div>
    <div class="seg style" role="group" aria-label="Style">
      <button aria-pressed="${!S.cfg.readMode}" data-act="style" data-k="quiz">${icon('quiz')}Quiz me</button>
      <button aria-pressed="${S.cfg.readMode}" data-act="style" data-k="read">${icon('eye')}Just read</button>
    </div>
    <div class="search" role="search">${icon('search')}<label class="sr-only" for="q">Search ${mode === 'cards' ? 'cards' : 'questions'}</label><input id="q" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="${esc(mode === 'cards' ? UI.text.searchCards : UI.text.searchMcq)}" value="${esc(query)}"><button class="clear" data-act="clearq" aria-label="Clear search"${query ? '' : ' hidden'}>${icon('x')}</button></div>
    <div id="hb"></div>
  </main><div id="ctaw"></div>`;
  const q = $('#q');
  q.addEventListener('input', () => {
    query = q.value;
    pendingOpen = null;
    $('.search .clear').hidden = !query;
    paintHomeBody();
    clearTimeout(srchT);
    srchT = setTimeout(() => { if (query.trim()) announce(`${lastResults.length} result${lastResults.length === 1 ? '' : 's'}`); }, 500);
  });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') q.blur(); });
  paintHomeBody();
}

function paintHomeBody() {
  const sel = S.sel, mode = sel.mode, doms = effDoms(sel);
  const scope = mode === 'cards' ? cards : mcqs;
  const keyOf = it => (mode === 'cards' ? it.k : it.s);
  const counts = {};
  for (const it of scope) if (domOk(it, doms) && showOk(it, mode, sel.show)) counts[keyOf(it)] = (counts[keyOf(it)] || 0) + 1;
  const inSel = it => inSets(it, sel) && showOk(it, mode, sel.show);
  const domCount = n => scope.filter(it => inSel(it) && inDom(it, n)).length;

  const known = cards.filter(isKnown).length;
  const answered = mcqs.filter(resOf);
  const correct = answered.filter(q => resOf(q).ok).length;
  const stars = scope.filter(isStar).length;
  const stats = mode === 'cards'
    ? [[known, 'known'], [cards.length - known, 'to learn'], [stars, 'starred']]
    : [[answered.length, 'answered'], [answered.length ? Math.round(100 * correct / answered.length) + '%' : '–', 'correct'], [answered.length - correct, 'missed']];

  if (query.trim()) {
    $('#hb').innerHTML = searchResults(query);
    const s = SS(), live = s && !s.done && s.pos < s.ids.length;
    // Opening a result would replace a live session: ask in the page (hosted viewers block confirm()).
    $('#ctaw').innerHTML = live && pendingOpen
      ? `<div class="cta"><div class="in col" role="group" aria-labelledby="cf-t"><p class="cfq" id="cf-t">Replace your session (${s.pos + 1} of ${s.ids.length} · ${esc(s.label)}) with these results?</p><div class="row2"><button class="btn" data-act="keep">Keep my session</button><button class="btn pri" data-act="replace" id="replace-yes">Replace it</button></div></div></div>`
      : live ? `<div class="cta"><div class="in"><button class="btn pri resume" data-act="resume">${icon('play')}<span class="two"><b>Resume</b><span>${s.pos + 1} of ${s.ids.length} · ${esc(s.label)}</span></span></button></div></div>` : '';
    return;
  }

  const groups = mode === 'cards' ? DECK_GROUPS : SET_GROUPS;
  const names = mode === 'cards' ? DECKS : SETS;
  const chosen = mode === 'cards' ? sel.decks : sel.sets;
  const allKeys = groups.flatMap(g => g[1]);
  const deckChips = groups.map(([g, keys, cap]) => `<h3 class="grp">${esc(g)}</h3><p class="cap">${esc(cap)}</p><div class="chips">${keys.map(k =>
    `<button class="chip" aria-pressed="${chosen.includes(k)}" data-act="deck" data-k="${k}">${icon('check', 'ck')}${esc(names[k])} <span class="n">${counts[k] || 0}</span></button>`).join('')}</div>`).join('');
  const domChips = `<div class="chips"><button class="chip" aria-pressed="${!doms.length}" data-act="dom" data-n="all">${icon('check', 'ck')}All domains</button>${DATA.domains.map(d =>
    `<button class="chip" style="--dc:var(--d${d.n})" aria-pressed="${doms.includes(d.n)}" data-act="dom" data-n="${d.n}" aria-label="Domain ${d.n}, ${esc(d.name)}: ${domCount(d.n)}">${icon('check', 'ck')}<span class="dot"></span>D${d.n} ${esc(d.nick)} <span class="n">${domCount(d.n)}</span></button>`).join('')}${mode === 'cards'
    ? `<button class="chip" aria-pressed="${doms.includes(0)}" data-act="dom" data-n="0" aria-label="General cards (traps, ladders, method, facts): ${domCount(0)}">${icon('check', 'ck')}General <span class="n">${domCount(0)}</span></button>` : ''}</div>
    <p class="cap">${mode === 'cards' ? 'A domain also brings in the traps, ladders, tips and facts tagged with it.' : 'Domains follow the official blueprint weights.'}</p>`;
  const shows = mode === 'cards' ? [['all', 'All'], ['learn', 'To learn'], ['star', 'Starred']] : [['all', 'All'], ['new', 'Unanswered'], ['missed', 'Missed'], ['star', 'Starred']];
  const seg = (act, cur, opts, label) => `<div class="seg" role="group" aria-label="${label}">${opts.map(([k, l]) => `<button aria-pressed="${String(cur) === String(k)}" data-act="${act}" data-k="${k}">${l}</button>`).join('')}</div>`;
  const bars = DATA.domains.map(d => {
    const inD = scope.filter(it => inDom(it, d.n));
    const v = mode === 'cards' ? inD.filter(isKnown).length : inD.filter(q => { const r = resOf(q); return r && r.ok; }).length;
    const pct = inD.length ? Math.round(100 * v / inD.length) : 0;
